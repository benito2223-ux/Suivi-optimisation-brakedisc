<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suivi optimisation — proto 5 écrans</title>
<style>
/* ══ le chrome, posé une fois (cahier §6) : une grille, six échelles,
      quatre couleurs d'état, deux densités. ══ */
:root{
  --bg:#f6f6f4; --card:#fff; --ink:#1b1b19; --mute:#6e6e73;
  --line:#e2e2dd; --accent:#0a5ad6;
  /* quatre états, et pas plus */
  --ok:#0a7a3d; --ok-bg:#e6f4ec;
  --warn:#8a5a00; --warn-bg:#fdf1dc;
  --bad:#b02020; --bad-bg:#fbe9e9;
  --mute-bg:#f0f0ed;
  /* six échelles typographiques */
  --t1:32px; --t2:22px; --t3:17px; --t4:14px; --t5:12px; --t6:11px;
  --pad:20px; --gap:14px;
  --r:10px;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#16161a; --card:#1e1e24; --ink:#f0f0ee; --mute:#9a9aa2;
         --line:#2e2e36; --accent:#6ea8ff;
         --ok:#4ec98a; --ok-bg:#16301f; --warn:#e0b055; --warn-bg:#332a14;
         --bad:#f08080; --bad-bg:#33191a; --mute-bg:#26262c; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
     font:400 var(--t4)/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
     -webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600}
button{font:inherit;cursor:pointer}
a{color:var(--accent)}

/* ── le bandeau-titre : l'outil dit qui il est et où on est ── */
.top{position:sticky;top:0;z-index:9;background:var(--card);
     border-bottom:1px solid var(--line);padding:10px var(--pad);
     display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.top b{font-size:var(--t3)}
.proto-badge{background:var(--warn-bg);color:var(--warn);border-radius:20px;
             padding:3px 11px;font-size:var(--t6);font-weight:600;letter-spacing:.02em}
.steps{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.step{border:1px solid var(--line);background:transparent;color:var(--mute);
      border-radius:20px;padding:6px 14px;font-size:var(--t5);font-weight:500}
.step:hover{border-color:var(--accent);color:var(--accent)}
.step.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.step .n{opacity:.55;margin-right:5px;font-variant-numeric:tabular-nums}

/* ── la structure ── */
.wrap{max-width:1180px;margin:0 auto;padding:var(--pad)}
.lede{color:var(--mute);font-size:var(--t5);max-width:70ch;margin:0 0 var(--gap)}

/* ── l'écran 1 : les quatre chiffres. le CPP plaquettes en premier. ── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));
      gap:var(--gap);margin-bottom:var(--gap)}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
     padding:15px 17px}
.kpi .lab{font-size:var(--t6);color:var(--mute);text-transform:uppercase;
          letter-spacing:.06em;font-weight:600;margin-bottom:9px}
.kpi .val{font-size:var(--t2);font-weight:650;letter-spacing:-.02em;
          font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .val.hero{font-size:var(--t1);color:var(--ok)}
.kpi .sub{font-size:var(--t6);color:var(--mute);margin-top:7px;line-height:1.45}
.kpi .sub .why{color:var(--mute);font-style:italic}

/* ── les tuiles de ligne ── */
.lignes{display:grid;gap:var(--gap)}
.ligne{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
       overflow:hidden}
.ligne>header{display:flex;align-items:baseline;gap:12px;padding:14px 17px;
              border-bottom:1px solid var(--line);cursor:pointer}
.ligne>header:hover{background:var(--mute-bg)}
.ligne>header h2{font-size:var(--t3)}
.ligne>header .meta{font-size:var(--t6);color:var(--mute)}
.ligne .court{font-size:var(--t5);color:var(--mute);margin-left:auto;text-align:right}

/* ── les postes : une ligne par opération ── */
.postes{padding:0 17px 8px}
.poste{display:grid;grid-template-columns:88px 1fr 132px 108px;gap:14px;
       align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.poste:first-child{border-top:0}
.poste .op{font-weight:600;font-size:var(--t5)}
.poste .op small{display:block;font-weight:400;color:var(--mute);font-size:var(--t6)}
.cpp{font-variant-numeric:tabular-nums}
.cpp .big{font-size:var(--t3);font-weight:650}
.cpp .small{font-size:var(--t6);color:var(--mute)}
.cpp .gain{color:var(--ok);font-weight:600}
.cpp .gain .small{color:var(--ok);opacity:.8}
.absent{color:var(--mute);font-size:var(--t5);font-style:italic}

/* la barre prod → cible */
.route{height:7px;border-radius:4px;background:var(--mute-bg);
       position:relative;overflow:hidden;margin:5px 0 4px}
.route i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:4px}
.route.vide i{background:var(--mute)}
.route-cap{font-size:var(--t6);color:var(--mute);font-variant-numeric:tabular-nums}

/* la pastille de décision — le mot, lisible en 15 s */
.mot{border-radius:6px;padding:5px 10px;font-size:var(--t6);font-weight:700;
     text-align:center;letter-spacing:.03em;white-space:nowrap}
.mot.serie{background:var(--ok-bg);color:var(--ok)}
.mot.pret{background:var(--accent);color:#fff}
.mot.essai{background:var(--warn-bg);color:var(--warn)}
.mot.chiffrer{background:var(--mute-bg);color:var(--mute)}
.mot.rien{background:var(--mute-bg);color:var(--mute);opacity:.65}

/* ── l'écran 2 : saisir un essai ── */
.form{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
      padding:var(--pad)}
.form h3{font-size:var(--t3);margin-bottom:4px}
.form .sous{color:var(--mute);font-size:var(--t5);margin:0 0 18px}
.grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.champ label{display:block;font-size:var(--t6);color:var(--mute);margin-bottom:5px;
             font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.champ input,.champ select,.champ textarea{width:100%;padding:9px 11px;font:inherit;
     border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink)}
.champ input:focus,.champ select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.champ .hint{font-size:var(--t6);color:var(--mute);margin-top:5px}
.btn{margin-top:20px;background:var(--accent);color:#fff;border:0;border-radius:8px;
     padding:11px 22px;font-weight:600;font-size:var(--t4)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ── l'écran 3 : la preuve ── */
.preuves{display:grid;gap:var(--gap)}
.preuve{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
        padding:17px}
.preuve header{display:flex;align-items:baseline;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.preuve header h3{font-size:var(--t3)}
.preuve .qq{color:var(--mute);font-size:var(--t5);margin:0 0 14px}
.paires{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:11px}
.paire{border:1px solid var(--line);border-radius:8px;padding:11px 13px}
.paire .nom{font-size:var(--t5);font-weight:600}
.paire .val{font-size:var(--t3);font-weight:650;font-variant-numeric:tabular-nums;margin:5px 0}
.paire .detail{font-size:var(--t6);color:var(--mute)}

/* la règle de progression, en clair : NConformes sur 5 */
.regle{display:flex;gap:5px;margin:9px 0 5px}
.regle i{width:26px;height:6px;border-radius:3px;background:var(--mute-bg)}
.regle i.ok{background:var(--ok)}
.regle i.bad{background:var(--bad)}

/* ── l'écran 4 : la décision ── */
.dec{display:grid;gap:var(--gap)}
.dec-carte{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
           padding:17px;display:grid;grid-template-columns:150px 1fr;gap:20px;
           align-items:center}
.dec-carte .gros{font-size:var(--t1);font-weight:700;letter-spacing:-.02em;
                 font-variant-numeric:tabular-nums;text-align:center}
.dec-carte .gros small{display:block;font-size:var(--t6);font-weight:400;color:var(--mute);
                      letter-spacing:0;text-transform:uppercase;margin-bottom:5px}
.dec-carte .mot{font-size:var(--t5);padding:8px 14px;margin-bottom:9px}
.dec-carte .pourquoi{font-size:var(--t5);color:var(--mute);line-height:1.55}
.dec-carte .deux{display:flex;gap:26px;margin-top:13px;padding-top:13px;
                 border-top:1px solid var(--line);flex-wrap:wrap}
.dec-carte .deux div{font-size:var(--t6)}
.dec-carte .deux b{display:block;font-size:var(--t3);font-variant-numeric:tabular-nums;
                    margin-top:3px}
.dec-carte .deux b.ok{color:var(--ok)}

/* ── l'écran 5 : la page à emporter ── */
.a4{background:#fff;color:#111;max-width:820px;margin:0 auto;padding:44px 52px;
    border:1px solid var(--line);border-radius:4px;box-shadow:0 2px 18px rgba(0,0,0,.07)}
.a4 h1{font-size:23px;letter-spacing:-.01em}
.a4 .sous{color:#666;font-size:13px;margin:5px 0 26px;padding-bottom:14px;
          border-bottom:2px solid #111}
.a4 h2{font-size:14px;text-transform:uppercase;letter-spacing:.09em;margin:26px 0 10px;
       padding-bottom:5px;border-bottom:1px solid #ddd}
.a4 table{width:100%;border-collapse:collapse;font-size:13px}
.a4 th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.06em;
       color:#666;border-bottom:1px solid #bbb;padding:6px 8px 6px 0;font-weight:600}
.a4 td{padding:7px 8px 7px 0;border-bottom:1px solid #eee;vertical-align:top}
.a4 .num{text-align:right;font-variant-numeric:tabular-nums;padding-right:0}
.a4 .gain{color:#0a7a3d;font-weight:600}
.a4 .note{font-size:11px;color:#666;margin-top:5px}
.a4 .pied{margin-top:30px;padding-top:12px;border-top:1px solid #ddd;font-size:11px;
          color:#666;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.retenir{display:flex;gap:10px;justify-content:center;margin-top:20px}

/* ── l'écran vide, et ce qu'il faut pour le remplir ── */
.vide{background:var(--card);border:1px dashed var(--line);border-radius:var(--r);
      padding:34px;text-align:center;color:var(--mute)}
.vide b{display:block;font-size:var(--t3);color:var(--ink);margin-bottom:7px}

.erreur{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:12px 15px;
        font-size:var(--t5);margin-bottom:var(--gap)}
.note-bas{color:var(--mute);font-size:var(--t6);margin-top:var(--gap);line-height:1.6}

@media print{
  /* `.panneau` et `.depot` y sont ajoutés en v1.0 : le panneau d'import porte un
     sélecteur de fichier et des boutons, qui n'ont rien à faire sur une page
     qu'on emmène à Detlef. */
  .top,.steps,.garder,.retirer,.lede,.note-bas,.panneau,.depot,.rapport{display:none!important}
  body{background:#fff}
  .wrap{max-width:none;padding:0}
  .a4{border:0;box-shadow:none;padding:0;max-width:none}
}
/* ── la source des données : ce qui alimente l'outil, et le moyen de le changer.
      Un outil qui affiche des chiffres sans dire d'où ils viennent ment. ── */
.srcbtn{border:1px solid var(--line);background:transparent;color:var(--mute);
        border-radius:20px;padding:6px 14px;font-size:var(--t5);font-weight:500;
        display:flex;align-items:center;gap:7px}
.srcbtn:hover{border-color:var(--accent);color:var(--accent)}
.srcbtn b{color:var(--ink);font-weight:600}
.srcbtn.reel b{color:var(--ok)}

/* ── le panneau d'import ── */
.panneau{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
         padding:var(--pad);margin-bottom:var(--gap)}
.panneau h3{font-size:var(--t3);margin-bottom:5px}
.panneau .sous{color:var(--mute);font-size:var(--t5);margin:0 0 16px;max-width:75ch}
.depot{border:2px dashed var(--line);border-radius:var(--r);padding:26px 20px;
       text-align:center;color:var(--mute);font-size:var(--t5)}
.depot input[type=file]{font-size:var(--t5);max-width:100%}
.rapport{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
         gap:10px;margin:16px 0}
.rapport>div{background:var(--bg);border:1px solid var(--line);border-radius:8px;
             padding:10px 12px}
.rapport .lab{font-size:var(--t6);color:var(--mute);text-transform:uppercase;
              letter-spacing:.05em;font-weight:600}
.rapport .val{font-size:var(--t3);font-weight:650;font-variant-numeric:tabular-nums;
              margin-top:3px}
.avert{border-left:3px solid var(--warn);background:var(--warn-bg);color:var(--warn);
       padding:10px 13px;border-radius:0 7px 7px 0;font-size:var(--t5);margin-bottom:8px}
.avert.ok-l{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);
     border-radius:8px;padding:9px 15px;font-size:var(--t5);font-weight:500}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primaire{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* ── le CPP obtenu par essai, dans l'écran Preuve ── */
.essais-liste{display:grid;gap:7px;margin-top:12px}
.essai-ligne{display:grid;grid-template-columns:1fr 132px 108px;gap:12px;align-items:center;
             padding:8px 11px;background:var(--bg);border:1px solid var(--line);
             border-radius:7px;font-size:var(--t5)}
.essai-ligne .qui{font-weight:600}
.essai-ligne .qui small{display:block;font-weight:400;color:var(--mute);font-size:var(--t6)}
.essai-ligne .cppb{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.essai-ligne .cppb small{display:block;font-weight:400;color:var(--mute);font-size:var(--t6)}

@media (max-width:760px){
  .poste{grid-template-columns:1fr;gap:7px}
  .dec-carte{grid-template-columns:1fr}
  .a4{padding:24px}
  .essai-ligne{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="top">
  <b>Suivi optimisation · Sept Fons</b>
  <span class="proto-badge" id="badge">PROTO</span>
  <button class="srcbtn" id="srcbtn" type="button" onclick="ouvrirImport()"></button>
  <nav class="steps" id="steps"></nav>
</div>

<div class="wrap" id="vue"></div>

<script>
"use strict";
/* ══ le proto est mono-fichier : le noyau, les données, la projection et le
      rendu sont assemblés ici. C'est la seule page, c'est voulu (cahier §6). ══ */

/* ───────── le noyau —_functions pures, testées avant d'exister ici_───────── */
/* ============================================================================
   PROTO — LE NOYAU
   Fonctions PURES. Aucun DOM, aucun état global, aucune lecture de l'app.
   Ce fichier est écrit et testé AVANT le moindre écran (cahier §5).

   Le CPP plaquettes est le driver (cahier §2) :
     coutOutillage(logements) = Σ prix / (arêtes × charnière)
   C'est le seul chiffre comparable au classeur de Matis.

   Toute absence dit ce qui manque (cahier §4.4). Aucun « — » nu.
   ========================================================================== */

const PROTO_VERSION = "1.0";

/* ---- le formatage, pur lui aussi ---- */
function fmt(v, d) {
  if (v === null || v === undefined || v === "" || isNaN(parseFloat(v))) return "—";
  const n = parseFloat(v);
  return n.toFixed(d === undefined ? 3 : d).replace(".", ",");
}
/* la même chose, mais en gardant le nombre si la saisie est un champ vide :
   utilisé quand on veut distinguer « 0 » de « pas saisi » */
function fmtDispo(v, d, manque) {
  if (v === null || v === undefined || v === "") return manque || "— non saisi";
  if (isNaN(parseFloat(v))) return manque || "— non saisi";
  return fmt(v, d);
}

/* ============================================================================
   1. LE CPP OUTILLAGE — le driver
   ========================================================================== */

/* Le coût d'UN logement : prix de la plaquette divisé par ce qu'elle rend.
   Le prix est en €, les arêtes en nombre d'arêtes, la charnière en pièces.
   -> € par pièce usinée.
   Une donnée manquante ne donne pas 0 : elle donne null (non chiffrable). C'est
   l'invariant 1 du cahier : un absent ne se comble jamais. */
function coutLogement(log) {
  if (!log) return null;
  const prix = parseFloat(log.prix);
  const aretes = parseFloat(log.aretes);
  const charniere = parseFloat(log.charniere);
  if (isNaN(prix) || prix <= 0) return null;
  if (isNaN(aretes) || aretes <= 0) return null;
  if (isNaN(charniere) || charniere <= 0) return null;
  return prix / (aretes * charniere);
}

/* Le CPP outillage d'un scénario = la somme sur TOUS ses logements.
   Le CPP outillage d'un outil, de la même façon. */
function cppOutillageScenario(scenario) {
  if (!scenario || !scenario.outils) return null;
  const parts = [];
  scenario.outils.forEach(o => {
    (o.logements || []).forEach(l => {
      const c = coutLogement(l);
      if (c !== null) parts.push(c);
    });
  });
  if (!parts.length) return null;
  return parts.reduce((a, b) => a + b, 0);
}

function cppOutillageOutil(outil) {
  if (!outil || !outil.logements) return null;
  const parts = (outil.logements || []).map(coutLogement).filter(v => v !== null);
  if (!parts.length) return null;
  return parts.reduce((a, b) => a + b, 0);
}

/* Les CPP par logement, pour l'écran Décision (où part l'argent). */
function cppParLogement(scenario) {
  const out = [];
  (scenario.outils || []).forEach(o => {
    (o.logements || []).forEach(l => {
      out.push({
        outilNumero: o.numero || "?",
        logementNom: l.nom || "?",
        article: l.ref || "",
        cpp: coutLogement(l),
        prix: parseFloat(l.prix),
        aretes: parseFloat(l.aretes),
        charniere: parseFloat(l.charniere)
      });
    });
  });
  return out;
}

/* Le CPP RÉELLEMENT OBTENU par un essai — le prix et les arêtes viennent de la
   définition du logement dans le scénario, la charnière de l'essai lui-même.
   C'est le seul endroit où « ce qu'on a prévu » et « ce qu'on a obtenu » se
   séparent : sans cette fonction, un essai qui tient mieux que prévu ne se voit
   nulle part, et un réimport des essais existants ne rendrait RIEN.

   Invariant 3 : un logement non chiffrable est COMPTE, pas dilué. On renvoie
   donc le total des chiffrables ET le nombre de ceux qui ont été écartés. */
function cppEssai(scenario, essai) {
  const vide = { cpp: null, nbLogements: 0, nonChiffrables: 0 };
  if (!scenario || !essai) return vide;
  const definition = {};                       // logementId -> { prix, aretes }
  (scenario.outils || []).forEach(o => (o.logements || []).forEach(l => {
    definition[l.id] = l;
  }));
  const suivis = (essai.params && essai.params.logements) || [];
  if (!suivis.length) return vide;
  let total = 0, n = 0, ecartes = 0;
  suivis.forEach(p => {
    const def = definition[p.logementId];
    // le prix et les arêtes peuvent aussi être portés par le prélèvement lui-même
    const prix = def && def.prix !== "" && def.prix != null ? def.prix : p.prix;
    const aretes = def && def.aretes !== "" && def.aretes != null ? def.aretes : p.aretes;
    const charniere = (p.charniere !== "" && p.charniere != null)
      ? p.charniere : (def ? def.charniere : null);
    const c = coutLogement({ prix: prix, aretes: aretes, charniere: charniere });
    if (c === null) { ecartes++; return; }
    total += c; n++;
  });
  return {
    cpp: n ? total : null,
    nbLogements: n,
    nonChiffrables: ecartes
  };
}

/* ============================================================================
   2. LE CHEMIN PROD → CIBLE
   ========================================================================== */

/* Combien de chemin a fait le meilleur essai disponible vers la cible CPP ?
   (cahier §4.3 : une cible sans chiffrage reste visible, elle ne disparaît pas)
   Renvoie null si on ne peut pas calculer — et l'appelant affiche pourquoi. */
function cheminCPP(coutProd, coutMeilleur, cible) {
  if (cible === null || cible === undefined || isNaN(parseFloat(cible))) return null;
  if (isNaN(coutProd) || isNaN(coutMeilleur)) return null;
  const c = parseFloat(cible);
  const p = parseFloat(coutProd);
  const m = parseFloat(coutMeilleur);
  // déjà en dessous de la cible : le chemin est fait, 100 %
  if (p <= c) return 100;
  if (p <= 0) return null;
  const pct = ((p - m) / (p - c)) * 100;
  return Math.max(0, Math.min(100, pct));
}

/* ============================================================================
   3. LA PREUVE — conformité, charnière, répétitions
   ========================================================================== */

/* La battement d'un prélèvement. Deux government's selon les mesures :
   EMAG 1 relève DROITE et GAUCHE séparément, l'app ancienne ne remplit `batt`
   que pour les autres scénarios. Sur les données du site, `batt` est vide sur
   83 prélèvements sur 84 — et `battD`/`battG` sont pleines.

   On prend donc `batt` si elle existe, sinon LE PIRE des deux côtés. Le pire,
   pas la moyenne : un état des lieux ne doit jamais flatter une pièce qui
   déborde d'un côté. C'est la seule règle qui ne perd aucune mesure et qui ne
   peut pas rendre conforme ce qui ne l'est pas. */
function battDe(prel) {
  if (!prel) return NaN;
  const b = parseFloat(prel.batt);
  if (!isNaN(b)) return b;
  const cotes = [parseFloat(prel.battD), parseFloat(prel.battG)].filter(v => !isNaN(v));
  if (!cotes.length) return NaN;
  return Math.max.apply(null, cotes);
}

/* Un prélèvement est-il dans la tolérance ? null = « non mesurable », jamais false.
   (cahier §4.1 : un absent ne se comble pas, il se signale) */
function conforme(sc, prel) {
  if (!prel) return null;
  if (sc && sc.battActif === false) return true;   // critère volontairement désactivé
  const limit = sc && sc.limitOverride ? parseFloat(sc.limitValue) : parseFloat(0.12);
  if (isNaN(limit)) return null;
  const b = battDe(prel);
  if (isNaN(b)) return null;
  return b <= limit;
}

/* La charnière visée d'un logement (pour un essai donné). */
function charniereVisee(scenario, essai, logementId) {
  const liste = (essai && essai.params && essai.params.logements) || [];
  const trouve = liste.find(p => p.logementId === logementId);
  if (trouve) {
    const v = parseFloat(trouve.charniere);
    if (!isNaN(v)) return v;
  }
  // repli : la charnière du logement dans le scénario
  let out = null;
  (scenario.outils || []).forEach(o => (o.logements || []).forEach(l => {
    if (l.id === logementId) {
      const v = parseFloat(l.charniere);
      if (!isNaN(v)) out = v;
    }
  }));
  return out;
}

/* Le statut d'un ESSAI : conforme / non conforme / arrêté / en cours.
   L'ordre est délibéré — un arrêt est une décision, pas un échec (§ essaiStats). */
function statutEssai(sc, essai) {
  if (!essai) return { code: "vide", texte: "aucun essai" };
  const prels = essai.prelevements || [];
  if (essai.cloture && essai.cloture.motif) {
    return { code: "arrete", texte: "arrêté — " + (essai.cloture.motif || "sans motif") };
  }
  const mesures = prels.map(p => conforme(sc, p));
  const evalues = mesures.filter(v => v !== null);
  if (!prels.length) return { code: "attente", texte: "aucun prélèvement" };
  if (evalues.some(v => v === false)) {
    const premier = prels[mesures.indexOf(false)];
    return {
      code: "nonconforme",
      texte: "hors tolérance",
      piece: premier ? parseFloat(premier.piece) : null
    };
  }
  const manquantes = prels.length - evalues.length;
  // la charnière : chaque logement suivi doit être atteint
  const suivis = (essai.params && essai.params.logements) || [];
  const restants = [];
  suivis.forEach(p => {
    const cible = charniereVisee(sc, essai, p.logementId);
    if (isNaN(cible) || cible === null) return;
    const pieces = prels.map(x => parseFloat(x.piece)).filter(v => !isNaN(v));
    const derniere = pieces.length ? Math.max(...pieces) : null;
    if (derniere === null || derniere < cible) {
      restants.push({
        logementNom: p.logementNom || "?",
        dernier: derniere === null ? 0 : derniere,
        cible: cible
      });
    }
  });
  if (restants.length) {
    return {
      code: "encours",
      texte: restants.map(r => r.logementNom + " " + r.dernier + "/" + r.cible).join(" · ") + " p"
    };
  }
  if (manquantes > 0) {
    return { code: "attente", texte: manquantes + " mesure" + (manquantes > 1 ? "s" : "") + " à saisir" };
  }
  return { code: "conforme", texte: "conforme — charnière atteinte" };
}

/* Le statut d'un SCÉNARIO : c'est le verdict de la décision (écran 4).
   séries = validé en prod, valide = validé 5× mais pas encore en prod. */
function statutScenario(sc) {
  const essais = sc.essais || [];
  const verdi = essais.map(e => statutEssai(sc, e));
  if (sc.statut === "serie") return { code: "serie", texte: "en série" };
  const conformes = verdi.filter(v => v.code === "conforme").length;
  if (conformes >= (sc.validationThreshold || 5)) {
    return { code: "valide", texte: "validé 5× — à passer en série", validations: conformes };
  }
  if (essais.length) return { code: "encours", texte: "essai en cours", validations: conformes };
  return { code: "opportunite", texte: "rien d'essayé" };
}

/* ============================================================================
   4. LE VERDICT D'UN POSTE — ce que l'écran 1 montre, et l'écran 4 tranche
   ========================================================================== */

/* Un poste = une opération sur une ligne. Il a une prod (scénario de base),
   peut-être des essais, et une cible CPP du site.
   Renvoie tout ce dont les écrans ont besoin — mais le CALCUL est ici, jamais
   dans le rendu (cahier §5). */
function verdictPoste(ref, op, scenarios) {
  const scs = scenarios || (op && op.scenarios) || [];
  const prod = scs.find(s => s.baseline) || scs.find(s => /base excel/i.test(s.name || ""));
  const cppProd = prod ? cppOutillageScenario(prod) : null;
  const cible = ref && ref.cibleCPP !== "" && ref.cibleCPP != null && !isNaN(parseFloat(ref.cibleCPP))
    ? parseFloat(ref.cibleCPP) : null;

  // le MEILLEUR essai disponible : celui dont le CPP outillage est le plus bas
  let meilleur = null;
  scs.forEach(s => {
    if (prod && s.id === prod.id) return;
    const cpp = cppOutillageScenario(s);
    if (cpp === null) return;
    if (!meilleur || cpp < meilleur.cpp) meilleur = { sc: s, cpp: cpp };
  });

  const chemin = (cppProd !== null && meilleur) ? cheminCPP(cppProd, meilleur.cpp, cible) : null;

  // le statut de la décision
  let verdict;
  const sMeilleur = meilleur ? statutScenario(meilleur.sc) : null;
  if (!prod || cppProd === null) {
    verdict = { code: "achiffrer", texte: cible !== null ? "cible connue, à chiffrer" : "à chiffrer" };
  } else if (sMeilleur && sMeilleur.code === "serie") {
    verdict = { code: "gagne", texte: "gagné — en série" };
  } else if (sMeilleur && sMeilleur.code === "valide") {
    verdict = { code: "pret", texte: "validé 5× — décision à prendre" };
  } else if (meilleur && meilleur.cpp < cppProd) {
    verdict = { code: "essai", texte: "essai prometteur" };
  } else {
    verdict = { code: "rien", texte: "rien à faire ici" };
  }

  // le gain CPP, JAMAIS fusionné avec un autre (§3.4 du cahier) :
  //  - gainProjete : le meilleur essai disponible, pas encore acté
  //  - gainActe : ce qui est réellement passé en série
  let gainProjete = null, gainActe = null;
  if (cppProd !== null && meilleur && meilleur.cpp < cppProd) {
    gainProjete = cppProd - meilleur.cpp;
  }
  const enSerie = scs.filter(s => s.statut === "serie");
  if (cppProd !== null && enSerie.length) {
    const cppSerie = cppOutillageScenario(enSerie[0]);
    if (cppSerie !== null && cppSerie < cppProd) gainActe = cppProd - cppSerie;
  }

  return {
    ref, op, prod, cppProd, cible, chemin,
    meilleur, gainProjete, gainActe, verdict
  };
}

/* Le verdict d'une LIGNE : le CPP outillage total de la prod, et le chemin vers la cible.
   C'est la somme des postes CHIFFRABLES seulement — une OP non chiffrable est
   comptée à part, elle ne se dilue pas dans le total (§3.2 de la constitution). */
function verdictLigne(ligne, postes) {
  let cppProd = 0, cppActe = 0, cppProjete = 0;
  let nonChiffrables = 0, enAttente = 0;
  const liste = [];
  (postes || []).forEach(p => {
    const v = verdictPoste(p.ref, p.op, p.scenarios);
    liste.push(v);
    if (v.cppProd === null) { nonChiffrables++; return; }
    cppProd += v.cppProd;
    if (v.gainActe) cppActe += v.gainActe;
    else if (v.gainProjete) cppProjete += v.gainProjete;
    if (v.verdict.code === "essai") enAttente++;
  });
  return {
    ligne, postes: liste,
    cppProd: cppProd || null,
    cppActe: cppActe || 0,
    cppProjete: cppProjete || 0,
    nonChiffrables, enAttente
  };
}

/* ============================================================================
   5. LA DÉCISION — l'écran 4, en une phrase
   ========================================================================== */

/* Que fait-on de ce poste ? Un seul mot, pour qu'on puisse le lire en 15 s. */
function decisionPoste(v) {
  if (!v) return { mot: "—", pourquoi: "" };
  switch (v.verdict.code) {
    case "gagne":
      return { mot: "SÉRIE", pourquoi: "l'essai est passé en production" };
    case "pret":
      return {
        mot: "DÉCIDER",
        pourquoi: "validé " + (v.verdict.validations || 5) + " fois — il reste à dire oui ou non"
      };
    case "essai":
      return {
        mot: "ESSAYER",
        pourquoi: "l'essai gagne " + fmt(v.gainProjete, 4) + " €/pièce — à confirmer sur " +
                   ((v.meilleur && v.meilleur.sc.validationThreshold) || 5) + " pièces"
      };
    case "achiffrer":
      return { mot: "CHIFFRER", pourquoi: v.verdict.texte };
    default:
      return { mot: "RIEN", pourquoi: "aucun essai ne fait mieux que la prod" };
  }
}

/* ============================================================================
   6. LE RÉCAPITULATIF — l'écran 1 en un objet
   ========================================================================== */

/* Les quatre chiffres du bandeau. Chacun remonte à sa source, et une absence
   dit ce qui manque (invariant 4). */
function recapLignes(verdictsLignes) {
  let cppActe = 0, cppProjete = 0, aChiffrer = 0;
  verdictsLignes.forEach(vl => {
    cppActe += vl.cppActe;
    cppProjete += vl.cppProjete;
    vl.postes.forEach(p => { if (p.verdict.code === "achiffrer") aChiffrer++; });
  });
  /* « À décider » = tout ce qui attend une action : un validé 5× à confirmer, ou un
     essai prometteur à confirmer. Compter seulement les validés 5× donnait « 0 » alors
     que l'écran regorge d'appels à l'action — et un 0 lu comme « rien à faire » est un
     mensonge (§3.5).
     Les codes de verdict sont en ASCII ("pret", pas "prêt") : l'accent ici faisait
     échouer la comparaison en silence et le compte restait à zéro. */
  const decisions = verdictsLignes.reduce((a, vl) =>
    a + vl.postes.filter(p => p.verdict.code === "pret" || p.verdict.code === "essai").length, 0);
  return {
    cppActe,          // €/pièce déjà gagnés, actés en série
    cppProjete,       // €/pièce prometteurs, pas encore actés
    aChiffrer,        // combien de postes sans chiffrage malgré une cible
    decisions         // combien de postes attendent une action de l'atelier
  };
}

/* ───────── la projection des exports de l'ancienne version ───────── */
/* ============================================================================
   PROTO — LA PROJECTION
   Reprend un export de l'ancienne version (format 5, 6, 7 ou 8) et le projette
   vers le modèle du proto. Ce n'est PAS une ressaisie : tout ce qui est lu est
   conservé tel quel, et ce qui est abandonné est compté et nommé.

   Fonction PURE : elle ne touche ni au DOM, ni au disque, ni au réseau. Elle
   prend un objet déjà désérialisé et renvoie un objet. C'est ce qui permet de la
   tester sur les vrais exports du site, en Node, sans navigateur.

   ── ce que la projection garde, et pourquoi ──────────────────────────────────
     prix, arêtes, charnière   → le CPP plaquettes, le driver (cahier §2)
     charnière d'un essai      → le CPP RÉELLEMENT obtenu (cppEssai)
     cibleCPP de la référence  → la cible du site, colonne I du classeur
     prelevements              → la preuve de conformité
     statut "serie"            → ce qui est réellement.acté en production
     plan, photos, marposs,
     scrapLog, backlog         → abandonnés : aucun ne nourrit une décision
                                 d'outillage

   ── pourquoi c'est raisonnable ───────────────────────────────────────────────
   Sur l'export réel du site, ces cinq champs abandonnés pèsent 3,2 Mo sur
   3,27 Mo. Après projection : 56 Ko. Les 135 logements et les 5 essais sont
   intacts. On ne perd pas un chiffre de décision en jetant l'image.
   ========================================================================== */

const IMPORT_VERSION = "1.0";

/* Les champs qu'on prend d'un objet, ou null si on ne prend rien.
   `garder` est plus sûr que lister ce qu'on jette : un champ ajouté par une
   version future de l'app ne peut pas se glisser dans la projection. */
function projeter(source) {
  const vide = {
    ok: false, lignes: [], rapport: null,
    erreur: "Ce fichier n'est pas un export du suivi d'optimisation."
  };
  if (!source || typeof source !== "object") return vide;

  const racines = racinesLignes(source);
  if (!racines) return vide;

  const r = {
    format: source.format != null ? source.format : null,
    toolVersion: source.toolVersion || source.version || null,
    exporteLe: source.exporteLe || null,
    exportePar: source.exportePar || null,
    lignes: 0, references: 0, ops: 0, scenarios: 0,
    essais: 0, prelevements: 0, logements: 0,
    scenariosChiffrables: 0,
    essaisChiffrables: 0,
    scenariosCibles: 0,
    sansPrix: 0, sansAretes: 0, sansCharniere: 0,
    prelevementsSansBatt: 0,
    abandons: ["plans de porte-outil", "photos", "relevés Marposs", "journal de rebut"],
    avertissements: []
  };

  const lignes = [];
  racines.forEach(lBrut => {
    const ligne = {
      id: lBrut.id || ("li" + (lignes.length + 1)),
      nom: lBrut.nom || "Ligne sans nom",
      refs: []
    };
    (lBrut.references || []).forEach(refBrut => {
      const ref = {
        id: refBrut.id || ("re" + (ligne.refs.length + 1)),
        nom: refBrut.nom || "Référence sans nom",
        cibleCPP: cibleOuVide(refBrut.cibleCPP),
        productionAnnuelle: refBrut.productionAnnuelle || "",
        ops: []
      };
      if (parseFloat(ref.cibleCPP) > 0) r.scenariosCibles++;
      r.references++;
      (refBrut.ops || []).forEach(opBrut => {
        const op = {
          id: opBrut.id || ("op" + (ref.ops.length + 1)),
          nom: opBrut.nom || "OP",
          ordre: opBrut.ordre != null ? opBrut.ordre : null,
          code: opBrut.code || codeDeOp(opBrut),
          scs: []
        };
        r.ops++;
        (opBrut.scenarios || []).forEach(scBrut => {
          const sc = {
            id: scBrut.id || ("sc" + (op.scs.length + 1)),
            name: scBrut.name || "Scénario",
            baseline: scBrut.baseline === true,
            statut: scBrut.statut || "",
            validationThreshold: scBrut.validationThreshold || 5,
            battActif: scBrut.battActif,
            limitOverride: scBrut.limitOverride,
            limitValue: scBrut.limitValue,
            emag1: scBrut.emag1,
            outils: [],
            essais: []
          };
          r.scenarios++;
          (scBrut.outils || []).forEach(oBrut => {
            sc.outils.push({
              id: oBrut.id || "",
              numero: oBrut.numero || "",
              description: oBrut.description || "",
              correcteur: oBrut.correcteur || "",
              /* `plan` est délibérément absent : c'est 320 à 370 Ko de géométrie
                 par outil, et pas un chiffre. */
              logements: (oBrut.logements || []).map(lBrut => {
                r.logements++;
                const rempli = trioRempli(lBrut);
                if (!rempli.prix) r.sansPrix++;
                if (!rempli.aretes) r.sansAretes++;
                if (!rempli.charniere) r.sansCharniere++;
                return {
                  id: lBrut.id || "",
                  nom: lBrut.nom || "Logement",
                  ref: lBrut.ref || "",
                  codeArticle: lBrut.codeArticle || "",
                  prix: lBrut.prix != null ? lBrut.prix : "",
                  aretes: lBrut.aretes != null ? lBrut.aretes : "",
                  charniere: lBrut.charniere != null ? lBrut.charniere : "",
                  vc: lBrut.vc != null ? lBrut.vc : "",
                  f: lBrut.f != null ? lBrut.f : ""
                };
              })
            });
          });
          (scBrut.essais || []).forEach(eBrut => {
            const essai = {
              id: eBrut.id || "",
              titre: eBrut.titre || "Essai",
              date: eBrut.date || "",
              operateur: eBrut.operateur || "",
              equipe: eBrut.equipe || "",
              but: eBrut.but || "",
              observations: eBrut.observations || "",
              cloture: eBrut.cloture || null,
              params: { logements: (eBrut.params && eBrut.params.logements) || [] },
              prelevements: []
            };
            r.essais++;
            (eBrut.prelevements || []).forEach(pBrut => {
              r.prelevements++;
              if (isNaN(parseFloat(pBrut.batt)) && isNaN(parseFloat(pBrut.battD))
                  && isNaN(parseFloat(pBrut.battG))) r.prelevementsSansBatt++;
              essai.prelevements.push({
                id: pBrut.id || "",
                piece: pBrut.piece != null ? pBrut.piece : "",
                batt: pBrut.batt != null ? pBrut.batt : "",
                battD: pBrut.battD != null ? pBrut.battD : "",
                battG: pBrut.battG != null ? pBrut.battG : "",
                logementId: pBrut.logementId || "",
                usure: pBrut.usure != null ? pBrut.usure : "",
                pointMesure: pBrut.pointMesure || ""
              });
            });
            sc.essais.push(essai);
          });
          op.scs.push(sc);
        });
        ref.ops.push(op);
      });
      ligne.refs.push(ref);
    });
    lignes.push(ligne);
  });

  r.lignes = lignes.length;
  if (!r.lignes) return vide;

  /* Les deux mesures de qualité d'un import, calculées par le NOYAU et pas
     ici : une projection ne se juge pas elle-même. Elles sont recalculées par
     l'appelant dès que les lignes sont en place. */
  if (!r.essais) {
    r.avertissements.push(
      "Aucun essai dans cet export : les écrans de preuve et de décision resteront vides.");
  }
  if (!r.scenariosCibles) {
    r.avertissements.push(
      "Aucune cible CPP de site : les distances vers la cible ne pourront pas s'afficher.");
  }
  if (r.sansPrix || r.sansAretes || r.sansCharniere) {
    r.avertissements.push(
      (r.sansPrix + r.sansAretes + r.sansCharniere)
      + " logement(s) incomplet(s) sur le trio prix / arêtes / charnière : "
      + "ils resteront non chiffrables, et c'est dit à l'écran.");
  }
  if (r.prelevementsSansBatt) {
    r.avertissements.push(
      r.prelevementsSansBatt + " prélèvement(s) sans battement ni côté D/G : "
      + "ils ne montreront aucune conformité.");
  }
  return { ok: true, lignes: lignes, rapport: r, erreur: null };
}

/* Les racines acceptées. Format 5/7/8 : `lignes` à la racine.
   Format 6 : les lignes sont portées par des projets — on les aplatit. */
function racinesLignes(source) {
  if (Array.isArray(source.lignes) && source.lignes.length) return source.lignes;
  if (Array.isArray(source.projets) && source.projets.length
      && Array.isArray(source.projets[0].lignes)) {
    const plat = [];
    source.projets.forEach(pj => (pj.lignes || []).forEach(l => plat.push(l)));
    return plat.length ? plat : null;
  }
  return null;
}

function cibleOuVide(v) {
  return (v === "" || v === null || v === undefined) ? "" : v;
}

/* Le libellé court d'une opération. L'export ne porte pas `code` : on le
   reconstruit depuis `ordre`, et on retombe sur le nom si `ordre` manque.
   Un `code` déjà présent dans le fichier n'est jamais écrasé — c'est une donnée
   saisie, pas une valeur dérivée. */
function codeDeOp(op) {
  if (op.code) return op.code;
  if (op.ordre != null && !isNaN(parseFloat(op.ordre))) return "OP" + parseFloat(op.ordre);
  const m = /OP\s*0*(\d+)/i.exec(op.nom || "");
  return m ? "OP" + parseInt(m[1], 10) : (op.nom || "OP");
}

/* Le trio prix / arêtes / charnière est-il saisi, membre par membre ?
   ATTENTION à ne pas inverser le sens : le premier jet de cette fonction
   s'appelait `manqueDe` et renvoyait en réalité « la valeur est là ». Les
   compteurs sansPrix / sansAretes / sansCharniere comptaient donc exactement
   l'inverse de ce qu'ils annoncent, et aucun test sur données réelles ne les
   avait remarkés — parce que les exports du site ont le trio complet. Une
   fonction qui compte le contraire de ce qu'elle dit est pire qu'une fonction
   absente : elle donne un faux sentiment de couverture. */
function trioRempli(l) {
  return {
    prix: parseFloat(l.prix) > 0,
    aretes: parseFloat(l.aretes) > 0,
    charniere: parseFloat(l.charniere) > 0
  };
}

/* Le poids de l'import, mesuré SANS dépendre d'un environnement : c'est la
   taille de ce que la projection produit, comparée à celle du fichier lu.
   Une régression ici (un `plan` qui se glisse) se voit immédiatement. */
function poids(jsonSource, projete) {
  let avant = 0, apres = 0;
  try { avant = JSON.stringify(jsonSource).length; } catch (e) { avant = 0; }
  try { apres = JSON.stringify(projete).length; } catch (e) { apres = 0; }
  return {
    avant: avant,
    apres: apres,
    ratio: avant ? Math.round((apres / avant) * 1000) / 1000 : null
  };
}


/* ══════════════════════════════════════════════════════════════════════════
   ÉCRAN 1 — OÙ EN EST-ON
   Le CPP plaquettes en premier citizen (cahier §2). Le temps machine
   n'apparaît pas ici : il n'est pas comparable au classeur.
   ══════════════════════════════════════════════════════════════════════════ */

const ETAT = { ecran: 1, ligne: "l1", op: "o10", sc: "e2", saisi: {}, lignes: JEUX.lignes,
               source: { type: "jeu", nom: "jeu d'exemple", rapport: null, poids: null },
               importOuvert: false, message: null, erreur: null };

/* ── la source affichée dans la bande du haut ──
   Elle dit TOUJOURS d'où viennent les chiffres affichés. Un outil qui ne le dit
   pas laisse croire que ses chiffres sont les siens. */
function sourceHTML() {
  const s = ETAT.source;
  const reel = s.type === "import";
  const poids = s.poids && s.poids.avant
    ? `<span style="color:var(--mute)"> · ${Math.round(s.poids.avant / 1024)} Ko → `
      + `${Math.round(s.poids.apres / 1024)} Ko conservés</span>` : "";
  return `<button class="srcbtn ${reel ? "reel" : ""}" id="srcbtn" type="button"
            onclick="ouvrirImport()">Données : <b>${s.nom}</b>${poids}</button>`;
}

/* les postes de toutes les lignes, passés dans le noyau */
function tousPostes() {
  const out = [];
  ETAT.lignes.forEach(l => (l.refs || []).forEach(r =>
    (r.ops || []).forEach(op =>
      out.push({ ligne: l, ref: r, op, scs: op.scs }))));
  return out;
}
function verdictsLignes() {
  return ETAT.lignes.map(l => verdictLigne(l,
    (l.refs || []).flatMap(r => (r.ops || []).map(op => ({ ref: r, op, scenarios: op.scs })))));
}

/* ── la barre prod → cible. Elle ne SAVAIT pas ce qu'elle mesurait, avant. ── */
function routeHTML(v) {
  if (v.cppProd === null) {
    return `<div class="route vide"></div>
            <div class="route-cap">CPP non chiffrable — pas de chemin affichable</div>`;
  }
  if (v.cible === null) {
    return `<div class="route vide"></div>
            <div class="route-cap">cible site non renseignée</div>`;
  }
  const pct = v.chemin === null ? 0 : Math.round(v.chemin);
  return `<div class="route"><i style="width:${pct}%"></i></div>
          <div class="route-cap">${pct} % vers la cible · ${fmt(v.cppProd, 4)} → ${fmt(v.cible, 4)} €/pce</div>`;
}

/* ── une tuile de poste : CPP de prod, gain, chemin, et le mot de la décision ── */
function posteHTML(v) {
  const d = decisionPoste(v);
  const scMeilleur = v.meilleur ? v.meilleur.sc : null;
  const gain = v.gainActe !== null && v.gainActe !== undefined
    ? { val: v.gainActe, tag: "acté" }
    : (v.gainProjete !== null && v.gainProjete !== undefined
        ? { val: v.gainProjete, tag: "projeté" } : null);

  let cpp;
  if (v.cppProd === null) {
    cpp = `<div class="absent">CPP non chiffrable</div>`;
  } else {
    cpp = `<div class="cpp">
        <span class="big">${fmt(v.cppProd, 4)}</span>
        <span class="small"> €/pce</span>
        ${gain ? `<div class="small gain">${gain.tag === "acté" ? "−" : "→ −"}${fmt(gain.val, 4)} €/pce ${gain.tag}</div>` : ""}
      </div>`;
  }
  const quoi = scMeilleur ? scMeilleur.name : v.verdict.texte;

  return `<div class="poste" data-ligne="${v.op && v.op.id}" data-op="${v.op ? v.op.id : ""}">
    <div class="op">${v.op ? v.op.nom : "OP"}<small>${quoi}</small></div>
    <div>${cpp}</div>
    <div>${routeHTML(v)}</div>
    <div class="mot ${v.verdict.code}">${d.mot}</div>
  </div>`;
}

function ligneHTML(vl) {
  const ouverte = ETAT.ligne === vl.ligne.id;
  const cpp = vl.cppProd === null
    ? `<span class="absent">CPP non chiffrable</span>`
    : `<span class="cpp"><span class="big">${fmt(vl.cppProd, 4)}</span><span class="small"> €/pce en prod</span></span>`;
  /* Un seul séparateur, toujours. La version précédente composait « · " + (rien
     si aucun gain acté) + "· " + gain projeté » : sans gain acté il restait
     deux points médians côte à côte — visible sur EMAG 1 dans le navigateur, sur
     données réelles. Du cosmétique, mais un cosmétique faux sur la ligne qu'on
     lit en dix secondes coûte plus cher qu'une ligne de code. */
  const gains = [];
  if (vl.cppActe > 0) gains.push("−" + fmt(vl.cppActe, 4) + " acté");
  if (vl.cppProjete > 0) gains.push("−" + fmt(vl.cppProjete, 4) + " projeté");
  const gainTxt = gains.length ? " · " + gains.join(" · ") : " · aucun gain chiffrable";
  const refs = (vl.ligne.refs || []).map(r => r.nom).join(", ");

  return `<section class="ligne" data-ligne="${vl.ligne.id}">
    <header data-toggle="${vl.ligne.id}">
      <h2>${vl.ligne.nom}</h2>
      <span class="meta">${refs}</span>
      <span class="court">${cpp}${gainTxt}</span>
    </header>
    ${!ouverte && vl.postes.length ? `<div class="postes" style="padding-top:0">
       <div class="absent">${vl.postes.length} opération${vl.postes.length > 1 ? "s" : ""} —
          cliquer pour déplier</div></div>` : ""}
    ${ouverte ? `<div class="postes">${
        vl.postes.length ? vl.postes.map(posteHTML).join("")
                         : `<div class="absent">aucune opération saisie</div>`}</div>` : ""}
  </section>`;
}

function ecran1() {
  const vls = verdictsLignes();
  const r = recapLignes(vls);
  const nbPostes = vls.reduce((a, vl) => a + vl.postes.length, 0);

  return `
  <p class="lede">Où en est-on. Le CPP plaquettes est le coût outillage de la pièce :
     c'est le seul chiffre comparable au classeur de Matis, et le seul que changer
     d'insert fait bouger.</p>

  <div class="kpis">
    <div class="kpi">
      <div class="lab">CPP plaquettes · prod</div>
      <div class="val">${fmt(vls.filter(v => v.cppProd !== null)
        .reduce((a, v) => a + v.cppProd, 0) / Math.max(1, vls.filter(v => v.cppProd !== null).length), 4)}</div>
      <div class="sub">€/pièce, moyenne des ${vls.filter(v => v.cppProd !== null).length} lignes chiffrées
        <div class="why">somme des postes chiffrables — les non chiffrés sont comptés à part, jamais dilués</div></div>
    </div>
    <div class="kpi">
      <div class="lab">Déjà gagné · en série</div>
      <div class="val hero">${fmt(r.cppActe, 4)}</div>
      <div class="sub">€/pièce actés
        <div class="why">uniquement ce qui est passé en production</div></div>
    </div>
    <div class="kpi">
      <div class="lab">En essai · projeté</div>
      <div class="val">${fmt(r.cppProjete, 4)}</div>
      <div class="sub">€/pièce prometteurs
        <div class="why">pas encore validés — jamais mélangés aux gains actés</div></div>
    </div>
    <div class="kpi">
      <div class="lab">À décider</div>
      <div class="val">${r.decisions}</div>
      <div class="sub">poste${r.decisions > 1 ? "s" : ""} en attente d'une action
        <div class="why">validé 5× à confirmer, ou essai prometteur à confirmer</div>
        ${r.aChiffrer ? `<div class="why">+ ${r.aChiffrer} à chiffrer : cible connue, aucun coût saisi</div>` : ""}</div>
    </div>
  </div>

  ${r.aChiffrer ? `<div class="erreur">${r.aChiffrer} poste${r.aChiffrer > 1 ? "s" : ""}
     porte${r.aChiffrer > 1 ? "nt" : ""} une cible CPP mais aucun coût saisi. Sans prix,
     arêtes ou charnière, il n'existe pas de chemin à afficher — et il ne doit pas disparaître.</div>` : ""}

  <div class="lignes">${vls.map(ligneHTML).join("")}</div>

  <p class="note-bas">Le temps machine, le rebut et les pièces détachées ne sont pas
     affichés ici : ils ne sont pas comparables au classeur de Matis. L'app de
     production les porte ; le proto, non. Son but est de trancher sur l'outillage.</p>`;
}

/* ══════════════════════════════════════════════════════════════════════════
   ÉCRAN 2 — ESSAI : insérer un essai en 90 secondes
   ══════════════════════════════════════════════════════════════════════════ */

function ecran2() {
  const postes = tousPostes();
  const s = ETAT.saisi;
  const ops = postes.map(p => `<option value="${p.ligne.id}|${p.op.id}"
      ${s.poste === p.ligne.id + "|" + p.op.id ? "selected" : ""}>
      ${p.ligne.nom} · ${p.op.nom}</option>`).join("");

  return `
  <p class="lede">J'insère un essai. Trois informations suffisent pour qu'il compte :
     le poste, la plaquette, et jusqu'où elle tient. Le reste se lit, il ne se saisit pas.</p>

  <form class="form" id="fEssai">
    <h3>Nouvel essai</h3>
    <p class="sous">Un essai se juge sur sa charnière atteinte et sa conformité — pas sur un avis.</p>

    <div class="grille">
      <div class="champ">
        <label for="cPoste">Poste</label>
        <select id="cPoste" name="poste">${ops}</select>
        <div class="hint">ligne et opération</div>
      </div>
<div class="champ">
    <label for="cScenario">Plaquette / configuration</label>
    <select id="cScenario" name="scenario">${(function(){
      const scs = scenariosDuPoste(s.poste);
      return scs.length
        ? scs.map(x => `<option value="${x.id}">${x.name}</option>`).join("")
        : `<option value="">aucun scénario sur ce poste</option>`;
    })()}</select>
    <div class="hint">le scénario d'essai sur lequel on mesure</div>
  </div>
      <div class="champ">
        <label for="cDate">Date</label>
        <input type="date" id="cDate" name="date" value="${s.date || "2026-10-01"}">
      </div>
      <div class="champ">
        <label for="cEquipe">Équipe</label>
        <input type="text" id="cEquipe" name="equipe" placeholder="M. / A." value="${s.equipe || ""}">
      </div>
      <div class="champ">
        <label for="cCharniere">Charnière visée (pièces)</label>
        <input type="number" id="cCharniere" name="charniere" min="1" value="${s.charniere || ""}">
        <div class="hint">combien de pièces avant de devoir changer</div>
      </div>
      <div class="champ">
        <label for="cBatt">Battement mesuré (mm)</label>
        <input type="number" id="cBatt" name="batt" step="0.01" min="0" value="${s.batt || ""}">
        <div class="hint">vide = non mesuré, l'essai ne sera pas jugé non conforme</div>
      </div>
    </div>

    <button class="btn" type="submit">Enregistrer l'essai</button>
    <button class="btn ghost garder" type="button" onclick="annulerSaisie()">Annuler</button>
    ${ETAT.erreur ? `<div class="erreur" style="margin-top:16px">${ETAT.erreur}</div>` : ""}
    ${ETAT.dernierEssai ? `<div class="note-bas" style="color:var(--ok)">
      ${ETAT.dernierEssai}</div>` : ""}
  </form>`;
}

function scenariosDuPoste(cle) {
  const [lid, oid] = (cle || "").split("|");
  const p = tousPostes().find(x => x.ligne.id === lid && x.op.id === oid);
  return p ? p.scs : [];
}

/* ══════════════════════════════════════════════════════════════════════════
   ÉCRAN 3 — PREUVE : les répétitions, la charnière, la conformité
   ══════════════════════════════════════════════════════════════════════════ */

function scenarioCourant() {
  const postes = tousPostes();
  const sel = ETAT.saisi.poste || (postes[0] ? postes[0].ligne.id + "|" + postes[0].op.id : "");
  const p = postes.find(x => x.ligne.id + "|" + x.op.id === sel) || postes[0];
  if (!p) return null;
  const sc = (p.scs || []).find(x => x.id === ETAT.sc) || (p.scs || [])[0];
  return { poste: p, sc: sc };
}

function preuveHTML(paire) {
  const sc = paire.sc;
  if (!sc) return "";
  const s = statutScenario(sc);
  const seuil = sc.validationThreshold || 5;
  const essais = sc.essais || [];
  const conformes = essais.filter(e => statutEssai(sc, e).code === "conforme").length;

  const cases = [];
  for (let k = 0; k < seuil; k++) {
    const e = essais[k];
    cases.push(!e ? "" : statutEssai(sc, e).code === "conforme" ? "ok"
      : statutEssai(sc, e).code === "nonconforme" ? "bad" : "");
  }

  return `<section class="preuve">
    <header>
      <h3>${sc.name}</h3>
      <span class="meta">${paire.poste.ligne.nom} · ${paire.poste.op.nom}</span>
      <span class="mot ${sc.statut === "serie" ? "serie" : s.code === "valide" ? "pret"
        : s.code === "encours" ? "essai" : "rien"}" style="margin-left:auto">${s.texte}</span>
    </header>
    <p class="qq">La règle du site : un essai concluant est répété ${seuil} fois.
       ${conformes} sur ${seuil} sont conformes.</p>
    <div class="regle">${cases.map(c => `<i class="${c}"></i>`).join("")}</div>

    <div class="paires" style="margin-top:14px">
      ${cppParLogement(sc).map(l => {
        const cpp = l.cpp === null ? null : l.cpp;
        return `<div class="paire">
          <div class="nom">${l.outilNumero} · ${l.logementNom}</div>
          <div class="val" style="${cpp === null ? "color:var(--mute);font-size:var(--t4)" : ""}">
            ${cpp === null ? "non chiffrable" : fmt(cpp, 4) + " €/pce"}</div>
          <div class="detail">${l.article || "article non saisi"} ·
            ${cpp === null ? "prix, arêtes ou charnière manquants"
              : `${fmt(l.prix, 0)} € / ${fmt(l.aretes, 0)} arêtes / ${fmt(l.charniere, 0)} p`}</div>
        </div>`;
      }).join("")}
    </div>

    ${essaisHTML(sc, essais)}
  </section>`;
}

/* ── le CPP RÉELLEMENT OBTENU, essai par essai ───────────────────────────────
   Les tuiles du dessus montrent ce que le SCÉNARIO prévoit. Elles ne disent rien
   de ce que l'essai a réellement donné, et c'est le seul chiffre qui décide :
   un scénario qui tient mieux que prévu est une bonne nouvelle, un scénario qui
   tient moins bien qu'annoncé est un poste à rouvrir.

   La comparaison se fait dans la même unité que la tuile du scénario — sinon les
   deux nombres ne sont pas comparables et le rapprochement veut dire n'importe quoi. */
function essaisHTML(sc, essais) {
  if (!essais.length) return "";
  const prevu = cppOutillageScenario(sc);
  const lignes = essais.map(e => {
    const st = statutEssai(sc, e);
    const obtenu = cppEssai(sc, e);
    const cpp = obtenu.cpp;
    const ecart = (cpp !== null && prevu !== null) ? cpp - prevu : null;
    const classe = st.code === "conforme" ? "ok" : st.code === "nonconforme" ? "bad" : "";
    return `<div class="essai-ligne">
      <div class="qui">${e.titre || "Essai"}
        <small>${e.date || "sans date"}${e.operateur ? " · " + e.operateur : ""}
          · ${st.texte}${obtenu.nonChiffrables ? " · " + obtenu.nonChiffrables
            + " logement(s) écarté(s)" : ""}</small></div>
      <div class="cppb">${cpp === null
          ? `<span style="color:var(--mute);font-weight:400">non chiffrable</span>`
          : `${fmt(cpp, 4)} €/pce<small>obtenu${ecart !== null
              ? (ecart < 0 ? " · " + fmt(ecart, 4) + " mieux que prévu"
                            : (ecart > 0 ? " · +" + fmt(ecart, 4) + " moins bien que prévu"
                              : " · conforme au prévu")) : ""}</small>`}</div>
      <div class="mot ${classe || "rien"}">${st.code === "conforme" ? "conforme"
        : st.code === "nonconforme" ? "hors tolérance" : st.code === "encours" ? "en cours"
        : st.code === "arrete" ? "arrêté" : "attente"}</div>
    </div>`;
  }).join("");

  return `<div style="margin-top:16px">
    <h4 style="margin:0 0 2px;font-size:var(--t4)">Ce que les essais ont réellement donné</h4>
    <p class="note-bas" style="margin:0 0 4px">Coût hors plaquettes exclu, CPP outillage seul
       — même unité que les tuiles du dessus, pour que la comparaison se tienne.
       Scénario : ${prevu === null ? "non chiffrable" : fmt(prevu, 4) + " €/pce"}.</p>
    <div class="essais-liste">${lignes}</div>
  </div>`;
}

function ecran3() {
  /* Le poste affiché par le selecteur et le poste dont on liste les preuves
     doivent être LE MÊME. Deux résolutions ici (l'une avec repli sur le premier
     poste, l'autre sans) donnaient un selecteur annonçant « EMAG 1 · OP10 » au
    -dessus d'un « aucun essai saisi » : l'écran mentait sur lui-même. */
  const tous = tousPostes();
  const sel = posteCourantCle();
  const poste = pairesPoste(sel);
  /* on ne montre QUE les scénarios qui portent des essais : la production n'est
     pas une preuve, elle est la référence qu'on cherche à battre. */
  const paires = poste
    ? poste.scs.filter(sc => (sc.essais || []).length).map(sc => ({ poste, sc }))
    : [];
  const opts = tous.map(x => `<option value="${x.ligne.id}|${x.op.id}"
    ${sel === x.ligne.id + "|" + x.op.id ? "selected" : ""}>
    ${x.ligne.nom} · ${x.op.nom}</option>`).join("");

  return `
  <p class="lede">La preuve. Un essai ne vaut que s'il est répété, et le CPP de chaque
     logement est affiché avec ses trois ingredients — un chiffre sans ses sources
     n'est pas une preuve.</p>

  <div class="form" style="margin-bottom:var(--gap)">
    <div class="champ" style="max-width:340px">
      <label for="cPreuvePoste">Poste</label>
      <select id="cPreuvePoste" onchange="changerPreuvePoste(this.value)">${opts}</select>
    </div>
  </div>

  ${paires.length ? `<div class="preuves">${paires.map(preuveHTML).join("")}</div>`
    : `<div class="vide"><b>Aucun essai saisi sur ce poste</b>
       La production seule ne se prouve pas — un essai doit être lancé pour qu'il y ait
       une preuve à montrer.</div>`}`;
}

/* UNE seule resolution du poste courant, utilisee par le selecteur ET par la
   liste des preuves. C'etait la duplication qui desynchronisait les deux. */
function posteCourantCle() {
  const tous = tousPostes();
  if (ETAT.saisi.poste && pairesPoste(ETAT.saisi.poste)) return ETAT.saisi.poste;
  return tous.length ? tous[0].ligne.id + "|" + tous[0].op.id : "";
}
function pairesPoste(cle) {
  const [lid, oid] = (cle || "").split("|");
  if (!lid || !oid) return null;
  return tousPostes().find(x => x.ligne.id === lid && x.op.id === oid) || null;
}

/* ══════════════════════════════════════════════════════════════════════════
   ÉCRAN 4 — DÉCISION : le gain, go / no-go, en 15 secondes
   ══════════════════════════════════════════════════════════════════════════ */

function decHTML(v) {
  const d = decisionPoste(v);
  const cpp = v.cppProd === null ? "—" : fmt(v.cppProd, 4);
  return `<section class="dec-carte">
    <div>
      <div class="gros"><small>CPP plaquettes</small>${cpp}</div>
      <div class="sub" style="font-size:var(--t6);color:var(--mute);text-align:center">
        €/pièce en prod</div>
    </div>
    <div>
      <div class="mot ${v.verdict.code}">${d.mot}</div>
      <div class="pourquoi">${d.pourquoi}</div>
      <div class="deux">
        <div>Gain acté<b class="${v.gainActe ? "ok" : ""}">${
          v.gainActe === null || v.gainActe === undefined ? "—" : fmt(v.gainActe, 4) + " €"}</b></div>
        <div>Gain projeté<b>${
          v.gainProjete === null || v.gainProjete === undefined ? "—" : fmt(v.gainProjete, 4) + " €"}</b></div>
        <div>Cible site<b>${v.cible === null ? "non renseignée" : fmt(v.cible, 4) + " €"}</b></div>
        <div>Chemin<b>${v.chemin === null ? "—" : Math.round(v.chemin) + " %"}</b></div>
      </div>
    </div>
  </section>`;
}

function ecran4() {
  const vls = verdictsLignes();
  const cartes = vls.flatMap(vl => vl.postes.map(v => ({ vl, v })))
    .filter(x => x.v.verdict.code !== "rien");
  const tries = cartes.slice().sort((a, b) => {
    const ordre = { pret: 0, essai: 1, gagne: 2, achiffrer: 3 };
    return ordre[a.v.verdict.code] - ordre[b.v.verdict.code];
  });
  return `
  <p class="lede">La décision. Chaque poste qui demande une action, dans l'ordre :
     d'abord ce qui est validé et n'attend plus qu'un mot, puis ce qui mérite un essai.</p>
  ${tries.length ? `<div class="dec">${tries.map(x => decHTML(x.v)).join("")}</div>`
    : `<div class="vide"><b>Rien à décider</b>Aucun poste en attente.</div>`}
  <p class="note-bas">Les postes où aucun essai ne fait mieux que la production sont
     volontairement absents : ils ne demandent rien.</p>`;
}

/* ══════════════════════════════════════════════════════════════════════════
   ÉCRAN 5 — EMPORTER : la page A4
   ══════════════════════════════════════════════════════════════════════════ */

function a4HTML() {
  const vls = verdictsLignes();
  const lignes = vls.map(vl => `<tr>
      <td><b>${vl.ligne.nom}</b><div class="note">${(vl.ligne.refs || []).map(r => r.nom).join(", ")}</div></td>
      <td class="num">${vl.cppProd === null ? "—" : fmt(vl.cppProd, 4)}</td>
      <td class="num">${vl.cppActe ? fmt(vl.cppActe, 4) : "—"}</td>
      <td class="num">${vl.cppProjete ? fmt(vl.cppProjete, 4) : "—"}</td>
      <td class="num">${vl.postes.filter(p => p.verdict.code === "achiffrer").length || "—"}</td>
    </tr>`).join("");

  const actions = vls.flatMap(vl => vl.postes).filter(p => p.verdict.code !== "rien")
    .map(p => {
      const d = decisionPoste(p);
      const sc = p.meilleur ? p.meilleur.sc.name : "—";
      return `<tr>
        <td><b>${p.op ? p.op.nom : "OP"}</b> <span class="note">${sc}</span></td>
        <td>${p.ref.nom}</td>
        <td class="num">${p.cppProd === null ? "—" : fmt(p.cppProd, 4)}</td>
        <td class="num gain">${p.gainActe ? fmt(p.gainActe, 4)
          : (p.gainProjete ? fmt(p.gainProjete, 4) : "—")}</td>
        <td><b>${d.mot}</b></td>
      </tr>`;
    }).join("");

  const d = new Date().toLocaleDateString("fr-FR");
  return `<div class="a4" id="a4">
    <h1>Suivi optimisation — Sept Fons</h1>
    <div class="sous">CPP plaquettes · coût outillage de la pièce, hors temps machine.
      Édité le ${d} — vivant, recalculé à chaque édition.</div>

    <h2>Les lignes</h2>
    <table><thead><tr>
      <th>Ligne</th><th class="num">CPP prod</th><th class="num">Gain acté</th>
      <th class="num">Projeté</th><th class="num">À chiffrer</th>
    </tr></thead><tbody>${lignes}</tbody></table>
    <div class="note">€/pièce. « Gain acté » = passé en production. « Projeté » = essai
      prometteur, non validé. Les deux ne sont jamais additionnés. Une cible connue
      sans coût saisi apparaît en « à chiffrer » plutôt que d'être effacée.</div>

    <h2>Ce qui demande une décision</h2>
    ${actions ? `<table><thead><tr>
      <th>Poste</th><th>Référence</th><th class="num">CPP prod</th>
      <th class="num">Gain</th><th>Décision</th>
    </tr></thead><tbody>${actions}</tbody></table>`
      : `<div class="note">Aucun poste en attente de décision.</div>`}

    <h2>La règle</h2>
    <div class="note">Un essai concluant est répété 5 fois avant d'être proposé à la
      production. Le CPP plaquettes est la seule base comparable au classeur de
      consommations ; le temps machine est suivi séparément et n'entre pas dans cette
      comparaison. Aucun chiffre de cette page n'est estimé : une mesure absente est
      écrite « non mesurée ».</div>

    <div class="pied">
      <span>Site de Sept Fons · usinage céramique</span>
      <span>Document vivant — les valeurs sont recalculées à chaque édition</span>
    </div>
  </div>`;
}

function ecran5() {
  return `
  <p class="lede">La page à emporter. Elle se recalcule à chaque édition — ce n'est pas
     un export figé, c'est l'état courant du suivi.</p>
  ${a4HTML()}
  <div class="retirer">
    <button class="btn garder" onclick="window.print()">🖨 Imprimer / PDF</button>
  </div>
  <p class="note-bas" style="text-align:center">Le proto ne synchronise rien, n'envoie
     rien, et ne se connecte à aucun compte. Ce qui est saisi ici reste sur cette machine.</p>`;
}

/* ══════════════════════════════════════════════════════════════════════════
   LA SOURCE — reprendre les essais déjà faits

   Un export de l'ancienne version est un fichier que l'utilisateur choisit SUR
   SON POSTE. Il n'est ni téléversé, ni envoyé, ni stocké ailleurs : il est lu
   par le navigateur, projeté en mémoire, et réduit à ce qui nourrit une décision.
   Rien ne sort de la machine — c'est la même règle que l'app de production, et
   elle n'est pas négociable pour des données d'essais réelles.
   ══════════════════════════════════════════════════════════════════════════ */

const CLE_LOCAL = "proto-septfons-v1";

function panoramaImport() {
  if (!ETAT.importOuvert) return "";
  const s = ETAT.source;
  const r = s.rapport;

  const chiffres = r ? `
    <div class="rapport">
      <div><div class="lab">Lignes</div><div class="val">${r.lignes}</div></div>
      <div><div class="lab">Opérations</div><div class="val">${r.ops}</div></div>
      <div><div class="lab">Scénarios</div><div class="val">${r.scenarios}</div></div>
      <div><div class="lab">Essais repris</div><div class="val">${r.essais}</div></div>
      <div><div class="lab">Logements</div><div class="val">${r.logements}</div></div>
      <div><div class="lab">Cibles site</div><div class="val">${r.scenariosCibles}</div></div>
    </div>` : "";

  const poids = s.poids && s.poids.avant ? `
    <div class="avert ok-l">Sur ${(s.poids.avant / 1048576).toFixed(2)} Mo lus, il reste
      ${Math.round(s.poids.apres / 1024)} Ko (${Math.round(s.poids.ratio * 100)} %).
      Abandonnés : ${r.abandons.join(", ")}. Aucun chiffre de décision n'est perdu.</div>` : "";

  const avertissements = r && r.avertissements.length
    ? r.avertissements.map(a => `<div class="avert">${a}</div>`).join("") : "";

  return `<section class="panneau">
    <h3>Reprendre les essais déjà faits</h3>
    <p class="sous">Choisissez un export de l'ancienne version du suivi (le fichier
       <b>.json</b> téléchargé depuis l'app, ou celui déposé dans le cloud). Le fichier
       reste sur ce poste : il n'est ni envoyé, ni téléversé, ni conservé ailleurs.
       Les mesures sont lues telles qu'elles ont été saisies — rien n'est réinterprété.</p>

    <div class="depot">
      <input type="file" id="fImport" accept=".json,application/json"
             onchange="chargerFichier(this)">
      <div style="margin-top:9px;font-size:var(--t6)">
        Formats 5, 6, 7 et 8 acceptés — c'est-à-dire tout ce que l'app a jamais exporté.</div>
    </div>

    ${ETAT.message ? `<div class="avert ok-l" style="margin-top:14px">${ETAT.message}</div>` : ""}
    ${ETAT.erreur ? `<div class="avert" style="margin-top:14px">${ETAT.erreur}</div>` : ""}
    ${poids}${chiffres}${avertissements}

    <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
      ${s.type === "import"
        ? `<button class="btn" type="button" onclick="retourJeu()">Revenir au jeu d'exemple</button>`
        : `<span style="font-size:var(--t6);color:var(--mute);align-self:center">
             Le jeu d'exemple est structurel, pas réel : aucun de ses chiffres n'est un relevé.</span>`}
    </div>
  </section>`;
}

/* La lecture du fichier. Trois refus sont distingués — un fichier illisible,
   un JSON invalide, un JSON qui n'est pas un export : aucun des trois ne doit
   laisser l'écran dans un état à moitié changé. */
function chargerFichier(input) {
  const f = input.files && input.files[0];
  if (!f) return;
  ETAT.erreur = null; ETAT.message = null;
  const lecteur = new FileReader();
  lecteur.onerror = () => {
    ETAT.erreur = "Le fichier n'a pas pu être lu. Il est peut-être encore ouvert ailleurs.";
    rendre();
  };
  lecteur.onload = () => {
    let source;
    try {
      source = JSON.parse(lecteur.result);
    } catch (e) {
      ETAT.erreur = "Ce fichier n'est pas un JSON valide — il a peut-être été tronqué "
                  + "par un copier-coller. Rien n'a été changé.";
      rendre(); return;
    }
    const p = projeter(source);
    if (!p.ok) {
      ETAT.erreur = p.erreur + " Rien n'a été changé : les données actuelles sont intactes.";
      rendre(); return;
    }
    ETAT.lignes = p.lignes;
    ETAT.source = {
      type: "import",
      nom: f.name,
      rapport: p.rapport,
      /* le « avant » est la taille réelle du fichier lu, le « après » la taille
         de ce que la projection a gardé — c'est le seul endroit où les deux
         sont connues, et la comparaison affiche exactement ce qui a été jeté. */
      poids: { avant: f.size, apres: mesurerLignes(p.lignes), ratio: null }
    };
    ETAT.source.poids.ratio = f.size
      ? Math.round((ETAT.source.poids.apres / f.size) * 1000) / 1000 : null;
    ETAT.ligne = p.lignes[0] ? p.lignes[0].id : null;
    ETAT.saisi = {};
    ETAT.ecran = 1;
    ETAT.message = "Import réussi — " + p.rapport.lignes + " ligne(s), "
                  + p.rapport.essais + " essai(s) repris. "
                  + "Les écrans se sont remplis avec ces données.";
    sauvegarderLocal();
    rendre();
  };
  lecteur.readAsText(f);
}

function mesurerLignes(lignes) {
  try { return JSON.stringify(lignes).length; } catch (e) { return 0; }
}

/* La projection est faite en mémoire, mais elle doit survivre à un rechargement
   de page : sinon on rouvre le fichier à chaque fois, et le proto se rétrécit
   en « un écran qu'on recharge ». Le stockage est local, et rien d'autre. */
function sauvegarderLocal() {
  try {
    localStorage.setItem(CLE_LOCAL, JSON.stringify({
      lignes: ETAT.lignes, source: ETAT.source
    }));
  } catch (e) { /* quota plein ou stockage refusé : on continue sans, sans le dire */ }
}
function chargerLocal() {
  try {
    const brut = localStorage.getItem(CLE_LOCAL);
    if (!brut) return false;
    const s = JSON.parse(brut);
    if (!s || !Array.isArray(s.lignes) || !s.lignes.length) return false;
    ETAT.lignes = s.lignes;
    ETAT.source = s.source || ETAT.source;
    return true;
  } catch (e) { return false; }
}
function retourJeu() {
  ETAT.lignes = JEUX.lignes;
  ETAT.source = { type: "jeu", nom: "jeu d'exemple", rapport: null, poids: null };
  ETAT.ligne = "l1"; ETAT.saisi = {}; ETAT.ecran = 1;
  ETAT.message = null; ETAT.erreur = null;
  sauvegarderLocal();
  rendre();
}
function ouvrirImport() { ETAT.importOuvert = !ETAT.importOuvert; rendre(); }

/* ══════════════════════════════════════════════════════════════════════════
   LE ROUTAGE — cinq écrans, cinq boutons, rien d'autre
   ══════════════════════════════════════════════════════════════════════════ */

const ECRANS = [
  { n: 1, nom: "Où en est-on", fn: ecran1 },
  { n: 2, nom: "Essai",        fn: ecran2 },
  { n: 3, nom: "Preuve",       fn: ecran3 },
  { n: 4, nom: "Décision",     fn: ecran4 },
  { n: 5, nom: "Emporter",     fn: ecran5 }
];

function rendre() {
  document.getElementById("steps").innerHTML = ECRANS.map(e =>
    `<button class="step ${ETAT.ecran === e.n ? "on" : ""}" onclick="aller(${e.n})">
       <span class="n">${e.n}</span>${e.nom}</button>`).join("");
  const e = ECRANS.find(x => x.n === ETAT.ecran);
  document.getElementById("vue").innerHTML = panoramaImport() + e.fn();
  const b = document.getElementById("badge");
  if (b) b.textContent = "PROTO v" + PROTO_VERSION
    + (ETAT.source.type === "import" ? " — données réelles" : " — jeu d'exemple");
  const sb = document.getElementById("srcbtn");
  if (sb) sb.outerHTML = sourceHTML();
  window.scrollTo(0, 0);
}
function aller(n) { ETAT.ecran = n; rendre(); }

function basculerLigne(id) {
  ETAT.ligne = ETAT.ligne === id ? null : id;
  rendre();
}
function changerPreuvePoste(v) {
  ETAT.saisi.poste = v; ETAT.sc = null; rendre();
}
function annulerSaisie() { ETAT.saisi = {}; ETAT.dernierEssai = null; rendre(); }

/* la saisie — le moins de code possible, et il ne calcule rien */
function enregistrerEssai(ev) {
  ev.preventDefault();
  const d = Object.fromEntries(new FormData(ev.target).entries());
  if(!d.charniere){
    ETAT.erreur = "La charnière visée est obligatoire : sans elle, on ne peut pas dire "
                + "si l'essai a tenu. Un essai sans charnière ne prouve rien.";
    rendre(); return;
  }
  ETAT.erreur = null;
  ETAT.saisi = Object.assign(ETAT.saisi, d);
  const scs = scenariosDuPoste(d.poste);
  if(scs.length && !scs.find(x => x.id === d.scenario)) ETAT.saisi.scenario = scs[0].id;
  ETAT.dernierEssai = "essai enregistré — à recharger pour l'intégrer aux preuves";
  rendre();
}

/* le sélecteur de scénario se remplit selon le poste choisi */
function remplirScenarios() {
  const scs = scenariosDuPoste(ETAT.saisi.poste);
  const sel = document.getElementById("cScenario");
  if (!sel) return;
  sel.innerHTML = scs.length
    ? scs.map(s => `<option value="${s.id}">${s.name}</option>`).join("")
    : `<option value="">aucun scénario sur ce poste</option>`;
}

/* les clics et les changements : trois écouteurs, et c'est tout.
   Chacun est vérifié par typeof dans le harnais — pas de promesse non tenue. */
document.addEventListener("click", function(ev){
  const t = ev.target.closest("[data-toggle]");
  if (t) basculerLigne(t.getAttribute("data-toggle"));
});
document.addEventListener("change", function(ev){
  if (ev.target.id === "cPoste") { ETAT.saisi.poste = ev.target.value; remplirScenarios(); }
  if (ev.target.id === "cPreuvePoste") changerPreuvePoste(ev.target.value);
});
document.addEventListener("submit", function(ev){
  if (ev.target.id === "fEssai") enregistrerEssai(ev);
});

/* les portes, exposées — le harnais vérifie qu'elles existent */
window.proto = { aller, rendre, basculerLigne, changerPreuvePoste, annulerSaisie,
                 enregistrerEssai, ecran1, ecran2, ecran3, ecran4, ecran5, a4HTML,
                 verdictPoste, verdictLigne, decisionPoste, cheminCPP,
                 coutLogement, cppOutillageScenario, statutEssai, statutScenario,
                 recapLignes, ECRANS, ETAT, tousPostes, verdictsLignes,
                 projeter, panoramaImport, ouvrirImport, retourJeu, chargerFichier,
                 sauvegarderLocal, chargerLocal, sourceHTML, essaisHTML,
                 battDe, cppEssai, mesurerLignes, PROTO_VERSION };

/* On ne passe jamais le proto par-dessus des données réelles laissées par une
   session précédente : c'est le seul cas où un état persistant pourrait écraser
   ce que Matis a déposé. Le jeu d'exemple ne l'emporte que s'il n'y a rien. */
chargerLocal();
remplirScenarios();
rendre();
</script>
</body>
</html>

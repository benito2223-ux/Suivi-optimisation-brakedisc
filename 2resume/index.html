            + '<td class="num">' + dispo(l.prix, 2, "— non saisi") + "</td>"
            + '<td class="num">' + dispo(l.aretes, 0, "—") + "</td>"
            + '<td class="num">' + dispo(l.charniere, 0, "—") + " p</td>"
            + '<td class="num"><b>' + (l.cpp !== null ? fmtEuro(l.cpp, 4) : esc(l.motif)) + "</b></td>"
            + '<td><button class="btn mini" data-act="editer-logement" data-id="' + esc(l.id) + '" data-id2="' + esc(prod.id) + '">Modifier</button></td></tr>';
        });
      });
      html += "</tbody></table>";
      if (out.nonChiffrables) html += '<div class="decl">' + out.nonChiffrables
        + " logement(s) non chiffrable(s) dans ce scénario — le CPP ci-dessus ne porte QUE ce qui est chiffrable, et il le dit.</div>";
    }

    const essaisProd = essaisDuScenario(prod);
    if (essaisProd.length) {
      html += '<div class="bloc-essais"><h4>Essais portés par ce scénario de production</h4>';
      essaisProd.forEach(e => { html += essaiLigneHTML(prod, e); });
      html += "</div>";
    } else {
      html += '<div class="bloc-essais"><h4>Essais</h4><p class="etat" style="padding:0">'
        + "Aucun essai porté par ce scénario : son CPP est celui qu'on a prévu, pas celui qu'on a mesuré.</p></div>";
    }
  }

  html += '<div class="bloc-essais" style="display:flex;gap:8px;flex-wrap:wrap">'
    + '<button class="btn mini" data-act="aller-scenarios" data-id="' + esc(v.op.id) + '">'
    + (v.autres.length ? v.autres.length + " scénario" + (v.autres.length > 1 ? "s" : "") + " à optimiser →" : "Scénarios et essais →") + "</button>"
    + '<button class="btn mini" data-act="nouvel-essai" data-id="' + esc(v.op.id) + '">+ Ajouter un essai</button></div>';
  html += "</section>";
  return html;
}

function essaiLigneHTML(sc, e) {
  const st = statutEssai(sc, e);
  const obt = cppEssai(sc, e);
  const su = suiviEssai(sc, e);
  const classMot = { conforme: "valide", nonconforme: "bad", encours: "essai", attente: "attente", arrete: "muet", vide: "muet" };
  let progres = su.filter(x => x.cible !== null)
    .map(x => esc(x.logementNom) + " " + x.atteint + "/" + Math.round(x.cible) + " p").join(" · ");
  let html = '<div class="essai-ligne"><span class="titre">' + esc(e.titre || "Essai") + "</span>"
    + '<span class="mot ' + (classMot[st.code] || "attente") + '">' + esc(st.texte) + "</span>";
  if (obt.cpp !== null) {
    html += '<span class="detail">CPP obtenu <b class="num">' + fmtEuro(obt.cpp, 4) + "</b></span>";
    if (obt.prevu !== null) html += '<span class="detail">(prévu ' + fmtEuro(obt.prevu, 4) + ")</span>";
  }
  if (progres && st.code !== "encours") html += '<span class="progres">' + progres + "</span>";
  html += '<span class="spacer"></span>'
    + '<button class="btn mini" data-act="voir-essai" data-id="' + esc(e.id) + '" data-id2="' + esc(sc.id) + '">Détail</button></div>';
  return html;
}

/* ── ÉCRAN 3 : les scénarios qui ne sont pas en production ───────────────── */

function ecran3() {
  const ligne = ligneCourante();
  if (!ligne) return '<div class="decl">Aucune ligne.</div>';
  const postes = postesDeLigne(ligne);
  const autres = [];
  postes.forEach(p => p.autres.forEach(sc => autres.push({ p: p, sc: sc })));

  let html = '<p class="retour"><button class="btn mini" data-act="aller" data-id="2">← ' + esc(ligne.nom) + '</button></p>'
    + '<div class="titres"><h2>Scénarios et essais</h2><span class="encadre">' + esc(ligne.nom) + '</span></div>'
    + '<p class="lede">Tout ce qui n\'est pas en production : ce qu\'on teste, ce que '
    + 'l\'essai a réellement donné, et la décision qu\'il prépare. Le CPP <b>prévu</b> '
    + 'dit ce que le scénario croit ; le CPP <b>obtenu</b> dit ce qui s\'est passé.</p>';

  if (!autres.length) {
    html += '<div class="decl">Aucun scénario hors production sur cette ligne. '
      + 'Ajoute-en un depuis un poste, ou importe un export qui en porte.</div>';
  }

  autres.forEach(a => {
    const sc = a.sc;
    const st = statutScenario(sc);
    const cpp = cppOutillageScenario(sc);
    const v = verdictPoste(ligne, a.p.ref, a.p.op);
    const classMot = { serie: "serie", valide: "valide", pret: "valide", encours: "essai", essai: "essai", rien: "muet", abandonne: "abandonne" };
    html += '<section class="poste"><header><h3><code>' + esc(v.opCode) + '</code>' + esc(sc.name) + '</h3>'
      + '<span class="mot ' + (classMot[st.code] || "attente") + '">' + esc(st.texte) + "</span>"
      + '<span class="spacer"></span>'
      + (cpp !== null ? '<div class="cppb"><b>' + fmtEuro(cpp, 4) + '</b><small>prévu, € / pièce</small></div>' : '<span class="mot attente">à chiffrer</span>')
      + "</header><div class=\"corps\">";

    const out = outillageDeScenario(sc);
    if (out.outils.length) {
      html += '<table class="outillage"><thead><tr><th>Outil</th><th>Logt</th><th>MABEC</th><th>Plaquette</th><th>Prix</th><th>Arêtes</th><th>Charnière</th><th>Coût/pce</th><th></th></tr></thead><tbody>';
      out.outils.forEach(o => o.logements.forEach(l => {
        html += '<tr class="' + (l.cpp === null ? "manque " : "") + 'clic" data-act="editer-logement" data-id="' + esc(l.id) + '" data-id2="' + esc(sc.id) + '">'
          + '<td class="num">' + esc(o.numero) + "</td><td>" + esc(l.nom) + "</td>"
          + '<td class="num">' + (l.mabec ? '<span class="mabec">' + esc(l.mabec) + "</span>" : '<span class="mabec" style="color:var(--warn)">sans MABEC</span>') + "</td>"
          + '<td>' + (l.article ? esc(l.article) : '<span style="color:var(--ink-3)">non nommée</span>') + "</td>"
          + '<td class="num">' + dispo(l.prix, 2, "— non saisi") + "</td>"
          + '<td class="num">' + dispo(l.aretes, 0, "—") + "</td>"
          + '<td class="num">' + dispo(l.charniere, 0, "—") + " p</td>"
          + '<td class="num"><b>' + (l.cpp !== null ? fmtEuro(l.cpp, 4) : esc(l.motif)) + "</b></td>"
          + '<td><button class="btn mini" data-act="editer-logement" data-id="' + esc(l.id) + '" data-id2="' + esc(sc.id) + '">Modifier</button></td></tr>';
      }));
      html += "</tbody></table>";
    }

    const essais = essaisDuScenario(sc);
    if (essais.length) {
      html += '<div class="bloc-essais"><h4>' + essais.length + " essai" + (essais.length > 1 ? "s" : "") + "</h4>";
      essais.forEach(e => { html += essaiLigneHTML(sc, e); });
      html += "</div>";
      /* Le gain, périmètre à périmètre, jamais un total contre une cible. */
      if (v.cppProd !== null && cpp !== null && cpp < v.cppProd) {
        const g = v.cppProd - cpp;
        html += '<div class="decl"><b>Si cet essai passait en production :</b> '
          + fmtEuro(g, 4) + " €/pièce de gagné sur le poste plaquettes"
          + (v.gainProjeteAnnuel !== null ? ", soit " + fmtEnt(v.gainProjeteAnnuel) + " €/an (volume " + esc(v.volume.source) + ")" : " — volume annuel non saisi, le gain annuel reste inconnu")
          + ".</div>";
      }
    } else {
      html += '<div class="bloc-essais"><h4>Essais</h4><p class="etat" style="padding:0">Aucun essai : '
        + "ce scénario n'a pas encore de preuve.</p></div>";
    }

    html += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">'
      + '<button class="btn mini" data-act="nouvel-essai" data-id="' + esc(a.p.op.id) + '" data-id2="' + esc(sc.id) + '">+ Ajouter un essai</button>'
      + (sc.statut !== "serie" ? '<button class="btn mini" data-act="passer-serie" data-id="' + esc(sc.id) + '">Passer en production</button>' : "")
      + '<button class="btn mini" data-act="abandonner" data-id="' + esc(sc.id) + '">Abandonner</button>'
      + "</div></div></section>";
  });

  html += formulaireEssaiHTML();
  return html;
}

/* ── le formulaire d'essai ──────────────────────────────────────────────── */

function formulaireEssaiHTML() {
  const s = ETAT.saisie;
  if (!s) return "";
  const ligne = ligneCourante();
  if (!ligne) return "";
  const postes = postesDeLigne(ligne);
  let html = '<form class="form" id="formEssai" data-form="essai"><h3>Nouvel essai</h3>';
  html += '<div class="rangée"><div class="champ"><label>Poste</label><select data-champ="saisie-op">';
  postes.forEach(p => {
    html += '<option value="' + esc(p.op.id) + '"' + (p.op.id === s.opId ? " selected" : "") + ">"
      + esc(p.code + " — " + p.ref.nom) + "</option>";
  });
  html += "</select></div>";
  const poste = postes.find(p => p.op.id === s.opId) || postes[0];
  if (poste) {
    html += '<div class="champ"><label>Scénario</label><select data-champ="saisie-sc">';
    poste.scs.forEach(sc => {
      html += '<option value="' + esc(sc.id) + '"' + (sc.id === s.scId ? " selected" : "") + ">"
        + esc(sc.name + (sc === poste.prod ? " (production)" : "")) + "</option>";
    });
    html += "</select></div>";
  }
  html += '<div class="champ"><label>Date</label><input type="date" data-champ="saisie-date" value="' + esc(s.date) + '"></div>'
    + '<div class="champ"><label>Équipe</label><select data-champ="saisie-equipe">'
    + ["", "Matin", "Après-midi"].map(e => '<option value="' + e + '"' + (s.equipe === e ? " selected" : "") + ">" + (e || "—") + "</option>").join("")
    + '</select></div></div>';
  html += '<div class="rangée"><div class="champ"><label>Titre</label><input type="text" data-champ="saisie-titre" value="' + esc(s.titre) + '" placeholder="Ex. première série"></div>'
    + '<div class="champ"><label>Opérateur</label><input type="text" data-champ="saisie-operateur" value="' + esc(s.operateur) + '"></div>'
    + '<div class="champ"><label>But</label><input type="text" data-champ="saisie-but" value="' + esc(s.but) + '" placeholder="Ce qu\'on cherche"></div></div>';

  const trouve = trouverScenario(s.scId);
  if (trouve) {
    const logements = cppParLogement(trouve.sc);
    if (logements.length) {
      html += '<h3 style="margin-top:6px">Charnière visée par logement</h3><div class="petits">';
      logements.forEach(l => {
        const suivi = s.logements.find(x => x.logementId === l.logementId);
        html += '<div class="rangée"><div class="champ" style="max-width:90px"><label>Logement</label><input type="text" value="' + esc(l.logementNom) + '" disabled></div>'
          + '<div class="champ" style="max-width:140px"><label>Charnière visée</label>'
          + '<input type="number" step="1" min="0" data-champ="saisie-charniere" data-id="' + esc(l.logementId) + '" value="' + esc(suivi ? suivi.charniere : (l.charniere !== null ? l.charniere : "")) + '"></div></div>';
      });
      html += "</div>";
    }
    html += '<h3 style="margin-top:6px">Prélèvements</h3><div class="petits" id="prels">';
    s.prels.forEach((p, i) => {
      html += '<div class="rangée"><div class="champ" style="max-width:100px"><label>Pièce n°</label>'
        + '<input type="number" step="1" min="0" data-champ="prel-piece" data-id="' + i + '" value="' + esc(p.piece) + '"></div>'
        + '<div class="champ" style="max-width:120px"><label>Batt D (mm)</label><input type="number" step="0.0001" min="0" data-champ="prel-battd" data-id="' + i + '" value="' + esc(p.battD) + '"></div>'
        + '<div class="champ" style="max-width:120px"><label>Batt G (mm)</label><input type="number" step="0.0001" min="0" data-champ="prel-battg" data-id="' + i + '" value="' + esc(p.battG) + '"></div>'
        + '<div class="champ" style="max-width:150px"><label>Usure</label><select data-champ="prel-usure" data-id="' + i + '">'
        + ["", "ok", "limite", "changer"].map(u => '<option value="' + u + '"' + (p.usure === u ? " selected" : "") + ">" + (u === "" ? "—" : USURE_LABELS[u]) + "</option>").join("")
        + '</select></div>'
        + '<div class="champ" style="max-width:60px"><label>&nbsp;</label><button type="button" class="btn mini" data-act="retirer-prel" data-id="' + i + '">✕</button></div></div>';
    });
    html += '</div><div><button type="button" class="btn mini" data-act="ajouter-prel">+ Ajouter un prélèvement</button></div>';
  }

  html += '<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">'
    + '<button type="submit" class="btn primaire">Enregistrer l\'essai</button>'
    + '<button type="button" class="btn" data-act="annuler-essai">Annuler</button></div></form>';
  return html;
}

function ouvrirEssai(opId, scId) {
  const ligne = ligneCourante();
  const op = postesDeLigne(ligne).find(p => p.op.id === opId);
  const sc = op ? op.scs.find(x => x.id === scId) : null;
  const logements = sc ? cppParLogement(sc) : [];
  ETAT.saisie = {
    opId: opId, scId: scId, date: new Date().toISOString().slice(0, 10),
    equipe: "", titre: "", operateur: "", but: "",
    logements: logements.map(l => ({ logementId: l.logementId, logementNom: l.logementNom, charniere: l.charniere })),
    prels: [{ piece: "", battD: "", battG: "", usure: "", logementId: logements.length ? logements[0].logementId : "" }]
  };
  if (ETAT.etape !== 3) { ETAT.etape = 3; }
  rendre();
  setTimeout(() => { const f = $("formEssai"); if (f) f.scrollIntoView({ behavior: "smooth" }); }, 30);
}

/* ── ÉCRAN 4 : la décision ──────────────────────────────────────────────── */

const ORDRE_VERDICT = { pret: 0, essai: 1, gagne: 2, achiffrer: 3, rien: 4 };

function ecran4() {
  const verdicts = [];
  lignes().forEach(l => { const vl = verdictLigne(l); if (vl.postes.length) verdicts.push(vl); });
  const recap = recapLignes(verdicts);

  let html = '<p class="lede">Un mot par poste, et la raison à côté. Les gains '
    + '<b>actés</b> et <b>projetés</b> ne s\'additionnent jamais : le premier est '
    + 'en production, le second attend ses cinq preuves.</p>';
  html += '<div class="kpis">'
    + kpi("Gain acté", recap.cppActe ? fmtEuro(recap.cppActe, 4) + "/pièce" : "—", recap.cppActe ? "en production" : "rien d'acté")
    + kpi("Gain projeté", recap.cppProjete ? fmtEuro(recap.cppProjete, 4) + "/pièce" : "—", recap.cppProjete ? "essais à confirmer" : "aucun essai qui gagne")
    + kpi("À décider", recap.decisions, "postes qui attendent un geste")
    + kpi("À chiffrer", recap.aChiffrer, "postes sans coût calculable", recap.aChiffrer > 0)
    + "</div>";

  verdicts.forEach(vl => {
    const tries = vl.postes.slice().sort((a, b) =>
      (ORDRE_VERDICT[a.code] ?? 9) - (ORDRE_VERDICT[b.code] ?? 9) || a.code.localeCompare(b.code));
    tries.forEach(v => {
      const d = decisionPoste(v);
      const classe = { gagne: "valide", pret: "valide", essai: "essai", achiffrer: "attente", rien: "muet" }[v.code] || "attente";
      html += '<section class="dec-carte"><div class="gros">'
        + '<div class="cppb"><b>' + (v.cppProd !== null ? fmtEuro(v.cppProd, 4) : "—") + '</b><small>CPP outillage en production</small></div>'
        + '<p class="etat" style="padding:8px 0 0">' + esc(vl.ligne.nom) + ' · <code>' + esc(v.opCode) + '</code> ' + esc(v.nomOp || "") + "</p></div>"
        + '<div class="droite"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">'
        + '<span class="dec-mot">' + esc(d.mot) + '</span><span class="mot ' + classe + '">' + esc(v.verdict) + "</span></div>"
        + '<p class="dec-pourquoi">' + esc(d.pourquoi) + "</p>";
      html += '<div class="deux">'
        + cellule("Gain acté", v.gainActe !== null ? fmtEuro(v.gainActe, 4) : "—", v.gainActeAnnuel !== null ? fmtEnt(v.gainActeAnnuel) + " €/an" : "rien d'acté")
        + cellule("Gain projeté", v.gainProjete !== null ? fmtEuro(v.gainProjete, 4) : "—", v.gainProjeteAnnuel !== null ? fmtEnt(v.gainProjeteAnnuel) + " €/an" : (v.gainProjete !== null ? "volume non saisi" : "aucun essai"))
        + cellule("Cible du site", v.cible !== null ? fmtEuro(v.cible, 4) : "— non saisie", "par pièce")
        + cellule("Chemin vers la cible", v.chemin !== null ? Math.round(v.chemin) + " %" : "—", v.chemin !== null ? "du meilleur scénario" : "cible ou essai manquant")
        + "</div></div></section>";
    });
  });

  html += '<div class="garder"><button class="btn primaire" data-act="aller" data-id="5">Voir la page à emporter →</button></div>';
  return html;
}

/* ── ÉCRAN 5 : l'A4 ─────────────────────────────────────────────────────── */

function ecran5() {
  const tuiles = tuilesDeLignes(lignes());
  const verdicts = lignes().map(verdictLigne);
  const recap = recapLignes(verdicts);
  const decisions = [];
  verdicts.forEach(vl => vl.postes.forEach(p => {
    if (p.code === "pret" || p.code === "essai" || p.code === "gagne") decisions.push({ vl: vl, p: p });
  }));
  decisions.sort((a, b) => (ORDRE_VERDICT[a.p.code] ?? 9) - (ORDRE_VERDICT[b.p.code] ?? 9));

  const aujourdhui = new Date().toLocaleDateString("fr-FR", { day: "2-digit", month: "long", year: "numeric" });
  let html = '<div class="garder"><button class="btn primaire" data-act="imprimer">⎙ Imprimer cette page</button></div>'
    + '<div class="a4"><h1>Suivi d\'optimisation — coût d\'outillage</h1>'
    + '<p class="sous">' + esc(aujourdhui) + " · Sept Fons · CPP = Σ prix ÷ (arêtes × charnière), le seul chiffre comparable au classeur · source : "
    + esc(ETAT.source.type === "jeu" ? "jeu d'exemple" : ETAT.source.nom) + "</p>";

  html += "<h2>Les lignes</h2><table><thead><tr><th>Ligne</th><th>CPU outillage /pce</th><th>Gain acté</th><th>Gain projeté</th><th>À chiffrer</th></tr></thead><tbody>";
  tuiles.forEach(t => {
    const vl = verdicts.find(v => v.ligne.id === t.ligne.id);
    html += "<tr><td><b>" + esc(t.nom) + "</b></td>"
      + "<td>" + (t.cpp !== null ? fmtEuro(t.cpp, 4) : "à chiffrer") + "</td>"
      + "<td>" + fmtEuro(sommeGains(vl.postes, "gainActe"), 4) + "</td>"
      + "<td>" + fmtEuro(sommeGains(vl.postes, "gainProjete"), 4) + "</td>"
      + "<td>" + (vl.postes.filter(p => p.code === "achiffrer").length || "—") + "</td></tr>";
  });
  html += '<tr><td><b>Total</b></td><td><b>—</b></td>'
    + "<td><b>" + (recap.cppActe ? fmtEuro(recap.cppActe, 4) : "—") + "</b></td>"
    + "<td><b>" + (recap.cppProjete ? fmtEuro(recap.cppProjete, 4) : "—") + "</b></td>"
    + "<td><b>" + recap.aChiffrer + "</b></td></tr>";
  html += "</tbody></table>";
  html += '<p class="note">Les gains actés et projetés sont deux colonnes séparées : ils ne '
    + "s'additionnent jamais. Un « à chiffrer » est un poste sans coût calculable, pas un poste gratuit.</p>";

  html += "<h2>Ce qui demande une décision</h2>";
  if (decisions.length) {
    html += '<table><thead><tr><th>Poste</th><th>Mot</th><th>Raison</th><th>Gain /pce</th></tr></thead><tbody>';
    decisions.forEach(d => {
      const v = d.p; const mot = decisionPoste(v);
      html += "<tr><td>" + esc(d.vl.ligne.nom + " · " + v.opCode + " " + (v.nomOp || "")) + "</td>"
        + "<td><b>" + esc(mot.mot) + "</b></td><td>" + esc(mot.pourquoi) + "</td>"
        + "<td>" + (v.gainProjete !== null ? fmtEuro(v.gainProjete, 4) : (v.gainActe !== null ? fmtEuro(v.gainActe, 4) : "—")) + "</td></tr>";
    });
    html += "</tbody></table>";
  } else {
    html += '<p class="note">Aucune décision en attente.</p>';
  }

  html += "<h2>La règle</h2><p class=\"note\">Le CPP affiché est le coût d'<b>outillage</b> de la "
    + "pièce — celui du classeur. Le temps machine, le rebut et les pièces détachées sont "
    + "valorisés dans l'outil mais jamais comparés au classeur : ce n'est pas le même périmètre. "
    + "Un chiffre absent est écrit comme absent ; rien n'est estimé.</p>";

  html += '<div class="pied"><span>Document généré localement · v' + esc(OUTIL_VERSION)
    + " · assemblage " + esc(EMPREINTE_ASSEMBLAGE) + "</span>"
    + "<span><b>Confidentiel interne</b> — données d'atelier, ne pas diffuser</span></div></div>";
  return html;
}

/* ── le rendu ────────────────────────────────────────────────────────────── */

function rendre() {
  const etapes = $("etapes");
  if (etapes) etapes.innerHTML = ECRANS.map(e =>
    '<button class="etape' + (ETAT.etape === e.n ? " on" : "") + '" data-act="aller" data-id="' + e.n + '">'
    + '<span class="n">' + e.n + "</span>" + esc(e.nom) + "</button>").join("");
  const src = $("sourceLigne");
  if (src) src.innerHTML = badgeSource();
  const vue = $("vue");
  if (vue) vue.innerHTML = panoramaSiImport() + ECRANS[ETAT.etape - 1].fn();
  const pied = $("pied");
  if (pied) pied.innerHTML = "Suivi CPP — Sept Fons · outil local, aucune donnée transmise sans « Exporter » ou « Partager » · v"
    + esc(OUTIL_VERSION) + " · assemblage " + esc(EMPREINTE_ASSEMBLAGE);
}

function panoramaSiImport() {
  const s = ETAT.source;
  if (s.type !== "import" || !s.rapport) return "";
  const r = s.rapport;
  let html = '<div class="decl"><b>Import réussi — ' + esc(s.nom) + "</b> : "
    + r.lignes + " lignes, " + r.references + " références, " + r.ops + " opérations, "

function lireFichier(ev) {
  const fichier = ev && ev.target && ev.target.files && ev.target.files[0];
  if (!fichier) return;
  const lecteur = new FileReader();
  lecteur.onload = () => {
    try {
      const source = JSON.parse(lecteur.result);
      appliquerImport(source, fichier.name, fichier.size);
    } catch (e) {
      ETAT.source = { type: "erreur", nom: fichier.name, rapport: null, poids: null };
      afficherImportErreur("Ce fichier n'est pas du JSON lisible : " + e.message);
    }
  };
  lecteur.onerror = () => afficherImportErreur("Fichier illisible.");
  lecteur.readAsText(fichier);
}

function appliquerImport(source, nom, taille) {
  const p = projeter(source);
  if (!p.ok) {
    /* Un refus doit se voir au bandeau : un écran qui garde l'ancienne source
       pendant qu'il affiche une erreur laisse croire que les données ont changé. */
    ETAT.source = { type: "erreur", nom: nom || "fichier", rapport: null, poids: null };
    afficherImportErreur(p.erreur);
    return false;
  }
  ETAT.donnees = relireEtat({ lignes: p.lignes, projets: [], livraisons: [] });
  ETAT.source = { type: "import", nom: nom || "export", rapport: p.rapport, poids: poids(source, p.lignes) };
  ETAT.ligneId = null; ETAT.etape = 1;
  marquerSale(); rendre(); ouvrirImport();
  return true;
}

function afficherImportErreur(message) {
  const zone = $("importRetour");
  if (zone) zone.innerHTML = '<div class="avert bad">✕ ' + esc(message) + "</div>";
}

function etatCloudHTML() {
  const c = ETAT.cloud;
  if (!c.info) return "Le cloud n'a pas encore été lu — clique « Rafraîchir ».";
  if (c.info.vide) return "Le cloud est <b>vide</b> : le dépôt initial passe uniquement par « Déposer ce suivi ».";

    + (c.sale ? " · <b>des saisies locales ne sont pas encore déposées</b>" : " · tout est déposé");
}

function cloudFetch(url, opts, delai) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), delai || 15000);
  return fetch(url, Object.assign({}, opts, { signal: ctl.signal })).finally(() => clearTimeout(t));
}
function cloudEntetes(extra) {
  const c = ETAT.cloud;
  return Object.assign({
    "apikey": CLOUD_KEY,
    "Authorization": "Bearer " + ((c.session && c.session.access_token) || CLOUD_KEY),
    "Content-Type": "application/json"
  }, extra || {});
}
async function cloudConnexion(email, mdp) {
  ETAT.cloud.erreur = "";
  let r;
  try {
    r = await cloudFetch(CLOUD_URL + "/auth/v1/token?grant_type=password", {
      method: "POST", headers: { "apikey": CLOUD_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ email: email, password: mdp })
    });
  } catch (e) { ETAT.cloud.erreur = "Cloud injoignable (réseau ?)."; ouvrirPartage(); return false; }
  if (!r.ok) { ETAT.cloud.erreur = "Connexion refusée (" + r.status + ")."; ouvrirPartage(); return false; }
  const j = await r.json();
  ETAT.cloud.session = { access_token: j.access_token, refresh_token: j.refresh_token,
    expires_at: Date.now() + (j.expires_in || 3600) * 1000, email: email };
  try { localStorage.setItem(CLE_SESSION, JSON.stringify(ETAT.cloud.session)); } catch (e) {}
  ouvrirPartage();
  return true;
}
function cloudDeconnexion() {
  ETAT.cloud.session = null; ETAT.cloud.info = null; ETAT.cloud.stamp = null;
  try { localStorage.removeItem(CLE_SESSION); localStorage.removeItem(CLE_STAMP); } catch (e) {}
  ouvrirPartage();
}
async function cloudLireEtat() {
  const r = await cloudFetch(CLOUD_URL + "/rest/v1/" + CLOUD_TABLE + "?id=eq.1&select=donnees,modifie_le,modifie_par",
    { headers: cloudEntetes() });
  if (!r.ok) throw new Error("cloud injoignable (" + r.status + ")");
  const j = await r.json();
  return j[0] || null;
}

/* La lecture LÉGÈRE : le tampon horaire seul, sans le donnees (3 à 4 Mo).
   Le projet vient de se faire restreindre pour quota de bande sortante
   dépassé — chaque clic « Rafraîchir » qui re-télécharge tout l'état pour
   afficher une date est du gaspillage qui revient cher. Les lectures
   complètes restent là où le contenu est nécessaire : Prendre, Déposer. */
async function cloudLireTampon() {
  const r = await cloudFetch(CLOUD_URL + "/rest/v1/" + CLOUD_TABLE + "?id=eq.1&select=modifie_le,modifie_par",
    { headers: cloudEntetes() });
  if (!r.ok) throw new Error("cloud injoignable (" + r.status + ")");
  const j = await r.json();
  return j[0] || null;
}
async function cloudRafraichir() {
  const c = ETAT.cloud;
  c.erreur = "";
  try {
    const row = await cloudLireTampon();
    c.info = row ? { vide: false, modifie_le: row.modifie_le, modifie_par: row.modifie_par }
                 : { vide: true, modifie_le: null, modifie_par: null };
  } catch (e) { c.erreur = e.message; }
  ouvrirPartage();
}
async function cloudDeposer() {
  const c = ETAT.cloud;
  if (!c.session) return;
  const avant = await cloudLireEtat().catch(() => null);
  if (avant && !confirm("Le cloud porte déjà un suivi déposé par « " + (avant.modifie_par || "?")
    + " ». Le remplacer ? L'ancienne version est archivée.")) return;
  c.enCours = true; ouvrirPartage();
  try {
    if (avant) {
      await cloudFetch(CLOUD_URL + "/rest/v1/" + CLOUD_TABLE_HIST, {
        method: "POST", headers: cloudEntetes({ "Prefer": "return=minimal" }),
        body: JSON.stringify({ donnees: avant.donnees, sauve_par: avant.modifie_par || "" })
      });
    }
    ETAT.donnees.exporteLe = new Date().toISOString();
    ETAT.donnees.exportePar = (c.session.email || "local");
    const corps = { id: 1, donnees: ETAT.donnees, modifie_par: c.session.email || "local" };
    let r = await cloudFetch(CLOUD_URL + "/rest/v1/" + CLOUD_TABLE + "?id=eq.1", {
      method: "PATCH", headers: cloudEntetes({ "Prefer": "return=representation" }),
      body: JSON.stringify(corps)
    });
    if (!r.ok) {
      const texte = await r.text();
      if (r.status === 404 || /does not exist|relation/i.test(texte)) {
        throw new Error("La table " + CLOUD_TABLE + " n'existe pas encore. SQL à exécuter une fois : "
          + "CREATE TABLE " + CLOUD_TABLE + " (id int primary key, donnees jsonb, modifie_par text, "
          + "modifie_le timestamptz default now()); CREATE TABLE " + CLOUD_TABLE_HIST
          + " (id bigint generated always as identity primary key, donnees jsonb, sauve_par text, "
          + "depose_le timestamptz default now()); puis active RLS « authenticated ».");
      }
      throw new Error("dépôt refusé (" + r.status + ")");
    }
    const j = await r.json();
    if (!j.length) {
      r = await cloudFetch(CLOUD_URL + "/rest/v1/" + CLOUD_TABLE, {
        method: "POST", headers: cloudEntetes({ "Prefer": "resolution=merge-duplicates,return=representation" }),
        body: JSON.stringify(corps)
      });
      if (!r.ok) throw new Error("dépôt refusé (" + r.status + ")");
    }
    c.stamp = (j[0] && j[0].modifie_le) || new Date().toISOString();
    try { localStorage.setItem(CLE_STAMP, c.stamp); } catch (e) {}
    c.sale = false;
    c.info = { vide: false, modifie_le: c.stamp, modifie_par: corps.modifie_par };
    c.note = "Déposé à " + new Date().toLocaleTimeString("fr-FR") + ".";
    ETAT.source = { type: "cloud", nom: "suivi partagé", rapport: ETAT.source.rapport, poids: ETAT.source.poids };
    marquerSale();
  } catch (e) { c.erreur = e.message; }
  c.enCours = false;
  ouvrirPartage();
}
async function cloudPrendre() {
  const c = ETAT.cloud;
  c.erreur = "";
  try {
    const row = await cloudLireEtat();
    if (!row) { c.erreur = "Le cloud est vide — rien à prendre."; ouvrirPartage(); return; }
    sauvegarderLocal();
    ETAT.donnees = relireEtat(row.donnees);
    ETAT.source = { type: "cloud", nom: "suivi partagé", rapport: null, poids: null };
    c.stamp = row.modifie_le;
    try { localStorage.setItem(CLE_STAMP, c.stamp); } catch (e) {}
    c.sale = false;
    ETAT.ligneId = null; ETAT.etape = 1;
    fermerPanneaux(); marquerSale(); rendre();
  } catch (e) { c.erreur = e.message; ouvrirPartage(); }
}

function enregistrerEssai() {
  const s = ETAT.saisie;
  if (!s) return;
  const trouve = trouverScenario(s.scId);
  if (!trouve) { ETAT.saisie = null; rendre(); return; }
  const logements = s.logements.filter(l => l.charniere !== "" && l.charniere !== null && !isNaN(parseFloat(l.charniere)))
    .map(l => ({ logementId: l.logementId, logementNom: l.logementNom,
      charniere: parseFloat(l.charniere) }));
  const prels = s.prels.filter(p =>
    p.piece !== "" || p.battD !== "" || p.battG !== "")
    .map((p, i) => ({
      id: "pr_" + Date.now().toString(36) + "_" + i,
      piece: p.piece === "" ? "" : parseFloat(p.piece),
      logementId: (logements[0] && logements[0].logementId) || "",
      pointMesure: "", batt: "", battD: p.battD === "" ? "" : parseFloat(p.battD),
      battG: p.battG === "" ? "" : parseFloat(p.battG),
      usure: p.usure, valeur2: ""
    }));
  trouve.sc.essais.push({
    id: "es_" + Date.now().toString(36),
    titre: s.titre || "Essai",
    date: s.date, operateur: s.operateur, equipe: s.equipe, but: s.but,
    observations: "", cloture: null,
    params: { logements: logements },
    prelevements: prels
  });
  ETAT.modifiePar = ETAT.modifiePar || s.operateur || "";
  ETAT.saisie = null;
  marquerSale(); rendre();
}

/* ── les actions ────────────────────────────────────────────────────────── */

function changerStatut(scId, statut) {
  const trouve = trouverScenario(scId);
  if (!trouve) return;
  trouve.sc.statut = statut;
  if (statut === "serie") {
    /* Un poste n'a qu'UNE production : passer un scénario en série retire la
       baseline à ses frères, sinon deux scénarios se disent « en production »
       et le poste se compare à lui-même. */
    trouve.sc.baseline = true;
    (trouve.op.scenarios || []).forEach(s => { if (s.id !== trouve.sc.id) s.baseline = false; });
  }
  marquerSale(); rendre();
}

function fermerPanneaux() {
  ETAT.panneau = null;
  const o = $("overlay");
  if (o) o.hidden = true;
}

function appliquerTheme() {
  const t = ETAT.theme;
  if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
  else if (t === "light") document.documentElement.setAttribute("data-theme", "light");
  else document.documentElement.removeAttribute("data-theme");
}

const ACTIONS = {
  "aller": id => aller(parseInt(id, 10)),
  "ouvrir-ligne": id => { ETAT.ligneId = id; ETAT.etape = 2; rendre(); },
  "aller-scenarios": id => { ETAT.etape = 3; rendre(); },
  "nouvel-essai": (id, id2) => ouvrirEssai(id, id2 || null),
  "annuler-essai": () => { ETAT.saisie = null; rendre(); },
  "ajouter-prel": () => { if (ETAT.saisie) { ETAT.saisie.prels.push({ piece: "", battD: "", battG: "", usure: "", logementId: "" }); rendre(); } },
  "retirer-prel": id => { if (ETAT.saisie) { ETAT.saisie.prels.splice(parseInt(id, 10), 1); rendre(); } },
  "voir-essai": (id, id2) => { ETAT.etape = 3; rendre(); },
  "editer-logement": (id, id2) => ouvrirLogement(id, id2),
  "passer-serie": id => changerStatut(id, "serie"),
  "abandonner": id => changerStatut(id, "abandonne"),
  "ouvrir-import": () => ouvrirImport(),
  "retour-jeu": () => retourJeu(),
  "exporter": () => exporter(),
  "ouvrir-reglages": () => ouvrirReglages(),
  "ouvrir-partage": () => ouvrirPartage(),
  "fermer-panneau": () => fermerPanneaux(),
  "basculer-theme": () => {
    ETAT.theme = ETAT.theme === "dark" ? "light" : "dark";
    appliquerTheme(); marquerSale();
  },
  "imprimer": () => window.print(),
  "cloud-connexion": () => {
    const e = $("cloudEmail"), m = $("cloudMdp");
    if (e && m) cloudConnexion(e.value, m.value);
  },
  "cloud-deconnexion": () => cloudDeconnexion(),
  "cloud-deposer": () => cloudDeposer(),
  "cloud-prendre": () => cloudPrendre(),
  "cloud-rafraichir": () => cloudRafraichir()
};

function faire(act, id, id2) {
  const f = ACTIONS[act];
  if (f) f(id, id2);
}

/* ── les écouteurs (délégués : ils survivent au rendu) ──────────────────── */

document.addEventListener("click", ev => {
  const cible = ev.target.closest ? ev.target.closest("[data-act]") : null;
  if (!cible) return;
  faire(cible.getAttribute("data-act"), cible.getAttribute("data-id"), cible.getAttribute("data-id2"));
});
document.addEventListener("change", ev => {
  const cible = ev.target;
  const champ = cible.getAttribute && cible.getAttribute("data-champ");
  if (!champ) return;
  const id = cible.getAttribute("data-id");
  const v = cible.value;
  switch (champ) {
    case "saisie-op": if (ETAT.saisie) { ETAT.saisie.opId = v; const poste = postesDeLigne(ligneCourante()).find(p => p.op.id === v); ETAT.saisie.scId = poste && poste.scs[0] ? poste.scs[0].id : null; ouvrirEssai(ETAT.saisie.opId, ETAT.saisie.scId); } break;
    case "saisie-sc": if (ETAT.saisie) { ETAT.saisie.scId = v; ouvrirEssai(ETAT.saisie.opId, v); } break;
    case "saisie-date": if (ETAT.saisie) ETAT.saisie.date = v; break;
    case "saisie-equipe": if (ETAT.saisie) ETAT.saisie.equipe = v; break;
    case "saisie-titre": if (ETAT.saisie) ETAT.saisie.titre = v; break;
    case "saisie-operateur": if (ETAT.saisie) ETAT.saisie.operateur = v; break;
    case "saisie-but": if (ETAT.saisie) ETAT.saisie.but = v; break;
    case "saisie-charniere": if (ETAT.saisie) { const l = ETAT.saisie.logements.find(x => x.logementId === id); if (l) l.charniere = v; } break;
    case "prel-piece": if (ETAT.saisie) ETAT.saisie.prels[+id].piece = v; break;
    case "prel-battd": if (ETAT.saisie) ETAT.saisie.prels[+id].battD = v; break;
    case "prel-battg": if (ETAT.saisie) ETAT.saisie.prels[+id].battG = v; break;
    case "prel-usure": if (ETAT.saisie) ETAT.saisie.prels[+id].usure = v; break;
    case "log-mabec": case "log-iso": case "log-prix": case "log-aretes": case "log-charniere": case "log-vc": case "log-f":
      majChampLogement(id, ETAT.panneau === "logement" ? _scPanneau : "", champ.replace("log-", ""), v); break;
    case "taux": { const l = lignes().find(x => x.id === id); if (l) { const n = parseFloat(v); l.coutHoraire = (v === "" || isNaN(n)) ? "" : n; marquerSale(); } break; }
    case "spec-batt": { const n = parseFloat(v); ETAT.donnees.specsUsine.battement = (v === "" || isNaN(n)) ? SEUILS.battementDefaut : n; marquerSale(); break; }
    case "spec-ra": { const n = parseFloat(v); ETAT.donnees.specsUsine.ra = (v === "" || isNaN(n)) ? SEUILS.raDefaut : n; marquerSale(); break; }
    case "auteur": ETAT.modifiePar = v; break;
  }
});
document.addEventListener("submit", ev => {
  const f = ev.target;
  if (f.getAttribute && f.getAttribute("data-form") === "essai") { ev.preventDefault(); enregistrerEssai(); }
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape") fermerPanneaux();
});
let _scPanneau = null;
const _ouvrirLogementBrut = ouvrirLogement;
ouvrirLogement = function (logementId, scId) { _scPanneau = scId; _ouvrirLogementBrut(logementId, scId); };
$("overlay") && $("overlay").addEventListener("click", ev => { if (ev.target === $("overlay")) fermerPanneaux(); });

/* ── la porte de test ───────────────────────────────────────────────────── */

window.resume = {
  ETAT: ETAT, ECRANS: ECRANS, JEUX: JEUX,
  EMPREINTE_ASSEMBLAGE: EMPREINTE_ASSEMBLAGE,
  rendre: rendre, aller: aller, faire: faire,
  ouvrirLigne: ACTIONS["ouvrir-ligne"],
  ouvrirImport: ouvrirImport, appliquerImport: appliquerImport, retourJeu: retourJeu,
  ouvrirEssai: ouvrirEssai, enregistrerEssai: enregistrerEssai,
  changerStatut: changerStatut, ouvrirLogement: ouvrirLogement,
  majChampLogement: majChampLogement, ouvrirReglages: ouvrirReglages,
  ouvrirPartage: ouvrirPartage, exporter: exporter,
  sauvegarderLocal: sauvegarderLocal, chargerLocal: chargerLocal,
  cloudConnexion: cloudConnexion, cloudDeposer: cloudDeposer, cloudPrendre: cloudPrendre,
  cloudRafraichir: cloudRafraichir, cloudDeconnexion: cloudDeconnexion,
  ecran1: ecran1, ecran2: ecran2, ecran3: ecran3, ecran4: ecran4, ecran5: ecran5,
  ligneCourante: ligneCourante, posterHTML: posteHTML, essaiLigneHTML: essaiLigneHTML,
  badgeSource: badgeSource, panoramaSiImport: panoramaSiImport
};

chargerLocal();
rendre();
</script>
</body>
</html>

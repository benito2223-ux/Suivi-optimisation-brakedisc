/* ============================================================================
   PROJET3 — LE SYSTÈME VISUEL
   L'identité restaurée au Tour 56 : fond gris, cartes blanches, aplats qui
   ressortent, trois rôles de forme (Manrope / Roboto / IBM Plex Mono),
   rayons 3 et 4 px. Deux thèmes, impression A4, tactile ≥ 44 px.

   Espacement 4/8/12/16/24/32 — on sépare par du vide, pas par des traits.
   Une seule forme de badge partout : seule la couleur change.
   ========================================================================== */

:root {
  /* les encres du jour */
  --bg: #e8eaed;
  --carte: #ffffff;
  --carte-2: #f6f7f8;
  --ink: #1a1a1a;
  --body: #4a5560;
  --label: #5a6470;
  --filet: #dfe2e6;
  --filet-fort: #c9cdd3;

  /* les couleurs qui comptent (réservées à ce qui compte) */
  --blue: #1b5ea6;
  --blue-encore: #164a83;
  --blue-fluide: #dbe7f3;
  --red: #e2001a;
  --ok: #1f7a3f;
  --ok-fluide: #ddefe4;
  --bleu-fluide: #dbe7f3;
  --ambre: #9a6a00;
  --ambre-fluide: #f6ecd4;
  --gris: #6a7480;
  --gris-fluide: #e9ebee;

  /* les formes */
  --radius: 3px;
  --radius-lg: 4px;
  --font-disp: 'Manrope', 'Open Sans', Arial, sans-serif;
  --font-body: 'Roboto', 'Open Sans', Arial, sans-serif;
  --font-mono: 'IBM Plex Mono', Consolas, monospace;

  --ombre: 0 1px 2px rgba(10, 15, 25, 0.06), 0 1px 6px rgba(10, 15, 25, 0.05);
  --ombre-forte: 0 4px 14px rgba(10, 15, 25, 0.14), 0 2px 4px rgba(10, 15, 25, 0.10);
}

/* ── la nuit ─────────────────────────────────────────────────────────── */
[data-theme="nuit"] {
  --bg: #14171a;
  --carte: #1d2126;
  --carte-2: #24292e;
  --ink: #eceff2;
  --body: #b6bdc5;
  --label: #8d969f;
  --filet: #2e343a;
  --filet-fort: #3c434a;

  --blue: #6aa5dd;
  --blue-encore: #8cbbE9;
  --blue-fluide: #223140;
  --red: #ff7a70;
  --ok: #5cc98a;
  --ok-fluide: #1d2e25;
  --bleu-fluide: #223140;
  --ambre: #e0b25c;
  --ambre-fluide: #332b1a;
  --gris: #99a2ab;
  --gris-fluide: #262b30;

  --ombre: 0 1px 2px rgba(0, 0, 0, 0.35);
  --ombre-forte: 0 4px 16px rgba(0, 0, 0, 0.5);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
}

h1, h2, h3, h4 { font-family: var(--font-disp); color: var(--ink); margin: 0; }
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }

/* le mono est réservé aux chiffres : tabular pour s'aligner */
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* ============================================================================
   LA BARRE DU HAUT — la marque, le fil, les actions
   ========================================================================== */

.topbar {
  background: var(--ink);
  color: #ffffff;
  padding: 10px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 30;
  box-shadow: var(--ombre);
}
[data-theme="nuit"] .topbar { background: #0d0f11; border-bottom: 1px solid var(--filet); }

.topbar .marque {
  font-family: var(--font-disp);
  font-weight: 800;
  font-size: 16px;
  letter-spacing: 0.2px;
  color: #ffffff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.topbar .marque .site { color: #b8cfe6; font-weight: 600; }
.topbar .marque .confidentiel { color: #ffb3bd; font-weight: 500; margin-left: 10px; }

.topbar .actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.topbar .theme-bascule {
  background: transparent;
  border: 1px solid rgba(255, 255, 255, 0.35);
  color: #fff;
  border-radius: var(--radius);
  min-width: 44px;
  min-height: 36px;
  cursor: pointer;
  font-size: 15px;
}
.topbar .theme-bascule:hover { background: rgba(255, 255, 255, 0.12); }

/* ============================================================================
   LES BOUTONS — une famille, des tailles franches
   ========================================================================== */

.bouton {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  padding: 8px 16px;
  border-radius: var(--radius);
  border: 1px solid var(--filet-fort);
  background: var(--carte);
  color: var(--ink);
  font-family: var(--font-disp);
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  white-space: nowrap;
}
.bouton:hover { border-color: var(--blue); color: var(--blue); }
.bouton.primaire {
  background: var(--blue);
  border-color: var(--blue);
  color: #ffffff;
}
.bouton.primaire:hover { background: var(--blue-encore); border-color: var(--blue-encore); color: #fff; }
.bouton.danger { color: var(--red); border-color: var(--red); background: transparent; }
.bouton.danger:hover { background: var(--red); color: #fff; }
.bouton.petit { min-height: 34px; padding: 4px 10px; font-size: 13px; }
.bouton:disabled { opacity: 0.5; cursor: default; }

.topbar .bouton {
  background: transparent;
  border-color: rgba(255, 255, 255, 0.4);
  color: #fff;
  min-height: 38px;
}
.topbar .bouton:hover { background: rgba(255, 255, 255, 0.12); border-color: #fff; color: #fff; }
.topbar .bouton.primaire { background: #ffffff; color: #16324f; border-color: #ffffff; }
.topbar .bouton.primaire:hover { background: #dbe7f3; }

/* le menu groupé (remplace tout menu plat fourre-tout) */
.menu-famille { padding: 8px 0; }
.menu-famille .titre-famille {
  font-family: var(--font-disp);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--label);
  padding: 10px 18px 4px;
}
.menu-famille .item {
  display: block;
  width: 100%;
  text-align: left;
  background: none;
  border: none;
  padding: 12px 18px;
  font-size: 15px;
  color: var(--ink);
  cursor: pointer;
  min-height: 44px;
}
.menu-famille .item:hover { background: var(--carte-2); color: var(--blue); }
.menu-famille .item.rouge { color: var(--red); }
.menu-famille .separateur { height: 1px; background: var(--filet); margin: 8px 0; }
.menu-famille .zone-rouge { background: var(--carte-2); }

/* ============================================================================
   LE FIL — une seule hiérarchie visible à la fois
   ========================================================================== */

.fil {
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
  padding: 14px 20px 2px;
  max-width: 1180px;
  margin: 0 auto;
  font-size: 13px;
  color: var(--label);
}
.fil a, .fil button-lien {
  color: var(--blue);
  cursor: pointer;
  background: none;
  border: none;
  padding: 0;
  font-size: 13px;
  font-family: var(--font-body);
  min-height: 0;
}
.fil a:hover, .fil button-lien:hover { text-decoration: underline; }
.fil .maillon-actif { color: var(--ink); font-weight: 700; font-size: 15px; font-family: var(--font-disp); }
.fil .sep { color: var(--filet-fort); }

/* ============================================================================
   LES PAGES
   ========================================================================== */

.page {
  max-width: 1180px;
  margin: 0 auto;
  padding: 8px 20px 64px;
}
.page-titre { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin: 10px 0 4px; }
.page-titre h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.2px; }
.page-titre .peri { color: var(--blue); font-family: var(--font-disp); font-weight: 700; font-size: 15px; }
.sous-titre { color: var(--label); margin: 0 0 18px; font-size: 14px; }

/* ============================================================================
   LE BANDEAU — les chiffres qui comptent, avec leur contexte en dessous
   ========================================================================== */

.bandeau {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin: 14px 0 22px;
}
.bandeau .bloc {
  background: var(--carte);
  border-radius: var(--radius-lg);
  box-shadow: var(--ombre);
  padding: 14px 18px 12px;
}
.bandeau .bloc .etiquette {
  font-family: var(--font-disp);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.1px;
  text-transform: uppercase;
  color: var(--label);
}
.bandeau .bloc .valeur {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-size: 30px;
  font-weight: 500;
  margin: 4px 0 2px;
  color: var(--ink);
}
.bandeau .bloc .valeur .unite { font-size: 15px; color: var(--label); margin-left: 4px; }
.bandeau .bloc .contexte { font-size: 12.5px; color: var(--label); min-height: 18px; }
.bandeau .bloc.acte .valeur { color: var(--ok); }
.bandeau .bloc.rouge .valeur { color: var(--red); }

/* ============================================================================
   LES TUILES — une par ligne, la couleur ET le mot disent l'état
   ========================================================================== */

.grille-tuiles {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 14px;
  margin: 6px 0 24px;
}
.tuile {
  background: var(--carte);
  border-radius: var(--radius-lg);
  box-shadow: var(--ombre);
  padding: 0;
  overflow: hidden;
  cursor: pointer;
  border: 1px solid transparent;
  text-align: left;
  transition: box-shadow 0.12s;
}
.tuile:hover { box-shadow: var(--ombre-forte); }
.tuile .t-ete {
  height: 4px;
  background: var(--tuile-encre, var(--gris));
}
.tuile .t-corps { padding: 14px 18px 16px; }
.tuile .t-entete { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
.tuile .t-nom { font-family: var(--font-disp); font-weight: 800; font-size: 17px; color: var(--ink); }
.tuile .t-code { font-family: var(--font-mono); font-size: 12px; color: var(--label); }
.tuile .t-chiffre { display: flex; align-items: baseline; gap: 8px; margin: 8px 0 2px; }
.tuile .t-cpp { font-family: var(--font-mono); font-size: 26px; font-weight: 500; color: var(--ink); }
.tuile .t-cpp-unite { font-size: 12px; color: var(--label); }
.tuile .t-ecart { font-family: var(--font-mono); font-size: 12.5px; }
.tuile .t-ecart.sur { color: var(--red); }
.tuile .t-ecart.sous { color: var(--ok); }

/* ======== src/coeur.js ======== */
/* ============================================================================
   PROJET3 — LE NOYAU
   Fonctions PURES. Aucun DOM, aucun état global, aucune lecture du disque.
   Écrites et testées AVANT le moindre écran (cahier §8).

   Le driver (cahier §3) :
     CPP outillage = Σ prix / (arêtes × charnière)      — comparable au classeur
     Chaque CPP affiché porte deux chiffres : le PRÉVU du scénario et l'OBTENU
     par l'essai. Le temps machine se lit à côté, jamais fusionné.

"use strict";

const APP_NOM = "Suivi optimisation SPK";
const FORMAT_ACTUEL = 9;

/* ============================================================================
   0. LE FORMATAGE — pur lui aussi
   ========================================================================== */

function fmt(v, d) {
  if (v === null || v === undefined || v === "" || isNaN(parseFloat(v))) return "—";
  const n = parseFloat(v);
  return n.toFixed(d === undefined ? 3 : d).replace(".", ",");
}

/* Garde la distinction « 0 » (mesuré) / « pas saisi » (absent) : le champ vide
   ne s'affiche pas comme 0, il s'affiche comme ce qui manque (cahier §5.2). */
function fmtDispo(v, d, manque) {
  if (v === null || v === undefined || v === "") return manque || "— non saisi";
  if (isNaN(parseFloat(v))) return manque || "— non saisi";
  return fmt(v, d);

function fmtEuro(v, d) {
  if (v === null || v === undefined || v === "" || isNaN(parseFloat(v))) return "—";
  return fmt(v, d === undefined ? 4 : d) + " €";

function nombre(v) {
  const n = parseFloat(v);
  return isNaN(n) ? null : n;

/* ============================================================================

/* Le coût d'UN logement : le prix de la plaquette divisé par ce qu'elle rend.
   prix en €, arêtes en nombre d'arêtes, charnière en pièces -> € par pièce.
   Une donnée manquante ou absurde donne null (non chiffrable) — jamais 0. */
function coutLogement(log) {
  if (!log) return null;
  const prix = nombre(log.prix);
  const aretes = nombre(log.aretes);
  const charniere = nombre(log.charniere);
  if (prix === null || prix <= 0) return null;
  if (aretes === null || aretes <= 0) return null;
  if (charniere === null || charniere <= 0) return null;
  return prix / (aretes * charniere);
}

/* Le CPP outillage d'un scénario = la somme sur TOUS ses logements.
   Invariant : un logement non chiffrable est COMPTE, pas dilué — l'appelant
   dispose de cppScenarioDetail() pour savoir combien ont été écartés. */
function cppOutillageScenario(sc) {
  const d = cppScenarioDetail(sc);
  return d.cpp;
}

function cppScenarioDetail(sc) {
  const vide = { cpp: null, nbChiffrables: 0, nbNonChiffrables: 0 };
  if (!sc || !sc.outils) return vide;
  let total = 0, n = 0, ecartes = 0;
  (sc.outils || []).forEach(o => {
    (o.logements || []).forEach(l => {
      const c = coutLogement(l);
      if (c === null) { ecartes++; return; }
      total += c; n++;

  return { cpp: n ? total : null, nbChiffrables: n, nbNonChiffrables: ecartes };

  if (!outil || !outil.logements) return null;
  const parts = (outil.logements || []).map(coutLogement).filter(v => v !== null);
  if (!parts.length) return null;
  return parts.reduce((a, b) => a + b, 0);

   outil, jamais par regroupement sur le numéro (deux outils peuvent porter

function outillageDeScenario(sc) {
  if (!sc) return { outils: [], cpp: null, nonChiffrables: 0 };
  const outils = [];
  let total = 0, chiffres = 0, nonChiffrables = 0;
  (sc.outils || []).forEach(o => {
    const logements = (o.logements || []).map(l => ({
      outilId: o.id || "",
      outilNumero: o.numero || "?",
      outilDescription: o.description || "",
      logementId: l.id || "",
      logementNom: l.nom || "?",

      mabec: l.mabec || "",

      id: o.id || "",
      numero: o.numero || "?",
      description: o.description || "",
      correcteur: o.correcteur || "",
      cpp: cppOutil,
      logements: logements

   ========================================================================== */

/* Le prix et les arêtes viennent de la définition du logement dans le
   scénario ; la charnière vient de l'essai lui-même (charnière mesurée).

   qui tient mieux que prévu ne se voit nulle part.
   Invariant : un logement non chiffrable est compté (nonChiffrables), pas dilué. */
function cppEssaiObtenu(scenario, essai) {
  const vide = { cpp: null, nbLogements: 0, nonChiffrables: 0 };
  if (!scenario || !essai) return vide;
  const definition = {};
  (scenario.outils || []).forEach(o => (o.logements || []).forEach(l => {
    definition[l.id] = l;
  }));
  const suivis = (essai.params && essai.params.logements) || [];
  if (!suivis.length) return vide;
  let total = 0, n = 0, ecartes = 0;
  suivis.forEach(p => {
    const def = definition[p.logementId];
    const prix = (def && def.prix !== "" && def.prix != null) ? def.prix : p.prix;
    const aretes = (def && def.aretes !== "" && def.aretes != null) ? def.aretes : p.aretes;
    const charniere = (p.charniere !== "" && p.charniere != null)

  });
  if (groupe !== null) total += groupe;
  if (isNaN(total) || total <= 0) return null;
  return total;
}

/* ============================================================================
   4. LE CHEMIN PROD → CIBLE
   ========================================================================== */

/* Combien de chemin a fait le meilleur scénario disponible vers la cible ?
   Renvoie null si on ne peut pas calculer — et l'appelant affiche pourquoi.
   Déjà sous la cible : le chemin est fait (100). */
function cheminCPP(coutProd, coutMeilleur, cible) {
  const c = nombre(cible);
  if (c === null) return null;
  const p = nombre(coutProd);
  const m = nombre(coutMeilleur);
  if (p === null || m === null) return null;
  if (p <= c) return 100;
  if (p <= 0) return null;
  const pct = ((p - m) / (p - c)) * 100;
  return Math.max(0, Math.min(100, pct));
}

/* ============================================================================
   5. LA PREUVE — battement, Ra, répétitions
   ========================================================================== */

/* Le battement d'un prélèvement. EMAG 1 relève droite et gauche séparément
   (battD / battG) : sur les données réelles du site, `batt` est vide sur 83
   prélèvements sur 84. On prend `batt` si elle existe, sinon LE PIRE des deux
   côtés — jamais la moyenne : un état des lieux ne doit pas flatter une pièce
   qui déborde d'un seul côté. */
function battDe(prel) {
  if (!prel) return NaN;
  const b = nombre(prel.batt);
  if (b !== null) return b;
  const cotes = [nombre(prel.battD), nombre(prel.battG)].filter(v => v !== null);
  if (!cotes.length) return NaN;
  return Math.max.apply(null, cotes);
}

const BATTEMENT_DEFAUT = 0.12;
const RA_DEFAUT = 0.8;

/* Le Ra d'un prélèvement (2e critère) : champ `valeur2`, ou `valeurs.cs1.v`
   (ancienne forme). Absent = null, jamais 0. */
function raDe(prel) {
  if (!prel) return null;
  const v2 = nombre(prel.valeur2);
  if (v2 !== null) return v2;
  if (prel.valeurs && prel.valeurs.cs1) return nombre(prel.valeurs.cs1.v);
  return null;
}

/* Un prélèvement respecte-t-il tous les critères actifs du scénario ?
   Renvoie { ok: true|false|null, motif } — null = non mesurable, jamais false. */
function conforme(sc, prel) {
  if (!prel) return { ok: null, motif: "aucun prélèvement" };
  const critereBattement = !(sc && sc.battActif === false);
  if (critereBattement) {
    const limite = (sc && sc.limitOverride && sc.limitValue !== "" && sc.limitValue != null)
      ? nombre(sc.limitValue) : BATTEMENT_DEFAUT;
    if (limite === null) return { ok: null, motif: "limite de battement non saisie" };
    const b = battDe(prel);
    if (isNaN(b)) return { ok: null, motif: "battement non relevé" };
    if (b > limite) return { ok: false, motif: "battement " + fmt(b, 3) + " > " + fmt(limite, 3) };
  }
  if (sc && sc.critere2Actif) {
    const limite2 = nombre(sc.limitValue2);
    if (limite2 !== null) {
      const ra = raDe(prel);
      if (ra === null) return { ok: null, motif: "Ra non relevé" };
      if (ra > limite2) return { ok: false, motif: "Ra " + fmt(ra, 2) + " > " + fmt(limite2, 2) };
    }
  }
  const sups = (sc && sc.criteresSup || []).filter(c => c && c.actif);
  for (let i = 0; i < sups.length; i++) {
    const c = sups[i];
    const cle = c.id || ("cs" + (i + 1));
    const v = (prel.valeurs && prel.valeurs[cle]) ? nombre(prel.valeurs[cle].v) : null;
    if (v === null) continue;              // critère supplémentaire non relevé : il ne bloque pas
    const maxi = nombre(c.maxi);
    const mini = (c.miniActif) ? nombre(c.mini) : null;
    if (maxi !== null && v > maxi) return { ok: false, motif: (c.label || cle) + " " + fmt(v, 3) + " > " + fmt(maxi, 3) };
    if (mini !== null && v < mini) return { ok: false, motif: (c.label || cle) + " " + fmt(v, 3) + " < " + fmt(mini, 3) };
  }
  return { ok: true, motif: "" };
}

/* La charnière visée d'un logement pour un essai donné : la charnière mesurée
   saisie dans l'essai, à défaut celle du logement dans le scénario. */
function charniereVisee(scenario, essai, logementId) {
  const liste = (essai && essai.params && essai.params.logements) || [];
  const trouve = liste.find(p => p.logementId === logementId);
  if (trouve) {
    const v = nombre(trouve.charniere);
    if (v !== null) return v;
  }
  let out = null;
  (scenario.outils || []).forEach(o => (o.logements || []).forEach(l => {
    if (l.id === logementId) {
      const v = nombre(l.charniere);
      if (v !== null) out = v;
    }
  }));
  return out;
}

/* Le statut d'un ESSAI. L'ordre est délibéré : un essai arrêté est une
   décision, pas un échec ; une pièce hors tolérance est un fait, pas une
   opinion ; une charnière non atteinte est un travail en cours. */
function statutEssai(sc, essai) {
  if (!essai) return { code: "vide", texte: "aucun essai" };
  const prels = essai.prelevements || [];
  if (essai.cloture && essai.cloture.motif) {
    return { code: "arrete", texte: "arrêté — " + (essai.cloture.motif || "sans motif") };
  }
  if (!prels.length) return { code: "attente", texte: "aucun prélèvement" };
  const juges = prels.map(p => conforme(sc, p));
  const premierKO = juges.findIndex(j => j.ok === false);
  if (premierKO >= 0) {
    return {
      code: "nonconforme",
      texte: "hors tolérance — " + juges[premierKO].motif,
      piece: nombre(prels[premierKO].piece)
    };
  }
  const nonMesurables = juges.filter(j => j.ok === null).length;
  // la charnière : chaque logement suivi doit être atteint
  const suivis = (essai.params && essai.params.logements) || [];
  const pieces = prels.map(x => nombre(x.piece)).filter(v => v !== null);
  const derniere = pieces.length ? Math.max.apply(null, pieces) : null;
  const restants = [];
  suivis.forEach(p => {
    const cible = charniereVisee(sc, essai, p.logementId);
    if (cible === null) return;
    if (derniere === null || derniere < cible) {
      restants.push({
        logementNom: p.logementNom || "?",
        dernier: derniere === null ? 0 : derniere,
        cible: cible
      });
    }
  });
  if (restants.length) {
    return {
      code: "encours",
      texte: restants.map(r => r.logementNom + " " + fmt(r.dernier, 0) + "/" + fmt(r.cible, 0) + " p").join(" · ")
    };
  }
  if (nonMesurables > 0) {
    return { code: "attente", texte: nonMesurables + " mesure" + (nonMesurables > 1 ? "s" : "") + " à saisir" };
  }
  return { code: "conforme", texte: "conforme — charnière atteinte" };
}

/* Le statut d'un SCÉNARIO : le verdict de la décision.
   « valide » = protocole 5× complété, pas encore passé en série. */
function statutScenario(sc) {
  if (!sc) return { code: "opportunite", texte: "rien d'essayé" };
  if (sc.baseline || sc.statut === "serie") return { code: "serie", texte: "en série" };
  const essais = sc.essais || [];
  const juges = essais.map(e => statutEssai(sc, e));
  const conformes = juges.filter(v => v.code === "conforme").length;
  const seuil = nombre(sc.validationThreshold) || 5;
  if (conformes >= seuil) {
    return { code: "valide", texte: "validé " + conformes + "× — à passer en série", validations: conformes };
  }
  if (essais.length) return { code: "encours", texte: "essai en cours", validations: conformes };
  return { code: "opportunite", texte: "rien d'essayé" };
}

/* ============================================================================
   6. LE VERDICT D'UN POSTE — ce que la tuile montre, l'écran décision tranche
   ========================================================================== */

/* Quel est le scénario EN PRODUCTION d'une opération ? Dans l'ordre du plus
   sûr au plus douteux :
     1. le scénario marqué ★ (baseline)
     2. à défaut, celui qui est en série
     3. à défaut, celui dont le nom dit « base excel » (fallback d'import)
   Jamais « le premier de la liste » : sans règle explicite, deux scénarios
   peuvent revendiquer la prod et l'un passerait en silence. */
function scenarioDeProd(scs) {
  const liste = scs || [];
  return liste.find(s => s && s.baseline === true)
      || liste.find(s => s && s.statut === "serie")
      || liste.find(s => s && /base excel/i.test(s.name || s.nom || ""))
      || null;
}

/* Un poste = une opération portée par une référence, avec son scénario de
   production et ses scénarios d'optimisation. Le CALCUL est ici, jamais dans
   le rendu (cahier §5.1). */
function verdictPoste(ref, op, scs) {
  const liste = scs || (op && op.scenarios) || [];
  const prod = scenarioDeProd(liste);
  const dProd = prod ? cppScenarioDetail(prod) : { cpp: null, nbNonChiffrables: 0 };
  const cppProd = dProd.cpp;
  const cible = (ref && ref.cibleCPP !== "" && ref.cibleCPP != null) ? nombre(ref.cibleCPP) : null;

  /* Le MEILLEUR scénario d'optimisation, par CPP prévu — tous statuts, la
     prod exclue. C'est lui qui donne le chemin vers la cible et le verdict. */
  let meilleur = null;
  liste.forEach(s => {
    if (!s || (prod && s.id === prod.id)) return;
    const cpp = cppOutillageScenario(s);
    if (cpp === null) return;
    if (!meilleur || cpp < meilleur.cpp) meilleur = { sc: s, cpp: cpp };
  });

  /* Le meilleur CPP OBTENU par essai, tous scénarios confondus — la preuve
     que le terrain donne parfois mieux que le prévu (EMAG 1 · OP40 : prévu
     0,2452, obtenu 0,0797). Distinct du prévu, jamais mélangé avec lui. */
  let meilleurObtenu = null;
  liste.forEach(s => {
    (s && s.essais || []).forEach(e => {
      const o = cppEssaiObtenu(s, e);
      if (o.cpp === null) return;
      if (!meilleurObtenu || o.cpp < meilleurObtenu.cpp) {
        meilleurObtenu = { sc: s, essai: e, cpp: o.cpp, nbLogements: o.nbLogements, nonChiffrables: o.nonChiffrables };
      }
    });
  });

  const chemin = (cppProd !== null && meilleur) ? cheminCPP(cppProd, meilleur.cpp, cible) : null;

  let verdict;
  const stMeilleur = meilleur ? statutScenario(meilleur.sc) : null;
  if (!liste.length) {
    verdict = { code: "vide", texte: "aucun scénario posé sur ce poste" };
  } else if (!prod || cppProd === null) {
    verdict = { code: "achiffrer", texte: cible !== null ? "cible connue, à chiffrer" : "à chiffrer" };
  } else if (stMeilleur && stMeilleur.code === "serie") {
    verdict = { code: "gagne", texte: "gagné — en série" };
  } else if (stMeilleur && stMeilleur.code === "valide") {
    verdict = { code: "pret", texte: "validé " + (stMeilleur.validations || 5) + "× — décision à prendre" };
  } else if (meilleur && meilleur.cpp < cppProd) {
    verdict = { code: "essai", texte: "essai prometteur" };
  } else {
    verdict = { code: "rien", texte: "au meilleur connu — rien de mieux testé" };
  }

  /* Deux gains, jamais sommés (cahier §5.3) :
     gainProjete — le meilleur scénario disponible qui attend encore une
                   décision (un scénario déjà passé en série est couvert par
                   le gain acté : le compter aussi en projeté serait compter
                   deux fois le même essai) ;
     gainActe    — ce qui est réellement passé en série (un scénario « serie »
                   différent de la prod, forcément meilleur). */
  let gainProjete = null, gainActe = null;
  const dejaSerie = meilleur && (meilleur.sc.statut === "serie" || meilleur.sc.baseline === true);
  if (cppProd !== null && meilleur && meilleur.cpp < cppProd && !dejaSerie) {
    gainProjete = cppProd - meilleur.cpp;
  }
  const enSerie = liste.filter(s => s && s.statut === "serie" && !(prod && s.id === prod.id) && s.baseline !== true);
  if (cppProd !== null && enSerie.length) {
    const cppSerie = cppOutillageScenario(enSerie[0]);
    if (cppSerie !== null && cppSerie < cppProd) gainActe = cppProd - cppSerie;
  }

  /* Le gain annuel ne se calcule que si le volume annuel de la référence est
     saisi — sinon null, et l'écran dit « — volume annuel non saisi ». */
  const volume = (ref && ref.productionAnnuelle !== "" && ref.productionAnnuelle != null) ? nombre(ref.productionAnnuelle) : null;
  const gainAnnuelActe = (gainActe !== null && volume !== null) ? gainActe * volume : null;
  const gainAnnuelProjete = (gainProjete !== null && volume !== null) ? gainProjete * volume : null;

  return {
    ref: ref, op: op, scs: liste, prod: prod,
    cppProd: cppProd, nonChiffrables: dProd.nbNonChiffrables,
    cible: cible, chemin: chemin,
    meilleur: meilleur, meilleurObtenu: meilleurObtenu,
    gainProjete: gainProjete, gainActe: gainActe,
    gainAnnuelProjete: gainAnnuelProjete, gainAnnuelActe: gainAnnuelActe,
    volume: volume,
    verdict: verdict
  };
}

/* Que fait-on de ce poste ? Un seul mot — l'écran décision se lit en 15 s. */
function decisionPoste(v) {
  if (!v) return { mot: "—", pourquoi: "" };
  switch (v.verdict.code) {
    case "gagne":
      return { mot: "SÉRIE", pourquoi: "l'essai est passé en production" };
    case "pret":
      return { mot: "DÉCIDER", pourquoi: "validé " + (v.verdict.validations || 5) + " fois — il reste à dire oui ou non" };
    case "essai":
      return {
        mot: "ESSAYER",
        pourquoi: "l'essai gagne " + fmt(v.gainProjete, 4) + " €/pièce — à confirmer sur "
                  + ((v.meilleur && v.meilleur.sc.validationThreshold) || 5) + " essais conformes"
      };
    case "achiffrer":
      return { mot: "CHIFFRER", pourquoi: v.verdict.texte };
    case "vide":
      return { mot: "POSER", pourquoi: "aucun scénario posé — commencez par ce qui tourne réellement" };
    default:
      return { mot: "GARDER", pourquoi: "au meilleur connu — aucun essai ne fait mieux que la prod" };
  }
}

/* ============================================================================
   7. LES POSTES, LES RÉFÉRENCES, LES TUILES — les deux premiers étages
   ========================================================================== */

/* Le code court d'une opération (OP10, OP40). L'opCode est DÉRIVÉ, jamais
   stocké comme clé (constitution §2) — mais on le stocke comme cache à la
   normalisation, dérivé du nom, et le calcul sait le refaire. */
function opCodeDe(op) {
  if (!op) return "OP?";
  if (op.opCode && op.opCode !== "?") return op.opCode;
  if (op.ordre != null && !isNaN(parseFloat(op.ordre))) return "OP" + parseFloat(op.ordre);
  const m = /OP\s*0*(\d+)/i.exec(op.nom || "");
  return m ? "OP" + parseInt(m[1], 10) : "OP?";
}

/* Les postes d'une ligne : une opération sur une référence, avec son scénario
   de production. Un seul calcul par poste, réutilisé partout (source unique). */
function postesDeLigne(ligne) {
  const out = [];
  ((ligne && ligne.references) || []).forEach(ref => {
    ((ref && ref.ops) || []).forEach(op => {
      const scs = op.scenarios || [];
      const prod = scenarioDeProd(scs);
      out.push({
        ref: ref, op: op, scs: scs, prod: prod,
        autres: prod ? scs.filter(s => s !== prod) : scs.filter(Boolean),
        verdict: null   // rempli par verdictsDeLigne, jamais recalculé à la main
      });
    });
  });
  return out;
}

/* Le verdict pour chaque poste, posé UNE fois — le rendu lit le tableau,
   il ne recalcule pas (source unique). */
function verdictsDeLigne(ligne) {
  const postes = postesDeLigne(ligne);
  postes.forEach(p => { p.verdict = verdictPoste(p.ref, p.op, p.scs); });
  return postes;
}

/* Le CPP outillage d'une RÉFÉRENCE : la somme de ses postes chiffrables, les
   autres comptés à part (« hors n opérations non chiffrées »). */
function cppReference(postes, ref) {
  const siens = postes.filter(p => p.ref === ref || (p.ref.id && ref.id && p.ref.id === ref.id));
  let total = 0, chiffres = 0, nonChiffrables = 0, sansProd = 0;
  siens.forEach(p => {
    if (!p.prod) { sansProd++; nonChiffrables++; return; }
    const c = p.verdict ? p.verdict.cppProd : cppOutillageScenario(p.prod);
    if (c === null) { nonChiffrables++; return; }
    total += c; chiffres++;
  });
  const cible = (ref && ref.cibleCPP !== "" && ref.cibleCPP != null) ? nombre(ref.cibleCPP) : null;
  const cpp = chiffres ? total : null;
  return {
    ref: ref, cpp: cpp, nbPostes: siens.length,
    chiffres: chiffres, nonChiffrables: nonChiffrables, sansProd: sansProd,
    cible: cible,
    distanceCible: (cpp !== null && cible !== null) ? cpp - cible : null
  };
}

/* LA TUILE — l'étage 1. Une tuile par ligne, rien qu'un chef d'atelier lit en
   passant : la référence dominante, le CPP outillage, l'écart à la cible, ce
   qui attend une décision, et la prochaine étape en toutes lettres.

   Ce qui n'y est PAS (écrit pour qu'on ne le relogue pas) :
   · la cadence et la production hebdomadaire — pas de cadence mesurée par
     ligne, et la production se détaille par lot, pas par poste d'outillage ;
     l'accueil l'écrit au lieu de se taire ;
   · le delta classeur — la question modèle est à Matis, pas encore tranchée. */
function tuileDeLigne(ligne) {
  const postes = verdictsDeLigne(ligne);
  const refs = ((ligne && ligne.references) || []).map(r => cppReference(postes, r));
  const chiffrees = refs.filter(r => r.cpp !== null);

  let cppLigne = 0, nonChiffrables = 0;
  refs.forEach(r => {
    if (r.cpp !== null) cppLigne += r.cpp;
    nonChiffrables += r.nonChiffrables;
  });

  /* La référence dominante : celle qui a le plus de postes chiffrés. À égalité,
     la première du fichier — jamais un tri par nom qui ferait sauter la
     dominante d'une version à l'autre. */
  let dominante = null;
  chiffrees.forEach(r => {
    if (!dominante || r.chiffres > dominante.chiffres) dominante = r;
  });

  const famille = familleDeLigne(ligne && ligne.nom);
  const cible = dominante ? dominante.cible : null;
  const distance = dominante ? dominante.distanceCible : null;

  /* Les décisions en attente : validé 5× à confirmer, ou essai prometteur.
     Un 0 ici voudrait dire « rien à faire » — c'est un mensonge si l'écran
     regorge d'appels à l'action, donc on compte les deux codes. */
  const decisions = postes.filter(p => p.verdict.verdict.code === "pret" || p.verdict.verdict.code === "essai").length;
  const aChiffrer = postes.filter(p => p.verdict.verdict.code === "achiffrer").length;

  return {
    ligne: ligne,
    nom: (ligne && ligne.nom) || "Ligne sans nom",
    code: codeLigneDe(ligne && ligne.nom),
    famille: famille,
    encre: famille ? FAMILLES_LIGNE[famille].encre : "#545e68",
    rang: rangLigne(ligne && ligne.nom),
    postes: postes,
    refs: refs,
    dominante: dominante,
    cpp: chiffrees.length ? cppLigne : null,
    nonChiffrables: nonChiffrables,
    cible: cible,
    distanceCible: distance,
    decisions: decisions,
    aChiffrer: aChiffrer,
    nbEssais: postes.reduce((a, p) => a + (p.verdict.meilleur ? 1 : 0), 0),
    vide: refs.length === 0
  };
}

/* Les tuiles, dans l'ordre physique de l'atelier — pas un tri alphabétique.
   La tuile porte son rang, calculé comme le reste : une seule source. */
function tuilesDeLignes(lignes) {
  return (lignes || []).map(tuileDeLigne)
    .sort((a, b) => (a.rang - b.rang) || a.nom.localeCompare(b.nom));
}

/* Le détail d'une ligne — l'étage 2 : ses références, leurs opérations, et
   pour CHACUNE le scénario de production décomposé jusqu'au logement. Une OP
   sans scénario de production reste visible, marquée « sans production » :
   si elle disparaissait, la ligne paraîtrait complète à tort. */
function detailLigne(ligne) {
  const postes = verdictsDeLigne(ligne);
  const parRef = ((ligne && ligne.references) || []).map(ref => {
    const c = cppReference(postes, ref);
    return {
      ref: ref,
      nom: ref.nom || "Référence sans nom",
      cpp: c.cpp,
      cible: c.cible,
      distanceCible: c.distanceCible,
      nonChiffrables: c.nonChiffrables,
      postes: postes.filter(p => p.ref === ref).map(p => ({
        op: p.op,
        code: opCodeDe(p.op),
        nom: p.op && p.op.nom ? p.op.nom : "",
        prod: p.prod,
        cpp: p.verdict.cppProd,
        nonChiffrables: p.verdict.nonChiffrables,
        outillage: p.prod ? outillageDeScenario(p.prod) : null,
        nbEssaisProd: p.prod ? (p.prod.essais || []).length : 0,
        nbAutres: p.autres.length,
        verdict: p.verdict
      }))
    };
  });
  return {
    ligne: ligne,
    tuile: tuileDeLigne(ligne),
    refs: parRef,
    nbPostes: postes.length,
    nbPostesSansProd: postes.filter(p => !p.prod).length,
    nbScenariosAutres: postes.reduce((a, p) => a + p.autres.length, 0)
  };
}

/* ============================================================================
   8. LES GAINS — actés d'un côté, projetés de l'autre, jamais sommés
   ========================================================================== */

/* Le rollup d'une ligne, poste par poste. gainActe et gainProjete vivent
   dans des blocs distincts à chaque niveau (poste, ligne, atelier). Un poste
   non chiffrable est compté, il ne se dilue pas dans un total silencieux. */
function gainLigne(ligne) {
  const postes = verdictsDeLigne(ligne);
  const parPoste = [];
  let acte = 0, projete = 0, acteAnnuel = 0, projeteAnnuel = 0;
  let chiffrables = 0, nonChiffrables = 0;
  let heuresProjetees = null;
  postes.forEach(p => {
    const v = p.verdict;
    parPoste.push(v);
    if (v.cppProd === null) { nonChiffrables++; return; }
    chiffrables++;
    if (v.gainActe !== null) { acte += v.gainActe; }
    if (v.gainProjete !== null) { projete += v.gainProjete; }
    if (v.gainAnnuelActe !== null) acteAnnuel += v.gainAnnuelActe;
    if (v.gainAnnuelProjete !== null) projeteAnnuel += v.gainAnnuelProjete;
  });

  const dominante = tuileDeLigne(ligne).dominante;

  return {
    ligne: ligne,
    postes: parPoste,
    gainActe: chiffrables ? acte : null,
    gainProjete: chiffrables ? projete : null,
    gainAnnuelActe: acteAnnuel || null,
    gainAnnuelProjete: projeteAnnuel || null,
    chiffrables: chiffrables,
    nonChiffrables: nonChiffrables,
    refDominante: dominante ? dominante.ref : null,
    decisions: postes.filter(p => p.verdict.verdict.code === "pret" || p.verdict.verdict.code === "essai").length
  };
}

/* Le récapitulatif de l'atelier — le bandeau d'accueil. Chaque chiffre
   remonte à sa source ; une absence est nommée, jamais comblée. */
function recapAtelier(lignes) {
  let acte = 0, acteAnnuel = 0, projete = 0, projeteAnnuel = 0;
  let decisions = 0, aChiffrer = 0, lignesEngagees = 0;
  const tuiles = tuilesDeLignes(lignes);
  tuiles.forEach(t => {
    acte += t.postes.reduce((a, p) => a + (p.verdict.gainActe || 0), 0);
    projete += t.postes.reduce((a, p) => a + (p.verdict.gainProjete || 0), 0);
    acteAnnuel += t.postes.reduce((a, p) => a + (p.verdict.gainAnnuelActe || 0), 0);
    projeteAnnuel += t.postes.reduce((a, p) => a + (p.verdict.gainAnnuelProjete || 0), 0);
    decisions += t.decisions;
    aChiffrer += t.aChiffrer;
    if (t.postes.some(p => ["gagne", "pret", "essai"].includes(p.verdict.verdict.code))) lignesEngagees++;
  });
  return {
    tuiles: tuiles,
    gainActe: acte || null,
    gainProjete: projete || null,
    gainAnnuelActe: acteAnnuel || null,
    gainAnnuelProjete: projeteAnnuel || null,
    decisions: decisions,
    aChiffrer: aChiffrer,
    lignesEngagees: lignesEngagees,
    nbLignes: tuiles.length
  };
}

/* ============================================================================
   9. LE RÉFÉRENTIEL DES LIGNES — quatre familles, quatre couleurs (fait
      d'atelier, pas une mesure : Weisser rouge, Hessapp vert, EMAG gris, PCI bleu)
   ========================================================================== */

const FAMILLES_LIGNE = {
  weisser: { libelle: "Weisser", encre: "#E2001A", alpha: 0.07 },
  hessapp: { libelle: "Hessapp", encre: "#556b2f", alpha: 0.13 },
  emag:    { libelle: "EMAG",    encre: "#545e68", alpha: 0.08 },
  pci:     { libelle: "PCI",     encre: "#1b5ea6", alpha: 0.07 }
};
const ORDRE_FAMILLES = ["weisser", "hessapp", "emag", "pci"];

function familleDeLigne(nom) {
  const n = String(nom || "").trim().toLowerCase();
  if (n.startsWith("weisser")) return "weisser";
  if (n.startsWith("hessap")) return "hessapp";
  if (n.startsWith("emag")) return "emag";
  if (n.startsWith("pci")) return "pci";
  return "";
}

/* L'ordre physique de l'atelier. Une ligne inconnue se range APRÈS le
   référentiel, jamais devant Weisser. */
const RANG_LIGNES = [
  "weisser 1", "weisser 2", "weisser 3", "weisser 4",
  "hessapp", "emag 1", "emag 2", "emag 3", "pci 1", "pci 2", "pci 3", "pci 4"
];
function rangLigne(nom) {
  const n = String(nom || "").trim().toLowerCase();
  const i = RANG_LIGNES.indexOf(n);
  return i === -1 ? RANG_LIGNES.length : i;
}

/* Le code que Matis donne à une ligne (E1, W3, HESSAPP) — le pont avec son
   classeur. Déduit du nom, jamais stocké en double. */
function codeLigneDe(nom) {
  const n = String(nom || "").trim().toUpperCase();
  const m = /^EMAG\s*(\d+)$/.exec(n);
  if (m) return "E" + m[1];
  if (n.startsWith("HESSAP")) return "HESSAPP";
  const w = /^WEISSER\s*(\d+)$/.exec(n);
  if (w) return "W" + w[1];
  const p = /^PCI\s*(\d+)$/.exec(n);
  if (p) return "P" + p[1];
  return "";
}

/* ============================================================================
   10. LES PROJETS — étiquettes posées sur les scénarios (jamais propriétaires)
   ========================================================================== */

/* Palette cyclique partagée avec les outils de l'app 4.x : le mécanisme
   (index, modulo) est réutilisé, pas réinventé (CDC Projets v2 §0). */
const PALETTE_PROJETS = ["#3b82f6", "#14b8a6", "#a78bfa", "#f59e0b", "#22c55e", "#94a3b8", "#ec4899", "#0ea5e9"];

/* La couleur d'un projet est assignée UNE fois à sa création et stockée avec
   lui — jamais recalculée au rendu, sinon les couleurs sautent d'une session
   à l'autre (CDC Projets v2 §7). */
function couleurProjetLibre(etat) {
  const prises = {};
  ((etat && etat.projets) || []).forEach(p => { if (p && p.couleur) prises[p.couleur] = true; });
  for (let i = 0; i < PALETTE_PROJETS.length; i++) {
    if (!prises[PALETTE_PROJETS[i]]) return PALETTE_PROJETS[i];
  }
  return PALETTE_PROJETS[((etat && etat.projets) || []).length % PALETTE_PROJETS.length];
}

/* Les scénarios d'un projet : parcours des étiquettes, résolues contre
   l'arbre. Une étiquette orpheline (scénario supprimé) est signalée, pas
   silencieusement oubliée. */
function scenariosDeProjet(etat, projet) {
  const out = [], orphelins = [];
  ((projet && projet.tags) || []).forEach(tag => {
    const ligne = ((etat.lignes) || []).find(l => l.id === tag.ligneId);
    const ref = ligne ? ((ligne.references) || []).find(r => r.id === tag.referenceId) : null;
    const op = ref ? ((ref.ops) || []).find(o => o.id === tag.opId) : null;
    const sc = op ? ((op.scenarios) || []).find(s => s.id === tag.scenarioId) : null;
    if (sc) out.push({ ligne: ligne, ref: ref, op: op, sc: sc, tag: tag });
    else orphelins.push(tag);
  });
  return { lies: out, orphelins: orphelins };
}

/* Les projets qui touchent un scénario donné. */
function projetsDeScenario(etat, ligneId, referenceId, opId, scenarioId) {
  return ((etat.projets) || []).filter(pj =>
    ((pj.tags) || []).some(t => t.ligneId === ligneId && t.referenceId === referenceId
      && t.opId === opId && t.scenarioId === scenarioId));
}

/* Le résumé « 2 projets sur cet OP » (CDC Projets v2 §1.4) — un affichage,
   aucun changement de modèle. */
function projetsDeOP(etat, ligneId, referenceId, opId) {
  return ((etat.projets) || []).filter(pj =>
    ((pj.tags) || []).some(t => t.ligneId === ligneId && t.referenceId === referenceId && t.opId === opId));
}

const PROJET_STATUTS = { encours: "En cours", pause: "En pause", termine: "Terminé", abandonne: "Abandonné" };

/* Le responsable d'un projet, résolu contre la liste gérée. La suppression
   d'un responsable renvoie les projets à « aucun responsable », jamais
   l'inverse (CDC Projets v2 §2.2). */
function responsableDe(etat, projet) {
  if (!projet) return null;
  return ((etat.responsables) || []).find(r => r.id === projet.responsableId) || null;
}

/* ============================================================================
   11. LES LIVRAISONS — l'instantané figé que la hiérarchie lit
   ========================================================================== */

/* Une livraison fige les chiffres du jour : elle ne se recalcule JAMAIS
   après coup — c'est tout son intérêt (document qui ne bouge plus). */
function capturerLivraison(etat, nom, auteur) {
  const rec = recapAtelier(etat.lignes || []);
  return {
    id: uid("lv"),
    nom: nom || ("Livraison du " + dateCourte()),
    date: new Date().toISOString(),
    creePar: auteur || "",
    gainsActes: rec.gainActe,
    gainsEnCours: rec.gainProjete,
    gainAnnuelActe: rec.gainAnnuelActe,
    gainAnnuelProjete: rec.gainAnnuelProjete,
    decisions: rec.decisions,
    aChiffrer: rec.aChiffrer,
    plan: rec.tuiles.map(t => ({
      ligne: t.nom,
      code: t.code,
      cpp: t.cpp,
      cible: t.cible,
      distance: t.distanceCible,
      decisions: t.decisions,
      aChiffrer: t.aChiffrer,
      dominante: t.dominante ? t.dominante.ref.nom : null
    })),
    toolVersion: VERSION
  };
}

/* ============================================================================
   12. OUTILS DIVERS — ids, dates, clés de rapprochement
   ========================================================================== */

function uid(prefix) {
  return (prefix || "x") + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function dateCourte(d) {
  const t = d ? new Date(d) : new Date();
  if (isNaN(t.getTime())) return "";
  const pad = n => (n < 10 ? "0" : "") + n;
  return pad(t.getDate()) + "/" + pad(t.getMonth() + 1) + "/" + t.getFullYear();
}

function dateHeure(d) {
  const t = d ? new Date(d) : new Date();
  if (isNaN(t.getTime())) return "";
  const pad = n => (n < 10 ? "0" : "") + n;
  return dateCourte(t) + " " + pad(t.getHours()) + ":" + pad(t.getMinutes());
}

/* La clé de rapprochement d'un porte-outil (loi du correcteur, interdit 2) :
   `T 513 D1` et `T513 D1` sont le MÊME outil — la clé ignore espaces, tirets
   et points, en majuscules. L'affichage garde la forme de l'atelier. */
function clePorteOutil(numero) {
  return String(numero || "").toUpperCase().replace(/[\s\-.]/g, "");
}


/* ======== src/import.js ======== */
/* ============================================================================
   PROJET3 — LA MIGRATION ET LA FUSION
   Reprend un export de l'app de production (formats 5, 6, 7 ou 8 — tout ce
   qu'elle a jamais produit) et le normalise vers le format 9 de la v3.

   Contrairement au proto (une projection de 49 Ko), la v3 EST l'outil : la
   migration est SANS PERTE. Photos, plans de porte-outil, relevés Marposs et
   journal de rebut sont conservés — le rapport d'import compte et nomme tout
   ce qui entre.

   Fonctions PURES : elles ne touchent ni au DOM, ni au disque, ni au réseau.
   Elles prennent des objets désérialisés et renvoient des objets — c'est ce
   qui permet de les tester en Node sur les vrais exports du site.
   ========================================================================== */

"use strict";

const IMPORT_VERSION = "1.0";

/* ============================================================================
   1. LA NORMALISATION — formats 5 → 9, sans perte
   ========================================================================== */

/* Les racines acceptées. Formats 5/7/8 : `lignes` à la racine.
   Format 6 : les lignes sont portées par des projets — on les aplatit. */
function racinesLignes(source) {
  if (Array.isArray(source.lignes) && source.lignes.length) return source.lignes;
  if (Array.isArray(source.projets) && source.projets.length
      && Array.isArray(source.projets[0].lignes)) {
    const plat = [];
    source.projets.forEach(pj => (pj.lignes || []).forEach(l => plat.push(l)));
    return plat.length ? plat : null;
  }
  return null;
}

/* Le libellé du scénario : `name` aux formats récents, `nom` aux anciens. */
function nomScenario(sc) {
  return sc.name || sc.nom || "Scénario";
}

/* Les racines de projets acceptées (les anciens formats ont pu les stocker
   ailleurs ; le format 8 les porte à la racine). */
function racinesProjets(source) {
  if (Array.isArray(source.projets)) return source.projets;
  return [];
}

function racinesResponsables(source) {
  if (Array.isArray(source.responsables)) return source.responsables.slice();
  return [];
}

function racinesLivraisons(source) {
  return Array.isArray(source.livraisons) ? source.livraisons : [];
}

function racinesBacklog(source) {
  return Array.isArray(source.backlog) ? source.backlog : [];
}

/* La normalisation d'un état ENTIER. Renvoie { ok, etat, rapport, erreur }.
   Idempotente : normaliser deux fois vaut normaliser une fois (testé). */
function normaliserEtat(source) {
  const vide = {
    ok: false, etat: null, rapport: null,
    erreur: "Ce fichier n'est pas un export du suivi d'optimisation."
  };
  if (!source || typeof source !== "object") return vide;
  const racines = racinesLignes(source);
  if (!racines) return vide;

  const r = {
    formatSource: source.format != null ? source.format : null,
    toolVersion: source.toolVersion || source.version || null,
    exporteLe: source.exporteLe || null,
    exportePar: source.exportePar || null,
    lignes: 0, references: 0, ops: 0, scenarios: 0,
    outils: 0, logements: 0, essais: 0, prelevements: 0,
    photos: 0, marposs: 0, scrapLog: 0, plans: 0,
    projets: 0, etiquettes: 0, responsables: 0, livraisons: 0, backlog: 0,
    responsablesCreés: 0,
    scenariosCibles: 0,
    sansPrix: 0, sansAretes: 0, sansCharniere: 0,
    prelevementsSansBatt: 0,
    avertissements: []
  };

  /* Les responsables existants, indexés par id — les projets migrés peuvent
     en créer. La liste est écrite dans l'état à la fin. */
  const responsables = [];
  const respParId = {};
  racinesResponsables(source).forEach(rb => {
    const rn = normaliserResponsable(rb);
    if (!rn) return;
    if (respParId[rn.id]) return;
    respParId[rn.id] = rn;
    responsables.push(rn);
    r.responsables++;
  });

  /* La migration des anciens projets : un `responsable` en texte libre
     devient une entrée de la liste gérée (CDC Projets v2 §2.1) — chaque
     valeur distincte une fois, couleur assignée dans l'ordre de la palette,
     aucune ressaisie demandée, aucune saisie perdue. */
  function responsableDeTexte(nom, palette) {
    const nomPropre = String(nom || "").trim();
    if (!nomPropre) return "";
    const deja = responsables.find(x => x.nom.toLowerCase() === nomPropre.toLowerCase());
    if (deja) return deja.id;
    const rn = {
      id: "u" + Math.random().toString(36).slice(2, 10),
      nom: nomPropre,
      couleur: palette[responsables.length % palette.length]
    };
    responsables.push(rn);
    r.responsablesCreés++;
    return rn.id;
  }

  const lignes = racines.map((lBrut, iL) => normaliserLigne(lBrut, iL, r));
  r.lignes = lignes.length;
  if (!r.lignes) return vide;

  const projets = racinesProjets(source).map((pBrut, iP) =>
    normaliserProjet(pBrut, iP, r, responsableDeTexte)).filter(Boolean);
  r.projets = projets.length;

  /* Les projets du format 6 portaient leurs lignes : ne pas les réécrire. */
  projets.forEach(pj => { delete pj.lignes; });

  const livraisons = racinesLivraisons(source).slice();
  r.livraisons = livraisons.length;
  const backlog = racinesBacklog(source).slice();
  r.backlog = backlog.length;

  const etat = {
    outil: "SPK Suivi optimisation",
    format: 9,
    toolVersion: source.toolVersion || null,
    revision: source.revision != null ? source.revision : 1,
    exporteLe: null,
    exportePar: "",
    lignes: lignes,
    projets: projets,
    responsables: responsables,
    livraisons: livraisons,
    backlog: backlog,
    activeProjetId: source.activeProjetId || "",
    activeLigneId: source.activeLigneId || (lignes[0] ? lignes[0].id : ""),
    activeReferenceId: source.activeReferenceId || "",
    activeOpId: source.activeOpId || "",
    activeScenarioId: source.activeScenarioId || "",
    modifieLe: source.modifieLe || null
  };

  /* Les avertissements disent ce qui manquera à l'écran — jamais en silence. */
  if (!r.essais) {
    r.avertissements.push("Aucun essai dans cet export : les écrans de preuve et de décision resteront vides.");
  }
  if (!r.scenariosCibles) {
    r.avertissements.push("Aucune cible CPP de site : les distances vers la cible ne pourront pas s'afficher.");
  }
  if (r.sansPrix || r.sansAretes || r.sansCharniere) {
    r.avertissements.push(
      (r.sansPrix + r.sansAretes + r.sansCharniere)
      + " logement(s) incomplet(s) sur le trio prix / arêtes / charnière : ils resteront non chiffrables, et c'est dit à l'écran.");
  }
  if (r.prelevementsSansBatt) {
    r.avertissements.push(
      r.prelevementsSansBatt + " prélèvement(s) sans battement ni côté D/G : ils ne montreront aucune conformité.");
  }
  if (r.responsablesCreés) {
    r.avertissements.push(
      r.responsablesCreés + " responsable(s) créé(s) depuis les anciens champs texte : couleurs assignées automatiquement.");
  }

  return { ok: true, etat: etat, rapport: r, erreur: null };
}

/* ---- ligne ---- */
function normaliserLigne(lBrut, iL, r) {
  const ligne = {
    id: lBrut.id || ("li" + (iL + 1) + "-" + Math.random().toString(36).slice(2, 6)),
    nom: lBrut.nom || "Ligne sans nom",
    coutHoraire: lBrut.coutHoraire != null ? lBrut.coutHoraire : "",
    observations: lBrut.observations || "",
    maintenanceDate: lBrut.maintenanceDate || "",
    maintenanceType: lBrut.maintenanceType || "",
    references: (lBrut.references || []).map((refBrut, iR) => normaliserReference(refBrut, iR, r))
  };
  return ligne;
}

function normaliserReference(refBrut, iR, r) {
  r.references++;
  const cible = (refBrut.cibleCPP === "" || refBrut.cibleCPP == null) ? "" : refBrut.cibleCPP;
  if (parseFloat(cible) > 0) r.scenariosCibles++;
  return {
    id: refBrut.id || ("re" + (iR + 1) + "-" + Math.random().toString(36).slice(2, 6)),
    nom: refBrut.nom || "Référence sans nom",
    cibleCPP: cible,
    productionAnnuelle: refBrut.productionAnnuelle != null ? refBrut.productionAnnuelle : "",
    volumeHistorique: Array.isArray(refBrut.volumeHistorique) ? refBrut.volumeHistorique.slice(0, 10) : [],
    ops: (refBrut.ops || []).map((opBrut, iO) => normaliserOp(opBrut, iO, r))
  };
}

function normaliserOp(opBrut, iO, r) {
  r.ops++;
  const code = opBrut.code && opBrut.code !== "?" ? opBrut.code : codeDeOp(opBrut);
  return {
    id: opBrut.id || ("op" + (iO + 1) + "-" + Math.random().toString(36).slice(2, 6)),
    nom: opBrut.nom || code,
    ordre: opBrut.ordre != null ? opBrut.ordre : null,
    opCode: code,
    ficheOutil: opBrut.ficheOutil || null,
    config: opBrut.config && typeof opBrut.config === "object" ? Object.assign({}, opBrut.config) : {},
    scenarios: (opBrut.scenarios || []).map((scBrut, iS) => normaliserScenario(scBrut, iS, r))
  };
}

function normaliserScenario(scBrut, iS, r) {
  r.scenarios++;
  const sc = {
    id: scBrut.id || ("sc" + (iS + 1) + "-" + Math.random().toString(36).slice(2, 6)),
    name: nomScenario(scBrut),
    cycle: scBrut.cycle != null ? scBrut.cycle : 100,
    baseline: scBrut.baseline === true,
    statut: scBrut.statut || "essai",
    statutMotif: scBrut.statutMotif || "",
    statutDate: scBrut.statutDate || "",
    emag1: scBrut.emag1 === true,
    battCotes: scBrut.battCotes || "DG",
    limitOverride: scBrut.limitOverride === true,
    limitLabel: scBrut.limitLabel || "Battement (mm)",
    limitValue: scBrut.limitValue != null ? scBrut.limitValue : "",
    limitLabel2: scBrut.limitLabel2 || "Ra (µm)",
    limitValue2: scBrut.limitValue2 != null ? scBrut.limitValue2 : "",
    critere2Actif: scBrut.critere2Actif === true,
    criteresSup: Array.isArray(scBrut.criteresSup) ? scBrut.criteresSup.slice() : [],
    validationThreshold: scBrut.validationThreshold != null ? scBrut.validationThreshold : 5,
    battActif: scBrut.battActif !== false,
    tauxRebutAnnuel: scBrut.tauxRebutAnnuel != null ? scBrut.tauxRebutAnnuel : "",
    marpossRapport: scBrut.marpossRapport || "",
    tendanceRapport: scBrut.tendanceRapport || "",
    notes: scBrut.notes || "",
    outils: (scBrut.outils || []).map(oBrut => normaliserOutil(oBrut, r)),
    essais: (scBrut.essais || []).map(eBrut => normaliserEssai(eBrut, r)),
    scrapLog: Array.isArray(scBrut.scrapLog) ? scBrut.scrapLog.slice() : []
  };
  r.scrapLog += sc.scrapLog.length;
  /* La cohérence du scénario de production : le ★ est en série, verrouillé
     (v4.4 de l'app). Une exportation ancienne peut n'avoir qu'un des deux. */
  if (sc.baseline) sc.statut = "serie";
  if (sc.statut === "serie") sc.baseline = true;
  return sc;
}

function normaliserOutil(oBrut, r) {
  r.outils++;
  if (oBrut.plan) r.plans++;
  return {
    id: oBrut.id || ("t" + Math.random().toString(36).slice(2, 8)),
    numero: oBrut.numero || "",
    correcteur: oBrut.correcteur || "",
    description: oBrut.description || "",
    plan: oBrut.plan || null,
    pieces: Array.isArray(oBrut.pieces) ? oBrut.pieces.slice() : [],
    logements: (oBrut.logements || []).map(lBrut => normaliserLogement(lBrut, r))
  };
}

function normaliserLogement(lBrut, r) {
  r.logements++;
  const trio = {
    prix: parseFloat(lBrut.prix) > 0,
    aretes: parseFloat(lBrut.aretes) > 0,
    charniere: parseFloat(lBrut.charniere) > 0
  };
  if (!trio.prix) r.sansPrix++;
  if (!trio.aretes) r.sansAretes++;
  if (!trio.charniere) r.sansCharniere++;
  return {
    id: lBrut.id || ("g" + Math.random().toString(36).slice(2, 8)),
    nom: lBrut.nom || "Logement",
    ref: lBrut.ref || "",
    codeArticle: lBrut.codeArticle || "",
    mabec: lBrut.mabec || "",
    prix: lBrut.prix != null ? lBrut.prix : "",
    aretes: lBrut.aretes != null ? lBrut.aretes : "",
    charniere: lBrut.charniere != null ? lBrut.charniere : "",
    vc: lBrut.vc != null ? lBrut.vc : "",
    f: lBrut.f != null ? lBrut.f : "",
    kappaR: lBrut.kappaR != null ? lBrut.kappaR : "",
    rayonBec: lBrut.rayonBec != null ? lBrut.rayonBec : "",
    apPiste: lBrut.apPiste != null ? lBrut.apPiste : "",
    tempsCoupe: lBrut.tempsCoupe != null ? lBrut.tempsCoupe : "",

function normaliserProjet(pBrut, iP, r, responsableDeTexte) {

function normaliserResponsable(rb) {

/* Le code court d'une OP, dérivé — jamais une donnée saisie écrasée. */
function codeDeOp(op) {
  if (op.opCode && op.opCode !== "?") return op.opCode;
  if (op.ordre != null && !isNaN(parseFloat(op.ordre))) return "OP" + parseFloat(op.ordre);
  const m = /OP\s*0*(\d+)/i.exec(op.nom || "");
  return m ? "OP" + parseInt(m[1], 10) : "OP?";
}

/* ============================================================================
   2. LA FUSION — deux postes travaillent, aucun chiffre n'est perdu
   ========================================================================== */

/* La fusion arbitre essai par essai sur `modifieLe` (le rituel connu :
   « Fusionner plutôt que Remplacer » dès que deux personnes ont saisi chacune
   de leur côté). Les réglages restent LOCAUX (décision actée).
   Renvoie { etat, rapport }. */
function fusionnerEtat(local, arrivee) {
  const r = {
    essaisAjoutes: 0, essaisGagnesArrivee: 0, essaisGardesLocaux: 0,
    scenariosAjoutes: 0, projetsFusionnes: 0, projetsAjoutes: 0,
    etiquettesAjoutees: 0, responsablesAjoutes: 0, lignesAjoutees: 0,
    conflits: []
  };
  if (!local || !local.lignes) return { etat: arrivee, rapport: r };
  if (!arrivee || !arrivee.lignes) return { etat: local, rapport: r };

  /* Les lignes/réfs/OPs/scénarios qui n'existent que dans l'arrivée passent
     tels quels — un scénario créé de l'autre côté ne doit pas disparaître. */
  const index = indexerArbre(local);
  (arrivee.lignes || []).forEach(lA => {
    if (!index.lignes[lA.id]) {
      local.lignes.push(cloner(lA));
      r.lignesAjoutees++;
      return;
    }
    const lL = index.lignes[lA.id];
    (lA.references || []).forEach(refA => {
      const refL = lL.references.find(x => x.id === refA.id);
      if (!refL) { lL.references.push(cloner(refA)); return; }
      (refA.ops || []).forEach(opA => {
        const opL = refL.ops.find(x => x.id === opA.id);
        if (!opL) { refL.ops.push(cloner(opA)); return; }
        (opA.scenarios || []).forEach(scA => {
          const scL = opL.scenarios.find(x => x.id === scA.id);
          if (!scL) { opL.scenarios.push(cloner(scA)); r.scenariosAjoutes++; return; }
          fusionnerScenario(scL, scA, r);
        });
      });
    });
  });

  /* Les projets : ajoutés si nouveaux, fusionnés (union des étiquettes) sinon. */
  (arrivee.projets || []).forEach(pjA => {
    const pjL = (local.projets || []).find(x => x.id === pjA.id);
    if (!pjL) {
      (local.projets = local.projets || []).push(cloner(pjA));
      r.projetsAjoutes++;
      return;
    }
    r.projetsFusionnes++;
    const vu = {};
    (pjL.tags || []).forEach(t => { vu[t.ligneId + "|" + t.referenceId + "|" + t.opId + "|" + t.scenarioId] = true; });
    (pjA.tags || []).forEach(t => {
      const cle = t.ligneId + "|" + t.referenceId + "|" + t.opId + "|" + t.scenarioId;
      if (!vu[cle]) { (pjL.tags = pjL.tags || []).push(cloner(t)); r.etiquettesAjoutees++; }
    });
  });

  /* Les responsables : union par id. */
  (arrivee.responsables || []).forEach(uA => {
    if (!(local.responsables || []).some(x => x.id === uA.id)) {
      (local.responsables = local.responsables || []).push(cloner(uA));
      r.responsablesAjoutes++;
    }
  });

  /* Les livraisons et le backlog : union par id — un document figé ne se
     perd jamais dans une fusion. */
  (arrivee.livraisons || []).forEach(lv => {
    if (!(local.livraisons || []).some(x => x.id === lv.id)) (local.livraisons = local.livraisons || []).push(cloner(lv));
  });
  (arrivee.backlog || []).forEach(bk => {
    if (!(local.backlog || []).some(x => x.id === bk.id)) (local.backlog = local.backlog || []).push(cloner(bk));
  });

  return { etat: local, rapport: r };
}

function fusionnerScenario(scL, scA, r) {
  /* Les essais, arbitrage modifieLe : le plus récent gagne, à égalité le
     local garde (ne rien casser localement). */
  const essaisL = scL.essais || (scL.essais = []);
  (scA.essais || []).forEach(eA => {
    const eL = essaisL.find(x => x.id === eA.id);
    if (!eL) {
      essaisL.push(cloner(eA));
      r.essaisAjoutes++;
      return;
    }
    const tL = new Date(eL.modifieLe || 0).getTime() || 0;
    const tA = new Date(eA.modifieLe || 0).getTime() || 0;
    if (tA > tL) {
      Object.keys(eA).forEach(k => { eL[k] = cloner(eA[k]); });
      eL.modifieLe = eA.modifieLe;
      r.essaisGagnesArrivee++;
    } else if (tA < tL) {
      r.essaisGardesLocaux++;
    } else {
      r.essaisGardesLocaux++;
      if (JSON.stringify(eL) !== JSON.stringify(eA)) {
        r.conflits.push(scL.name + " · " + (eL.titre || "essai") + " : deux versions sans horodatage — la locale est gardée");
      }
    }
  });
  /* Les champs de structure d'un scénario arrivé plus récent (outils,
     limites) : on ne les écrase pas — la fusion d'outils par id est le
     chantier suivant ; ici, personne ne perd d'essai. */
}

function indexerArbre(etat) {
  const lignes = {};
  (etat.lignes || []).forEach(l => { lignes[l.id] = l; });
  return { lignes: lignes };
}

function cloner(x) {
  return x === undefined ? undefined : JSON.parse(JSON.stringify(x));
}

/* ============================================================================
   3. LE POIDS — mesuré, pas estimé
   ========================================================================== */

function poids(jsonSource, etat) {
  let avant = 0, apres = 0;
  try { avant = JSON.stringify(jsonSource).length; } catch (e) { avant = 0; }
  try { apres = JSON.stringify(etat).length; } catch (e) { apres = 0; }
  return {
    avant: avant,
    apres: apres,
    ratio: avant ? Math.round((apres / avant) * 1000) / 1000 : null
  };
}

/* ======== src/ui.js ======== */
/* ============================================================================
   PROJET3 — LES COMPOSANTS
   Des briques DOM réutilisées partout : un badge n'a qu'une forme, un panneau
   n'a qu'un squelette. Le rendu lit le noyau, il ne calcule rien (cahier §5.1).
   ========================================================================== */

"use strict";

/* Le créateur d'éléments : h("div", {class: "x", onclick: fn}, enfant, …). */
function h(tag, attrs) {
  const el = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(k => {
    const v = attrs[k];
    if (v === null || v === undefined || v === false) return;
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;      // uniquement du texte contrôlé par nous
    else if (k === "style" && typeof v === "object") Object.assign(el.style, v);
    else if (k.slice(0, 2) === "on" && typeof v === "function") el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = !!v;
    else if (k === "selected") el.selected = !!v;
    else if (k === "disabled") el.disabled = !!v;
    else el.setAttribute(k, v === true ? "" : String(v));
  });
  for (let i = 2; i < arguments.length; i++) {
    const c = arguments[i];
    if (c === null || c === undefined || c === false) continue;
    if (Array.isArray(c)) c.forEach(x => { if (x !== null && x !== undefined && x !== false) el.appendChild(x); });
    else if (typeof c === "object" && c.nodeType) el.appendChild(c);
    else el.appendChild(document.createTextNode(String(c)));
  }
  return el;
}

/* UNE forme de badge : seule la couleur change (CDC UX §3.4). */
function badge(classe, texte, opts) {
  const o = opts || {};
  return h("span", { class: "badge " + (classe || ""), title: o.title || null }, texte);
}

/* L'état en toutes lettres — jamais la couleur seule (constitution §5.2).
   Les codes sont en ASCII, les libellés en français. */
const ETATS_POSTE = {
  gagne:     { badge: "vert",  mot: "gagné" },
  pret:      { badge: "ambre", mot: "décider" },
  essai:     { badge: "bleu",  mot: "essai en cours" },
  achiffrer: { badge: "ambre", mot: "à chiffrer" },
  vide:      { badge: "gris",  mot: "jamais travaillée" },
  rien:      { badge: "gris",  mot: "au meilleur connu" }
};
function badgeEtat(codeVerdict) {
  const e = ETATS_POSTE[codeVerdict] || ETATS_POSTE.rien;
  return badge(e.badge, e.mot);
}

function badgeEtoile() { return badge("etoile", "★ en production"); }

const STATUTS_SCENARIO = {
  serie: { badge: "vert", mot: "En série" },
  valide: { badge: "ambre", mot: "Validé" },
  essai: { badge: "bleu", mot: "En essai" },
  etude: { badge: "gris", mot: "À l'étude" },
  abandonne: { badge: "contour", mot: "Abandonné" }
};
function badgeStatutScenario(sc) {
  const s = STATUTS_SCENARIO[sc && sc.statut] || STATUTS_SCENARIO.essai;
  return badge(s.badge, s.mot);
}

/* Le chiffre clé et son unité. */
function chiffre(valeur, unite, opts) {
  const o = opts || {};
  return h("div", { class: "celle" + (o.class ? " " + o.class : "") },
    h("div", { class: "etiquette" }, o.etiquette || ""),
    h("div", { class: "valeur mono" + (o.grand ? " grand" : "") + (o.couleur ? " " + o.couleur : "") },
      valeur,
      unite ? h("span", { class: "unite" }, unite) : null),
    o.contexte ? h("div", { class: "contexte" }, o.contexte) : null);
}

/* La barre de ralliement vers la cible. */
function barreCible(pct) {
  const p = Math.max(0, Math.min(100, pct || 0));
  return h("div", { class: "barre-cible", title: "ralliement de la cible : " + Math.round(p) + " %" },
    h("div", { class: "remplissage", style: { width: p + "%" } }));
}

/* ============================================================================
   LES PANNEAUX — un tiroir, un seul à la fois
   ========================================================================== */

let voileActif = null;

function ouvrirPanneau(titre, sous, contenu, opts) {
  const o = opts || {};
  fermerPanneau();
  const panneau = h("div", { class: "panneau" + (o.large ? " large" : "") });
  const boutonFermer = h("button", { class: "bouton petit p-fermer", onclick: fermerPanneau, "aria-label": "Fermer" }, "Fermer");
  panneau.appendChild(h("div", { class: "p-entete" },
    h("div", { class: "p-titre" }, titre), boutonFermer));
  if (sous) panneau.appendChild(h("div", { class: "p-sous" }, sous));
  if (Array.isArray(contenu)) contenu.forEach(c => c && panneau.appendChild(c));
  else if (contenu) panneau.appendChild(contenu);
  voileActif = h("div", {
    class: "voile",
    onclick: (e) => { if (e.target === voileActif) fermerPanneau(); }
  }, panneau);
  document.body.appendChild(voileActif);
  return panneau;
}

function fermerPanneau() {
  if (voileActif) { voileActif.remove(); voileActif = null; }
}

/* Le menu groupé : Consulter / Documenter / Gérer / zone rouge en dernier. */
function ouvrirMenu(items) {
  const familles = {};
  items.forEach(it => { (familles[it.famille] = familles[it.famille] || []).push(it); });
  const ordre = ["Consulter", "Documenter", "Gérer"];
  const contenu = h("div", {});
  ordre.forEach(f => {
    if (!familles[f]) return;
    const bloc = h("div", { class: "menu-famille" }, h("div", { class: "titre-famille" }, f));
    familles[f].forEach(it => bloc.appendChild(h("button", {
      class: "item", onclick: () => { fermerPanneau(); it.action(); }
    }, it.libelle)));
    contenu.appendChild(bloc);
  });
  if (familles["Zone rouge"]) {
    const bloc = h("div", { class: "menu-famille zone-rouge" },
      h("div", { class: "titre-famille" }, "Zone rouge — chaque clic est réfléchi"));
    familles["Zone rouge"].forEach(it => bloc.appendChild(h("button", {
      class: "item rouge", onclick: () => { fermerPanneau(); it.action(); }
    }, it.libelle)));
    contenu.appendChild(h("div", { class: "separateur" }));
    contenu.appendChild(bloc);
  }
  ouvrirPanneau("Actions", "", contenu, {});
}

/* Le toast : un mot, quelques secondes, jamais un blocage. */
let toastActif = null, toastTimer = null;
function toast(message) {
  if (toastActif) toastActif.remove();
  if (toastTimer) clearTimeout(toastTimer);
  toastActif = h("div", { class: "toast" }, message);
  document.body.appendChild(toastActif);
  toastTimer = setTimeout(() => { if (toastActif) { toastActif.remove(); toastActif = null; } }, 3200);
}

/* Une confirmation honnête : elle dit ce qui va arriver, et exige un mot. */
function confirmer(question, libelleAction, action, opts) {
  const o = opts || {};
  ouvrirPanneau("Confirmer", "", [
    h("p", {}, question),
    h("div", { class: "liste-actions" },
      h("button", { class: "bouton", onclick: fermerPanneau }, "Annuler"),
      h("button", {
        class: "bouton " + (o.danger ? "danger" : "primaire"),
        onclick: () => { fermerPanneau(); action(); }
      }, libelleAction))
  ]);
}

/* Le champ de formulaire standard. */
function champ(etiquette, type, valeur, attrs, aide) {
  const a = attrs || {};
  const el = h("input", Object.assign({ type: type, value: valeur === null || valeur === undefined ? "" : valeur }, a));
  return h("label", { class: "champ" },
    h("span", { class: "etiquette" }, etiquette),
    el,
    aide ? h("span", { class: "aide" }, aide) : null);
}
function champSelect(etiquette, options, valeur, attrs, aide) {
  const sel = h("select", attrs || {});
  (options || []).forEach(o => sel.appendChild(h("option", { value: o.value, selected: String(o.value) === String(valeur) }, o.libelle)));
  return h("label", { class: "champ" },
    h("span", { class: "etiquette" }, etiquette),
    sel,
    aide ? h("span", { class: "aide" }, aide) : null);
}

/* Les pastilles de projet (couleur de projet assignée à la création). */
function pastilleProjet(pj, active) {
  return h("button", {
    class: "etiquette-pj" + (active ? "" : " off"),
    style: active ? { "--couleur-pj": pj.couleur || "#545e68" } : {},
    title: (active ? "projet actif — cliquer pour le retirer du filtre" : "cliquer pour filtrer sur ce projet"),
    onclick: () => basculerFiltreProjet(pj.id)
  }, pj.nom);
}

/* Un « — » n'existe pas : l'absence dit ce qui manque (cahier §5.2). */
function absence(raison) {
  return h("span", { class: "absence", style: { color: "var(--label)", fontStyle: "italic" } }, raison);
}


/* ======== src/app.js ======== */
/* ============================================================================
   PROJET3 — L'APPLICATION
   L'atelier d'abord : accueil (tuiles) → ligne → poste → optimisation →
   emporter. Les informations arrivent en douceur : le gros chiffre d'abord,
   la fiche derrière un geste. Le rendu lit le noyau, il ne calcule rien.
   ========================================================================== */

"use strict";

/* ============================================================================
   1. L'ÉTAT GLOBAL ET LA PERSISTANCE
   ========================================================================== */

const STORAGE_KEY = "spk_projet3_v1";
const SECOURS_KEY = "spk_projet3_secours";
const THEME_KEY = "spk_projet3_theme";
const MAX_SECOURS = 5;

/* Toute globale est déclarée AVANT le premier usage — le piège TDZ de
   l'ancienne app (repli silencieux sur l'exemple, zéro message) ne doit pas
   se reproduire ici. */
let ETAT = null;         // les données
let VUE = {              // où on en est
  ecran: "accueil",      // accueil | ligne | poste | emporter | projets
  ligneId: "", refId: "", opId: "", scId: "",
  filtreProjetId: ""
};
let SOURCE_IMPORT = null;   // la dernière source affichée (d'où viennent les chiffres)

/* Le chargement : le local d'abord, l'exemple ensuite, et le message dit
   lequel des deux on lit. */
function chargerEtatInitial() {
  try {
    const brut = localStorage.getItem(STORAGE_KEY);
    if (brut) {
      const mig = normaliserEtat(JSON.parse(brut));
      if (mig.ok) {
        ETAT = mig.etat;
        SOURCE_IMPORT = "suivi local de ce poste";
        return;
      }
    }
  } catch (e) { /* le local abîmé ne bloque pas l'outil : on repart propre */ }
  ETAT = etatExemple();
  SOURCE_IMPORT = "jeu d'exemple — aucun chiffre réel";
  toast("Jeu d'exemple chargé — importez vos données quand vous voulez (bouton Données).");
}

let saveTimer = null;
function saveData() {
  if (!ETAT) return;
  ETAT.modifieLe = new Date().toISOString();
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(ETAT)); }
    catch (e) {
      toast("Sauvegarde locale impossible (stockage plein) — exportez vos données maintenant.");
    }
  }, 250);
}

/* Les instantanés de secours : avant toute action risquée, l'état courant
   part au fond du tiroir. Cinq places, le plus récent en tête. */
function pousserSecours() {
  try {
    const pile = JSON.parse(localStorage.getItem(SECOURS_KEY) || "[]");
    pile.unshift({ date: new Date().toISOString(), etat: ETAT });
    while (pile.length > MAX_SECOURS) pile.pop();
    localStorage.setItem(SECOURS_KEY, JSON.stringify(pile));
  } catch (e) { /* un secours manqué vaut mieux qu'un outil bloqué */ }
}

function lireSecours() {
  try { return JSON.parse(localStorage.getItem(SECOURS_KEY) || "[]"); }
  catch (e) { return []; }
}

/* ============================================================================
   2. LA NAVIGATION ET LE FIL
   ========================================================================== */

function aller(ecran, ids) {
  VUE.ecran = ecran;
  if (ids) ["ligneId", "refId", "opId", "scId"].forEach(k => {
    if (k in ids) VUE[k] = ids[k];
  });
  window.scrollTo(0, 0);
  render();
}

function ligneActive() {
  return (ETAT.lignes || []).find(l => l.id === VUE.ligneId) || null;
}
function referenceActive(ligne) {
  const l = ligne || ligneActive();
  if (!l) return null;
  return (l.references || []).find(r => r.id === VUE.refId) || null;
}
function opActive(ref) {
  const r = ref || referenceActive();
  if (!r) return null;
  return (r.ops || []).find(o => o.id === VUE.opId) || null;
}
function scenarioActif(op) {
  const o = op || opActive();
  if (!o) return null;
  return (o.scenarios || []).find(s => s.id === VUE.scId) || null;
}

/* Le fil : une seule ligne, le maillon actif plus fort (CDC UX §3.1). */
function filDOM(maillons) {
  const el = h("nav", { class: "fil" });
  maillons.forEach((m, i) => {
    if (i) el.appendChild(h("span", { class: "sep" }, "›"));
    if (m.action) el.appendChild(h("a", { onclick: m.action, href: "javascript:void(0)" }, m.libelle));
    else el.appendChild(h("span", { class: "maillon-actif" }, m.libelle));
  });
  return el;
}

function basculerFiltreProjet(id) {
  VUE.filtreProjetId = (VUE.filtreProjetId === id) ? "" : id;
  render();
}

/* ============================================================================
   3. LA PROCHAINE ÉTAPE, EN TOUTES LETTRES
   ========================================================================== */

function prochaineEtape(v) {
  if (!v || !v.verdict) return "";
  const code = v.verdict.code;
  if (code === "vide") return "Poser ce qui tourne réellement : le scénario de production, puis le trio prix / arêtes / charnière.";
  if (code === "achiffrer") {
    if (!v.prod) return "Poser le scénario de production — aucun scénario en prod sur ce poste.";
    return "Renseigner le trio prix / arêtes / charnière des logements — le poste est non chiffrable.";
  }
  if (code === "gagne") return "Le gain est acté : le scénario passe en production.";
  if (code === "pret") return "Passer le scénario validé " + (v.verdict.validations || 5) + "× en série — ou dire non, avec la raison.";
  if (code === "essai") {
    const s = v.meilleur && v.meilleur.sc;
    if (!s) return "";
    const conformes = (s.essais || []).filter(e => statutEssai(s, e).code === "conforme").length;
    const seuil = s.validationThreshold || 5;
    return "Poursuivre le protocole 5× — " + conformes + "/" + seuil + " essais conformes sur « " + s.name + " ».";
  }
  return "Au meilleur connu : aucun essai ne fait mieux que la prod — surveiller l'usure, rien à décider.";
}

/* ============================================================================
   4. LA BARRE DU HAUT ET LE PIED
   ========================================================================== */

function topbarDOM() {
  return h("div", { class: "topbar" },
    h("div", { class: "marque", title: APP_NOM + " — génération 3" },

      }, h("span", { class: "texte-long" }, "Emporter la page")),

      h("button", {

        onclick: basculerTheme, title: "Jour / nuit"
      }, document.documentElement.getAttribute("data-theme") === "nuit" ? "☀" : "☾"))
  );
}

function basculerTheme() {
  const actuel = document.documentElement.getAttribute("data-theme") === "nuit" ? "nuit" : "jour";
  const suivant = actuel === "nuit" ? "jour" : "nuit";

function ouvrirMenuActions() {
  ouvrirMenu([
    { famille: "Consulter", libelle: "Projets", action: () => aller("projets") },

          "Recharger l'exemple", () => {
            pousserSecours();
            ETAT = etatExemple();
            SOURCE_IMPORT = "jeu d'exemple — aucun chiffre réel";
            saveData(); fermerPanneau(); render();
          });
      } },
    { famille: "Zone rouge", libelle: "Restaurer un instantané de secours", action: ouvrirSecours },
    { famille: "Zone rouge", libelle: "Réinitialiser (état vierge, topologie seule)", action: () => {
        confirmer("Tout l'état courant (données, projets, livraisons) sera remplacé par un état vierge. Un instantané de secours est pris avant — c'est le seul chemin arrière.",
          "Réinitialiser", () => {
            pousserSecours();
            ETAT = etatVierge();
            SOURCE_IMPORT = "état vierge";
            saveData(); fermerPanneau(); aller("accueil");
          }, { danger: true });
      } }

function piedDOM() {
  return h("div", { class: "pied" },

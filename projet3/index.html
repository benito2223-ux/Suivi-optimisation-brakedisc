/* ============================================================================
   5. L'ÉCRAN ACCUEIL — les tuiles, le bandeau, la matrice
   ========================================================================== */

function renderAccueil() {
  const rec = recapAtelier(ETAT.lignes || []);
  const projets = (ETAT.projets || []);
  const filtreActif = VUE.filtreProjetId ? projets.find(p => p.id === VUE.filtreProjetId) : null;

  const page = h("div", { class: "page" });
  page.appendChild(h("div", { class: "page-titre" },
    h("h1", {}, "L'atelier"),
    filtreActif ? h("span", { class: "peri" }, "filtré : " + filtreActif.nom) : null));
  page.appendChild(h("p", { class: "sous-titre" },
    "Une tuile par ligne. La couleur ET le mot disent l'état — on ne lit jamais une couleur seule."));

  /* Le bandeau : chaque chiffre remonte à sa source ; une absence est nommée
     avec SA raison — le volume manquant et l'absence de gain acté sont deux
     absences différentes, elles ne portent pas le même message. */
  page.appendChild(h("div", { class: "bandeau" },
    h("div", { class: "bloc acte" },
      h("div", { class: "etiquette" }, "Économie actée"),
      h("div", { class: "valeur" }, rec.gainAnnuelActe !== null ? fmt(rec.gainAnnuelActe, 0) : "—", h("span", { class: "unite" }, "€/an")),
      h("div", { class: "contexte" },
        rec.gainAnnuelActe !== null
          ? "gains d'outillage passés en série, volumes annuels saisis"
          : (rec.gainActe !== null && rec.gainActe > 0
            ? "des gains sont actés mais aucun volume annuel n'est saisi : le €/an ne s'invente pas"
            : "aucun gain passé en série pour l'instant — les essais d'abord"))),
    h("div", { class: "bloc" },
      h("div", { class: "etiquette" }, "Gains en cours"),
      h("div", { class: "valeur" }, rec.gainProjete !== null ? fmt(rec.gainProjete, 4) : "—", h("span", { class: "unite" }, "€/pièce")),
      h("div", { class: "contexte" }, "validés ou prometteurs, pas encore en série — jamais sommés aux actés")),
    h("div", { class: "bloc" },
      h("div", { class: "etiquette" }, "Décisions en attente"),
      h("div", { class: "valeur" }, String(rec.decisions)),
      h("div", { class: "contexte" }, "validés 5× à confirmer + essais prometteurs à suivre")),
    h("div", { class: "bloc" },
      h("div", { class: "etiquette" }, "À chiffrer"),
      h("div", { class: "valeur" }, String(rec.aChiffrer)),
      h("div", { class: "contexte" }, "postes dont le trio prix / arêtes / charnière n'est pas complet")),
    h("div", { class: "bloc" },
      h("div", { class: "etiquette" }, "Lignes engagées"),
      h("div", { class: "valeur" }, rec.lignesEngagees + "/" + rec.nbLignes),
      h("div", { class: "contexte" }, "au moins un poste travaillé"))
  ));

  /* Les projets posés sur l'atelier (filtre + pastilles). */
  if (projets.length) {
    page.appendChild(h("div", { class: "liste-actions" },
      h("span", { class: "etiquette", style: { color: "var(--label)", fontSize: "12px", fontFamily: "var(--font-disp)", fontWeight: "700" } }, "Projets :"),
      projets.map(pj => pastilleProjet(pj, VUE.filtreProjetId === pj.id)),
      filtreActif ? h("button", { class: "bouton petit", onclick: () => basculerFiltreProjet("") }, "Tout montrer") : null));
  }

  /* Les tuiles, dans l'ordre physique de l'atelier. */
  const tuiles = rec.tuiles.filter(t => {
    if (!filtreActif) return true;
    return t.postes.some(p => projetsDeOP(ETAT, t.ligne.id,
      (p.ref || {}).id, (p.op || {}).id).some(x => x.id === filtreActif.id));
  });
  if (!tuiles.length) {
    page.appendChild(h("div", { class: "aucun" },
      h("span", { class: "grand" }, "Aucun poste de ce projet sur cette vue"),
      "Le projet regroupe des scénarios d'autres lignes — retirez le filtre pour tout voir."));
  } else {
    page.appendChild(h("div", { class: "grille-tuiles" }, tuiles.map(tuileDOM)));
  }

  /* Ce qui n'est pas ici, dit haut et clair (le proto a posé cette règle). */
  page.appendChild(h("div", { class: "note" },
    h("span", { class: "note-titre" }, "Pourquoi la production hebdomadaire n'est pas ici ?"),
    "Elle se détaille par lot de lignes, pas par poste d'outillage — et aucune cadence n'est mesurée par ligne. L'outil ne l'estime pas."));

  /* La matrice : toutes les lignes, tous les postes — l'écran de la hiérarchie. */
  page.appendChild(h("div", { class: "page-titre", style: { marginTop: "26px" } }, h("h2", { style: { fontSize: "17px" } }, "Tous les postes")));
  page.appendChild(matricePostesDOM(tuiles));

  return page;
}

/* LA TUILE — ce qu'un chef d'atelier lit en passant. */
function tuileDOM(t) {
  const dom = h("div", { class: "tuile", style: { "--tuile-encre": t.encre }, onclick: () => aller("ligne", { ligneId: t.ligne.id }) });
  dom.appendChild(h("div", { class: "t-ete" }));
  const corps = h("div", { class: "t-corps" });
  corps.appendChild(h("div", { class: "t-entete" },
    h("span", { class: "t-nom" }, t.nom),
    h("span", { class: "t-code" }, t.code || "")));
  corps.appendChild(h("div", { class: "t-chiffre" },
    h("span", { class: "t-cpp mono" }, t.cpp !== null ? fmt(t.cpp, 4) : "—"),
    h("span", { class: "t-cpp-unite" }, "€ outillage / pièce"),
    h("span", { class: "droite" })));
  if (t.cpp === null) {
    if (t.postes.length) {
      corps.appendChild(h("div", { class: "t-ecart manque" },
        "— " + t.nonChiffrables + " poste(s) non chiffré(s) : le trio prix / arêtes / charnière est incomplet"));
    }
  } else if (t.distanceCible !== null && t.dominante) {
    const sur = t.distanceCible > 0;
    corps.appendChild(h("div", {
      class: "t-ecart " + (sur ? "sur" : "sous"),
      title: "écart à la cible du site"
    },
      sur ? "+" : "", fmt(Math.abs(t.distanceCible), 4), " €/pièce ",
      sur ? "au-dessus de la cible " : "sous la cible de ",
      t.dominante.cible !== null ? fmt(t.dominante.cible, 4) : "(— cible non saisie)"));
  } else {
    corps.appendChild(h("div", { class: "t-ecart manque" }, "— cible du site non saisie : pas d'écart affiché"));
  }
  if (t.dominante) {
    corps.appendChild(h("div", { class: "t-dominante" },
      "référence dominante : ", h("span", { class: "surbrillance" }, t.dominante.ref.nom || "?")));
  } else {
    corps.appendChild(h("div", { class: "t-dominante" }, absence("— aucune référence chiffrable sur cette ligne")));
  }
  corps.appendChild(h("div", { class: "t-bas" },
    badgeEtat(t.postes.some(p => p.verdict.verdict.code === "gagne") ? "gagne"
      : t.postes.some(p => p.verdict.verdict.code === "pret") ? "pret"
        : t.postes.some(p => p.verdict.verdict.code === "essai") ? "essai"
          : t.aChiffrer ? "achiffrer"
            : t.postes.every(p => p.verdict.verdict.code === "vide") ? "vide" : "rien"),
    t.decisions ? badge("bleu", t.decisions + " décision" + (t.decisions > 1 ? "s" : "") + " en attente") : null,
    h("span", { class: "t-suite" }, "Ouvrir la ligne →")));
  dom.appendChild(corps);
  return dom;
}

/* La matrice des postes : une table, toutes les lignes, tri stable. */
function matricePostesDOM(tuiles) {
  const env = h("div", { class: "tableau-enveloppe" });
  const table = h("table", { class: "tableau" });
  table.appendChild(h("thead", {}, h("tr", {},
    h("th", {}, "Ligne"), h("th", {}, "Poste"), h("th", {}, "Référence"),
    h("th", { class: "mono" }, "CPP outillage prod"),
    h("th", { class: "mono" }, "Gain acté"), h("th", { class: "mono" }, "Gain en cours"),
    h("th", { class: "mono" }, "Chemin cible"), h("th", {}, "État"), h("th", {}, "Où entrer"))));
  const corps = h("tbody", {});
  tuiles.forEach(t => {
    corps.appendChild(h("tr", { class: "ligne-groupe" }, h("td", { colspan: "9" },
      (t.ligne.nom || "?") + (t.cpp !== null ? " — CPP ligne " + fmt(t.cpp, 4) + " €/pièce" : " — ligne non chiffrable"))));
    const postes = t.postes.filter(p => {
      if (!VUE.filtreProjetId) return true;
      return projetsDeOP(ETAT, t.ligne.id, (p.ref || {}).id, (p.op || {}).id).some(x => x.id === VUE.filtreProjetId);
    });
    if (!postes.length) {
      corps.appendChild(h("tr", {}, h("td", { colspan: "9" }), h("td", { colspan: "8", style: { color: "var(--label)", fontStyle: "italic" } },
        "aucun poste de ce projet sur cette ligne")));
    }
    postes.forEach((p, i) => {
      const v = p.verdict;
      const cheminTxt = (v.chemin !== null) ? Math.round(v.chemin) + " %" : "— pas de chemin calculable";
      const tr = h("tr", { class: i === postes.length - 1 ? "dernier" : "" },
        h("td", { style: { color: "var(--label)" } }, t.code || t.ligne.nom),
        h("td", {}, opCodeDe(p.op)),
        h("td", {}, (p.ref && p.ref.nom) || "—"),
        h("td", { class: "mono" }, v.cppProd !== null ? fmt(v.cppProd, 4) : "non chiffrable"),
        h("td", { class: "mono juste" }, v.gainActe !== null ? "+" + fmt(v.gainActe, 4) : "±0,000"),
        h("td", { class: "mono" }, v.gainProjete !== null ? "+" + fmt(v.gainProjete, 4) : "±0,000"),
        h("td", { class: "mono" }, cheminTxt),
        h("td", {}, badgeEtat(v.verdict.code)),
        h("td", {}, h("a", { href: "javascript:void(0)", onclick: () => ouvrirPoste(t.ligne.id, p) }, "ouvrir →")));
      corps.appendChild(tr);
    });
  });
  table.appendChild(corps);
  env.appendChild(table);
  return env;
}

function ouvrirPoste(ligneId, p) {
  aller("poste", { ligneId: ligneId, refId: (p.ref || {}).id || "", opId: (p.op || {}).id || "" });
}

/* ============================================================================
   6. L'ÉCRAN LIGNE — la production décomposée jusqu'au logement
   ========================================================================== */

function renderLigne() {
  const ligne = ligneActive();
  if (!ligne) return h("div", { class: "page" }, h("div", { class: "aucun" },
    h("span", { class: "grand" }, "Ligne introuvable"),
    h("a", { href: "javascript:void(0)", onclick: () => aller("accueil") }, "← revenir à l'accueil")));

  const det = detailLigne(ligne);
  const page = h("div", { class: "page" });

  page.appendChild(filDOM([
    { libelle: "Accueil", action: () => aller("accueil") },
    { libelle: ligne.nom }
  ]));
  page.appendChild(h("div", { class: "page-titre" },
    h("h1", {}, ligne.nom),
    ligne.coutHoraire ? h("span", { class: "peri" }, fmt(ligne.coutHoraire, 0) + " €/h") : null,
    h("span", { class: "droite liste-actions" },
      h("button", { class: "bouton petit", onclick: () => ouvrirPanneauLigne(ligne) }, "Fiche ligne"),
      h("button", { class: "bouton petit", onclick: () => ouvrirPanneauReference(ligne, null) }, "+ Référence"))));
  page.appendChild(h("p", { class: "sous-titre" },
    "Ce qui tourne aujourd'hui : le scénario de production de chaque opération, décomposé jusqu'au logement."));

  if (!det.refs.length) {
    page.appendChild(h("div", { class: "aucun" },
      h("span", { class: "grand" }, "Aucune référence sur cette ligne"),
      "Commencez par poser une référence disque : ",
      h("button", { class: "bouton", onclick: () => ouvrirPanneauReference(ligne, null) }, "+ Référence")));
    return page;
  }

  det.refs.forEach(rc => {
    const carte = h("div", { class: "carte" });
    carte.appendChild(h("div", { class: "c-entete" },
      h("span", { class: "c-titre" }, rc.nom),
      h("span", { class: "mono", style: { color: "var(--label)" } },
        "cible : ", rc.cible !== null ? fmt(rc.cible, 4) + " €/pièce" : "— non saisie"),
      h("span", { class: "droite liste-actions", style: { margin: 0 } },
        h("button", { class: "bouton petit", onclick: () => ouvrirPanneauReference(ligne, rc.ref) }, "Fiche référence"))));
    carte.appendChild(h("div", { class: "c-chiffres" },
      chiffre(rc.cpp !== null ? fmt(rc.cpp, 4) : "—", " €/pièce", { etiquette: "CPP outillage de la référence" }),
      chiffre(rc.nonChiffrables ? "hors " + rc.nonChiffrables + " OP non chiffrée(s)" : "postes tous chiffrés", "", { etiquette: "Périmètre" }),
      (() => {
        const projetsOP = projetsSurReference(ligne.id, rc.ref.id);
        return chiffre(String(projetsOP.length), " projet(s)", { etiquette: "Projets posés ici" });
      })()));

    /* Les OPs de la référence : la production, et la porte vers l'optimisation. */
    rc.postes.forEach(p => {
      carte.appendChild(posteResumeDOM(ligne, rc, p));
    });

    carte.appendChild(h("div", { class: "liste-actions" },
      h("button", {
        class: "bouton petit", onclick: () => ouvrirPanneauOp(ligne, rc.ref, null),
      }, "+ Opération")));
    page.appendChild(carte);
  });

  return page;
}

function projetsSurReference(ligneId, refId) {
  const ids = {};
  ((ETAT.projets) || []).forEach(pj => ((pj.tags) || []).forEach(t => {
    if (t.ligneId === ligneId && t.referenceId === refId) ids[pj.id] = pj;
  }));
  return Object.values(ids);
}

/* Le résumé d'un poste dans l'écran ligne : la prod, ses logements, les essais. */
function posteResumeDOM(ligne, rc, p) {
  const v = p.verdict;
  const el = h("div", { class: "porte" });
  const entete = h("div", { class: "outil-ligne", style: { marginBottom: "4px" } },
    h("span", { class: "outil-numero" },
      p.code + (p.nom && !p.nom.toUpperCase().startsWith(p.code) ? " · " + p.nom : "")),
    p.prod ? badgeEtoile() : badge("ambre", "sans production"),
    v.gainActe !== null ? badge("vert", "+" + fmt(v.gainActe, 4) + " €/pièce acté") : null,
    v.gainProjete !== null ? badge("bleu", "+" + fmt(v.gainProjete, 4) + " €/pièce en essai") : null,
    h("span", { class: "outil-cpp mono" },
      p.cpp !== null ? fmt(p.cpp, 4) + " €/pièce" : "non chiffrable"),
    h("span", { class: "droite" }),
    h("button", { class: "bouton petit", onclick: () => aller("poste", { ligneId: ligne.id, refId: rc.ref.id, opId: p.op.id }) },
      p.nbAutres ? "Optimiser (" + p.nbAutres + " scénario" + (p.nbAutres > 1 ? "s" : "") + ") →" : "Ouvrir le poste →"));
  el.appendChild(entete);

  if (!p.prod) {
    el.appendChild(h("div", { class: "note" },
      "Aucun scénario en production sur ce poste : ce qui tourne réellement n'est pas posé. ",
      h("a", { href: "javascript:void(0)", onclick: () => ouvrirPoste(ligne.id, { ref: rc.ref, op: p.op }) }, "Ouvrir le poste pour le créer.")));
    return el;
  }

  const outillage = p.outillage || outillageDeScenario(p.prod);
  const cppTotal = outillage.cpp;
  outillage.outils.forEach(o => {
    const bloc = h("div", { class: "outil-bloc" });
    bloc.appendChild(h("div", { class: "outil-ligne" },
      h("span", { class: "outil-numero" }, o.numero),
      o.description ? h("span", { class: "outil-desc" }, o.description) : null,
      h("span", { class: "outil-cpp mono" }, o.cpp !== null ? fmt(o.cpp, 4) + " €/pièce" : "— non chiffrable")));
    const table = h("table", {});
    table.appendChild(h("thead", {}, h("tr", {},
      h("th", {}, "Logement"), h("th", {}, "Plaquette / article"),
      h("th", {}, "MABEC"),
      h("th", { class: "mono" }, "Prix"), h("th", { class: "mono" }, "Arêtes"), h("th", { class: "mono" }, "Charnière"),
      h("th", { class: "mono" }, "€/pièce"), h("th", { class: "mono" }, "Part"))));
    const corps = h("tbody", {});
    o.logements.forEach(l => {
      const part = (l.cpp !== null && cppTotal) ? Math.round(l.cpp / cppTotal * 100) + " %" : "—";
      const tr = h("tr", { class: l.cpp === null ? "non-chiffrable" : "" },
        h("td", {}, h("span", { class: "logement-nom" }, l.logementNom)),
        h("td", {}, l.article || "", l.article ? h("span", { class: "article" }, "") : null),
        h("td", { class: "mono" }, l.mabec || ""),
        h("td", { class: "mono" }, l.prix !== null ? fmt(l.prix, 2) : "—"),
        h("td", { class: "mono" }, l.aretes !== null ? fmt(l.aretes, 0) : "—"),
        h("td", { class: "mono" }, l.charniere !== null ? fmt(l.charniere, 0) : "—"),
        h("td", { class: "mono" }, l.cpp !== null ? fmt(l.cpp, 4) : "— non chiffrable"),
        h("td", { class: "mono part" }, part));
      corps.appendChild(tr);
    });
    table.appendChild(corps);
    bloc.appendChild(table);
    el.appendChild(bloc);
  });

  /* Les essais portés par la production : des mesures réelles, jamais cachées. */
  const essaisProd = p.prod.essais || [];
  if (essaisProd.length) {
    el.appendChild(h("div", { class: "note" },
      h("span", { class: "note-titre" }, "Essais portés par la production"),
      essaisProd.map(e => {
        const o = cppEssaiObtenu(p.prod, e);
        const st = statutEssai(p.prod, e);
        return h("div", {}, e.titre + " — " + st.texte +
          (o.cpp !== null ? " · CPP obtenu " + fmt(o.cpp, 4) + " €/pièce (prévu " + fmt(p.cpp, 4) + ")" : " · CPP non mesurable"));
      })));
  } else if (p.cpp !== null) {
    el.appendChild(h("div", { class: "note" },
      "Aucun essai sur la production : son CPP est celui qu'on a prévu, pas celui qu'on a mesuré."));
  }

  /* Le résumé des projets posés sur ce poste (CDC Projets v2 §1.4). */
  const projetsOP = projetsDeOP(ETAT, ligne.id, rc.ref.id, p.op.id);
  if (projetsOP.length) {
    el.appendChild(h("div", { class: "etiquettes", style: { marginTop: "8px" } },
      h("span", { style: { fontSize: "12px", color: "var(--label)" } },
        projetsOP.length + " projet" + (projetsOP.length > 1 ? "s" : "") + " sur ce poste : "),
      projetsOP.map(pj => pastilleProjet(pj, VUE.filtreProjetId === pj.id))));
  }

  return el;
}

/* ============================================================================
   7. L'ÉCRAN POSTE — la décision : prévu contre obtenu, prod contre essais
   ========================================================================== */

function renderPoste() {
  const ligne = ligneActive();
  const ref = referenceActive(ligne);
  const op = opActive(ref);
  if (!ligne || !ref || !op) return h("div", { class: "page" }, h("div", { class: "aucun" },
    h("span", { class: "grand" }, "Poste introuvable"),
    h("a", { href: "javascript:void(0)", onclick: () => aller("accueil") }, "← revenir à l'accueil")));

  const v = verdictPoste(ref, op, op.scenarios);
  const dec = decisionPoste(v);
  const page = h("div", { class: "page" });

  page.appendChild(filDOM([
    { libelle: "Accueil", action: () => aller("accueil") },
    { libelle: ligne.nom, action: () => aller("ligne", { ligneId: ligne.id, refId: "", opId: "", scId: "" }) },
    { libelle: ref.nom, action: () => aller("ligne", { ligneId: ligne.id, refId: ref.id, opId: "", scId: "" }) },
    { libelle: opCodeDe(op) + (op.nom && !op.nom.includes(opCodeDe(op)) ? " · " + op.nom : "") }
  ]));

  /* Le bandeau de décision : le mot, la raison, les chiffres à côté. */
  page.appendChild(h("div", { class: "page-titre" }, h("h1", {}, "Poste " + opCodeDe(op)),
    h("span", { class: "peri" }, ref.nom)));
  page.appendChild(h("div", { class: "bandeau" },
    h("div", { class: "bloc " + (v.verdict.code === "gagne" ? "acte" : v.verdict.code === "achiffrer" ? "" : "") },
      h("div", { class: "etiquette" }, "La décision"),
      h("div", { class: "valeur", style: { fontSize: "24px" } }, dec.mot),
      h("div", { class: "contexte" }, dec.pourquoi)),
    h("div", { class: "bloc" },
      h("div", { class: "etiquette" }, "CPP outillage prod"),
      h("div", { class: "valeur" }, v.cppProd !== null ? fmt(v.cppProd, 4) : "—", h("span", { class: "unite" }, "€/pièce")),
      h("div", { class: "contexte" },
        v.cppProd !== null
          ? (v.nonChiffrables ? "hors " + v.nonChiffrables + " logement(s) non chiffrable(s)" : "tous les logements sont chiffrés")
          : "— trio prix / arêtes / charnière incomplet")),
    h("div", { class: "bloc" },
      h("div", { class: "etiquette" }, "Cible du site"),
      h("div", { class: "valeur" }, v.cible !== null ? fmt(v.cible, 4) : "—", h("span", { class: "unite" }, "€/pièce")),
      h("div", { class: "contexte" }, v.cible !== null ? "la valeur de référence du classeur" : "— cible non saisie sur la référence")),
    h("div", { class: "bloc" },
      h("div", { class: "etiquette" }, "Chemin vers la cible"),
      h("div", { class: "valeur" }, v.chemin !== null ? Math.round(v.chemin) + " %" : "—"),
      h("div", { class: "contexte" },
        v.chemin !== null
          ? "par le meilleur scénario connu : " + ((v.meilleur && v.meilleur.sc.name) || "")
          : "— ni cible, ni scénario chiffrable : pas de chemin calculable"))
  ));

  /* Les deux gains, côte à côte, jamais sommés. */
  page.appendChild(h("div", { class: "carte" },
    h("div", { class: "c-entete" }, h("span", { class: "c-titre" }, "Les gains"),
      h("span", { style: { color: "var(--label)", fontSize: "13px" } }, "deux blocs distincts — on ne les additionne jamais")),
    h("div", { class: "c-chiffres" },
      chiffre(v.gainActe !== null ? "+" + fmt(v.gainActe, 4) : "±0,000", " €/pièce",
        { etiquette: "Acté (en série)", couleur: v.gainActe !== null ? "juste" : "" }),
      chiffre(v.gainActe !== null && v.gainAnnuelActe !== null ? "+" + fmt(v.gainAnnuelActe, 0) : "—", " €/an",
        { etiquette: "Acté, à l'année", contexte: v.gainAnnuelActe !== null
          ? "volume annuel saisi : " + fmt(v.volume, 0) + " pièces"
          : (v.gainActe !== null ? "— volume annuel non saisi : le €/an ne s'invente pas"
            : "aucun gain acté en série ici pour l'instant") }),
      chiffre(v.gainProjete !== null ? "+" + fmt(v.gainProjete, 4) : "±0,000", " €/pièce",

  /* Le scénario de production. */

  } else {

    h("h2", { style: { fontSize: "17px" } }, "Ce qu'on teste"),

      autres.length ? autres.length + " scénario" + (autres.length > 1 ? "s" : "") + " contre la prod" : "")));

  }

  /* Les actions du poste. */
  page.appendChild(h("div", { class: "liste-actions" },

    op.ficheOutil ? h("span", { style: { color: "var(--label)", fontSize: "12px" } }, "fiche outil jointe à l'OP") : null));
  return page;
}

function dupliquerProd(op, prod) {
  const copie = JSON.parse(JSON.stringify(prod));
  copie.id = uid("sc");
  copie.name = "Essai — copie de " + prod.name;
  copie.baseline = false;
  copie.statut = "etude";
  copie.essais = [];
  copie.modifieLe = new Date().toISOString();
  op.scenarios.push(copie);
  saveData();
  toast("Scénario de travail créé à partir de la prod — modifiez ce qui change.");
  ouvrirPanneauScenario(ligneActive(), referenceActive(), op, copie, false);
}

/* La carte d'un scénario : prévu, obtenu, preuve, décision. */

/* La promotion : l'échange annoncé (v4.4 de l'app). L'ancien ★ repasse
   « Validé » — il n'a rien raté, il a été remplacé par mieux. */
function promouvoirScenario(ligne, ref, op, sc) {
  const actuel = scenarioDeProd(op.scenarios);
  confirmer(
    "« " + sc.name + " » devient le scénario de production de " + opCodeDe(op) + "."
    + (actuel ? " L'ancien (« " + actuel.name + " ») repasse en Validé." : "")
    + " Le CPP de la référence sera recalculé sur la nouvelle base.",
    "Passer en série", () => {
      (op.scenarios || []).forEach(s => {
        if (s.id === sc.id) { s.baseline = true; s.statut = "serie"; s.statutDate = new Date().toISOString().slice(0, 10); }
        else if (s.baseline) { s.baseline = false; if (s.statut === "serie") s.statut = "valide"; }
      });
      sc.modifieLe = new Date().toISOString();
      saveData();
      toast("« " + sc.name + " » est le scénario de production.");
      render();
    });
}

"use strict";

/* ---- la ligne ---- */
function ouvrirPanneauLigne(ligne) {
  const nom = champ("Nom de la ligne", "text", ligne.nom);
  const taux = champ("Taux horaire (€/h)", "number", ligne.coutHoraire,
    { step: "any", min: "0" }, "il valorise le temps machine — jamais affiché en comparaison du classeur");
  const obs = h("label", { class: "champ" },
    h("span", { class: "etiquette" }, "Observations"),
    h("textarea", { onchange: e => { ligne.observations = e.target.value; saveData(); } }, ligne.observations || ""));
  nom.querySelector("input").addEventListener("change", e => { ligne.nom = e.target.value; saveData(); });
  taux.querySelector("input").addEventListener("change", e => { ligne.coutHoraire = e.target.value === "" ? "" : parseFloat(e.target.value); saveData(); });
  ouvrirPanneau("Fiche ligne", ligne.nom, [
    nom, taux, obs,
    h("div", { class: "note" }, "Le taux horaire sert seulement à la zone « temps machine », qui se lit à côté du CPP outillage — les deux périmètres ne se comparent jamais.")
  ]);
}

/* ---- la référence ---- */
function ouvrirPanneauReference(ligne, ref) {
  const creation = !ref;
  const r = ref || { id: uid("re"), nom: "", cibleCPP: "", productionAnnuelle: "", volumeHistorique: [], ops: [] };
  const nom = champ("Nom de la référence disque", "text", r.nom);
  const cible = champ("Cible CPP du site (€/pièce)", "number", r.cibleCPP, { step: "any", min: "0" },
    "la valeur du classeur de Matis — l'écart à la cible ne s'affiche que si elle existe");
  const volume = champ("Volume annuel (pièces/an)", "number", r.productionAnnuelle, { step: "any", min: "0" },
    "il transforme le gain par pièce en gain annuel — sans lui, pas de €/an affiché");
  nom.querySelector("input").addEventListener("change", e => { r.nom = e.target.value; saveData(); });
  cible.querySelector("input").addEventListener("change", e => { r.cibleCPP = e.target.value === "" ? "" : parseFloat(e.target.value); saveData(); });
  volume.querySelector("input").addEventListener("change", e => { r.productionAnnuelle = e.target.value === "" ? "" : parseFloat(e.target.value); saveData(); });

  /* Les OPs connus de la ligne (topologie d'atelier) : on les pré-pose d'un
     coup si l'utilisateur le veut — des OPs sans scénario restent visibles,
     marquées « sans production », jamais confondues avec une ligne finie. */
  const connus = opsConnusDeLigne(ligne.nom);
  const prePose = [];
  let blocOps = null;
  if (creation && connus.length) {
    blocOps = h("div", { class: "groupe-champs" },
      h("span", { class: "titre-groupe" }, "Les opérations connues de " + ligne.nom));
    connus.forEach(op => {
      const cb = h("input", { type: "checkbox", checked: false, onchange: e => {
        if (e.target.checked) prePose.push(op); else {
          const i = prePose.indexOf(op); if (i >= 0) prePose.splice(i, 1);
        }
      } });
      blocOps.appendChild(h("label", { class: "champ", style: { display: "flex", gap: "10px", alignItems: "center" } }, cb,
        h("span", {}, op.nom)));
    });
  }

  ouvrirPanneau(creation ? "Nouvelle référence" : "Fiche référence", ligne.nom, [
    nom, cible, volume, blocOps,
    creation ? h("button", {
      class: "bouton primaire", onclick: () => {
        if (!r.nom) { toast("Donnez un nom à la référence."); return; }
        prePose.forEach(op => r.ops.push({
          id: uid("op"), nom: op.nom, ordre: op.ordre, opCode: "OP" + op.ordre,
          ficheOutil: null, config: {}, scenarios: []
        }));
        ligne.references.push(r);
        saveData(); fermerPanneau(); aller("ligne", { ligneId: ligne.id, refId: r.id });
        toast(prePose.length ? "Référence créée avec " + prePose.length + " opération(s) pré-posée(s)." : "Référence créée.");
      }
    }, "Créer la référence") : null
  ]);
}

/* ---- l'OP ---- */
function ouvrirPanneauOp(ligne, ref, op) {
  const creation = !op;
  const o = op || { id: uid("op"), nom: "", ordre: null, opCode: "", ficheOutil: null, config: {}, scenarios: [] };
  const nom = champ("Nom de l'opération", "text", o.nom, { placeholder: "OP40 Finition pistes" });
  const ordre = champ("Ordre (le numéro de l'OP)", "number", o.ordre, { step: "1" },
    "le code OP40 est dérivé du nom ou de l'ordre — jamais saisi en double");
  nom.querySelector("input").addEventListener("change", e => { o.nom = e.target.value; if (o.opCode !== undefined) o.opCode = ""; saveData(); });
  ordre.querySelector("input").addEventListener("change", e => { o.ordre = e.target.value === "" ? null : parseInt(e.target.value, 10); saveData(); });

  /* Les modules de calcul optionnels, par OP (comme l'app). */
  const cfg = o.config = o.config || {};
  const modules = h("div", { class: "groupe-champs" },
    h("span", { class: "titre-groupe" }, "Modules de calcul de ce poste"),
    ligneBool("Volume annuel (les gains passent en €/an)", "volumeActif"),
    ligneBool("Coût machine (temps × taux horaire, à côté du CPP outillage)", "coutMachineActif"),
    ligneBool("Coût du rebut", "coutRebutActif"),
    ligneBool("Pièces détachées", "piecesActif"));
  function ligneBool(libelle, cle) {
    const cb = h("input", { type: "checkbox", checked: cfg[cle] === true, onchange: e => { cfg[cle] = e.target.checked; saveData(); } });
    return h("label", { class: "champ", style: { display: "flex", gap: "10px", alignItems: "center" } }, cb, h("span", {}, libelle));
  }

  ouvrirPanneau(creation ? "Nouvelle opération" : "Fiche OP", ref.nom, [
    nom, ordre, modules,
    creation ? h("button", {
      class: "bouton primaire", onclick: () => {
        if (!o.nom) { toast("Donnez un nom à l'opération."); return; }
        ref.ops.push(o);
        saveData(); fermerPanneau(); render();
      }
    }, "Créer l'opération") : null
  ]);
}

/* ---- le scénario : la fiche et son outillage ---- */
function ouvrirPanneauScenario(ligne, ref, op, sc, enProd) {
  const creation = !sc;
  const s = sc || {
    id: uid("sc"), name: "", cycle: 100,
    baseline: enProd === true, statut: enProd === true ? "serie" : "etude",
    statutMotif: "", statutDate: "",
    emag1: false, battCotes: "DG",
    limitOverride: false, limitLabel: "Battement (mm)", limitValue: "",
    limitLabel2: "Ra (µm)", limitValue2: 0.8, critere2Actif: false,
    criteresSup: [], validationThreshold: 5, battActif: true,
    tauxRebutAnnuel: "", marpossRapport: "", tendanceRapport: "", notes: "",
    outils: [], essais: [], scrapLog: [], modifieLe: new Date().toISOString()
  };

  const nom = champ("Nom du scénario", "text", s.name, { placeholder: "Essai SL500" });
  nom.querySelector("input").addEventListener("change", e => { s.name = e.target.value; saveData(); });

  /* Le statut : verrouillé pour le scénario de production (v4.4 de l'app). */
  const statut = champSelect("Statut",
    Object.keys(STATUTS_SCENARIO).filter(k => k !== "serie" || s.baseline).map(k => ({ value: k, libelle: STATUTS_SCENARIO[k].mot })),
    s.statut, {},
    s.baseline ? "le scénario de production est en série, verrouillé — passez la main par ★ sur un autre scénario" : "");
  statut.querySelector("select").addEventListener("change", e => {
    if (s.baseline) { toast("Le scénario de production reste en série."); e.target.value = "serie"; return; }
    s.statut = e.target.value;
    if (e.target.value === "serie") {
      s.baseline = true;
      (op.scenarios || []).forEach(x => { if (x.id !== s.id && x.baseline) { x.baseline = false; if (x.statut === "serie") x.statut = "valide"; } });
    }
    saveData();
  });

  /* Les limites de conformité (battement / Ra). */
  function ligneBool(libelle, cle) {
    const cb = h("input", { type: "checkbox", checked: s[cle] === true, onchange: e => { s[cle] = e.target.checked; saveData(); } });
    return h("label", { class: "champ", style: { display: "flex", gap: "10px", alignItems: "center" } }, cb, h("span", {}, libelle));
  }
  function champNum(libelle, cle, aide) {
    const el = champ(libelle, "number", s[cle], { step: "any", min: "0" }, aide || "");
    el.querySelector("input").addEventListener("change", e => {
      s[cle] = e.target.value === "" ? "" : parseFloat(e.target.value);
      if (cle === "limitValue") s.limitOverride = e.target.value !== "";
      saveData();
    });
    return el;
  }
  const limites = h("div", { class: "groupe-champs" },
    h("span", { class: "titre-groupe" }, "Les critères de conformité"),
    ligneBool("Le battement juge la conformité", "battActif"),
    champNum("Limite de battement (mm)", "limitValue", "laisser vide : la limite de l'atelier (0,12 mm) s'applique"),
    ligneBool("Le Ra juge aussi (2ᵉ critère)", "critere2Actif"),
    champNum("Limite Ra (µm)", "limitValue2", ""),
    champNum("Essais conformes pour valider (protocole 5×)", "validationThreshold", ""));

  /* L'outillage : outils → logements, éditables en place. */
  const outillageBloc = h("div", {});
  function logementVide(nomDefaut) {
    return { id: uid("g"), nom: nomDefaut, ref: "", codeArticle: "", mabec: "", prix: "", aretes: "", charniere: "", vc: "", f: "", kappaR: "", rayonBec: "", apPiste: "", tempsCoupe: "", tempsDeplacement: "", suiviTolerance: false };
  }
  function rendreOutillage() {
    outillageBloc.innerHTML = "";
    s.outils.forEach((o, iO) => {
      const bloc = h("div", { class: "groupe-champs" },
        h("span", { class: "titre-groupe" }, "Porte-outil " + (iO + 1)));
      const num = champ("Numéro (T543)", "text", o.numero);
      num.querySelector("input").addEventListener("change", e => { o.numero = e.target.value; saveData(); });
      const desc = champ("Description", "text", o.description);
      desc.querySelector("input").addEventListener("change", e => { o.description = e.target.value; saveData(); });
      const corr = champ("Correcteur", "text", o.correcteur);
      corr.querySelector("input").addEventListener("change", e => { o.correcteur = e.target.value; saveData(); });
      bloc.appendChild(num); bloc.appendChild(desc); bloc.appendChild(corr);

      (o.logements || []).forEach((l, iL) => {
        const g = h("div", { class: "groupe-champs", style: { background: "var(--carte-2)" } },
          h("span", { class: "titre-groupe" }, "Logement " + (l.nom || (iL + 1))));
        g.appendChild(champMini(l, "nom", "Logement (D1, bol, piste…)", "text"));
        g.appendChild(champMini(l, "mabec", "MABEC (code article plaquette)", "text"));
        g.appendChild(champMini(l, "ref", "Plaquette / article", "text"));
        g.appendChild(champMini(l, "prix", "Prix de la plaquette (€)", "number"));
        g.appendChild(champMini(l, "aretes", "Arêtes", "number"));
        g.appendChild(champMini(l, "charniere", "Charnière (pièces)", "number"));
        const plus = h("details", {},
          h("summary", { style: { cursor: "pointer", color: "var(--blue)", fontSize: "13px", minHeight: "44px", lineHeight: "44px" } }, "Conditions de coupe et cycle (facultatif)"),
          champMini(l, "vc", "Vc (m/min)", "number"),
          champMini(l, "f", "f (mm/tr)", "number"),
          champMini(l, "kappaR", "κr (°)", "number"),
          champMini(l, "apPiste", "ap piste (mm)", "number"),
          champMini(l, "tempsCoupe", "Temps de coupe (s)", "number"),
          champMini(l, "tempsDeplacement", "Temps de déplacement (s)", "number"));
        g.appendChild(plus);
        g.appendChild(h("button", {
          class: "bouton petit danger", onclick: () => {
            confirmer("Retirer le logement « " + (l.nom || "?") + " » de cet outil ? Le CPP du scénario sera recalculé.",
              "Retirer", () => { o.logements.splice(iL, 1); saveData(); fermerPanneau(); ouvrirPanneauScenario(ligne, ref, op, s, false); render(); });
          }
        }, "Retirer ce logement"));
        bloc.appendChild(g);
      });

      bloc.appendChild(h("div", { class: "liste-actions" },
        h("button", { class: "bouton petit", onclick: () => {
          o.logements.push(logementVide("D" + ((o.logements || []).length + 1)));
          saveData(); fermerPanneau(); ouvrirPanneauScenario(ligne, ref, op, s, false);
        } }, "+ Logement"),
        h("button", { class: "bouton petit danger", onclick: () => {
          confirmer("Retirer le porte-outil " + o.numero + " et tous ses logements ?", "Retirer l'outil", () => {
            s.outils.splice(iO, 1); saveData(); fermerPanneau(); ouvrirPanneauScenario(ligne, ref, op, s, false); render();
          }, { danger: true });
        } }, "Retirer ce porte-outil")));
      outillageBloc.appendChild(bloc);
    });
    outillageBloc.appendChild(h("div", { class: "liste-actions" },
      h("button", { class: "bouton petit", onclick: () => {
        s.outils.push({ id: uid("t"), numero: "T" + (500 + s.outils.length + 1), correcteur: "", description: "", plan: null, pieces: [], logements: [logementVide("D1")] });
        saveData(); fermerPanneau(); ouvrirPanneauScenario(ligne, ref, op, s, false);
      } }, "+ Porte-outil")));
  }
  function champMini(obj, cle, libelle, type) {
    const el = champ(libelle, type, obj[cle], { step: "any" });
    el.querySelector("input").addEventListener("change", e => {
      obj[cle] = (type === "number" && e.target.value !== "") ? parseFloat(e.target.value) : e.target.value;
      saveData();
    });
    return el;
  }
  rendreOutillage();

  const notes = h("label", { class: "champ" },
    h("span", { class: "etiquette" }, "Notes"),
    h("textarea", { onchange: e => { s.notes = e.target.value; saveData(); } }, s.notes || ""));

  ouvrirPanneau(creation ? "Nouveau scénario" : "Fiche scénario",
    ligne.nom + " · " + ref.nom + " · " + opCodeDe(op), [
    nom, statut, limites,
    h("div", { class: "groupe-champs" }, h("span", { class: "titre-groupe" }, "L'outillage"), outillageBloc),
    notes,
    creation ? h("button", {
      class: "bouton primaire", onclick: () => {
        if (!s.name) { toast("Donnez un nom au scénario."); return; }
        op.scenarios.push(s);
        saveData(); fermerPanneau(); render();
      }
    }, "Créer le scénario") : null
  ], { large: true });
}

/* ---- l'essai : la saisie en 90 s, le reste replié ---- */
function ouvrirPanneauEssai(ligne, ref, op, sc, essai) {
  const creation = !essai;
  const e = essai || {
    id: uid("e"), titre: "", date: new Date().toISOString().slice(0, 10),
    dateFin: "", heureDebut: "", heureFin: "",
    equipe: "", operateur: "", redigePar: "",
    programme: "", programmeGauche: "", programmeDroit: "",
    maturiteBruts: "", observations: "", cloture: null,
    params: { logements: [] }, prelevements: [],
    photos: [], marpossListe: [], marposs: null, modifieLe: new Date().toISOString()
  };
  e.modifieLe = new Date().toISOString();

  /* Les logements suivis + la charnière mesurée : le cœur de la saisie. */
  const logementsBloc = h("div", { class: "groupe-champs" },
    h("span", { class: "titre-groupe" }, "Les logements suivis — la charnière mesurée fait le CPP obtenu"));
  const tousLogements = [];
  (sc.outils || []).forEach(o => (o.logements || []).forEach(l => tousLogements.push({ o: o, l: l })));
  if (!tousLogements.length) {
    logementsBloc.appendChild(h("div", { class: "note" }, "Ce scénario n'a aucun logement : posez l'outillage dans la fiche scénario avant de consigner un essai."));
  }
  tousLogements.forEach(({ o, l }) => {
    const suivi = (e.params.logements || []).find(p => p.logementId === l.id);
    if (!suivi) {
      const cb = h("input", { type: "checkbox", onchange: ev => {
        if (ev.target.checked) {
          e.params.logements.push({ logementId: l.id, logementNom: l.nom || "?", charniere: "", vc: "", f: "" });
        } else {
          e.params.logements = e.params.logements.filter(p => p.logementId !== l.id);
        }
        e.modifieLe = new Date().toISOString();
        saveData(); fermerPanneau(); ouvrirPanneauEssai(ligne, ref, op, sc, e);
      } });
      logementsBloc.appendChild(h("label", { class: "champ", style: { display: "flex", gap: "10px", alignItems: "center" } }, cb,
        h("span", {}, h("span", { class: "mono" }, o.numero + " " + (l.nom || "?")), " — " + (l.ref || "sans article"))));
      return;
    }
    const ch = champ("Charnière mesurée — " + o.numero + " " + (l.nom || "?") + " (pièces)", "number", suivi.charniere, { step: "any", min: "0" },
      "le scénario prévoyait " + (l.charniere !== "" && l.charniere != null ? fmt(l.charniere, 0) : "—"));
    ch.querySelector("input").addEventListener("change", ev => { suivi.charniere = ev.target.value === "" ? "" : parseFloat(ev.target.value); e.modifieLe = new Date().toISOString(); saveData(); });
    logementsBloc.appendChild(ch);
  });

  /* Les prélèvements : pièce, battement (D/G si la machine relève les deux côtés), Ra, usure. */
  const prelsBloc = h("div", { class: "groupe-champs" });
  function rendrePrels() {
    prelsBloc.innerHTML = "";
    prelsBloc.appendChild(h("span", { class: "titre-groupe" }, "Les prélèvements"));
    if (!(e.prelevements || []).length) {
      prelsBloc.appendChild(h("div", { class: "note" }, "Aucun prélèvement. Le battement se relève par pièce : le pire des deux côtés juge (jamais la moyenne)."));
    }
    (e.prelevements || []).forEach((p, i) => {
      const g = h("div", { class: "rangee", style: { borderBottom: "1px solid var(--filet)", paddingBottom: "8px" } });
      const mk = (libelle, cle) => {
        const el = champ(libelle, "number", p[cle], { step: "any" });
        el.querySelector("input").addEventListener("change", ev => {
          p[cle] = ev.target.value === "" ? "" : parseFloat(ev.target.value);
          e.modifieLe = new Date().toISOString();
          saveData();
        });
        return el;
      };
      g.appendChild(mk("Pièce n°", "piece"));
      if (sc.emag1) {
        g.appendChild(mk("Battement D (mm)", "battD"));
        g.appendChild(mk("Battement G (mm)", "battG"));
      } else {
        g.appendChild(mk("Battement (mm)", "batt"));
      }
      if (sc.critere2Actif) g.appendChild(mk("Ra (µm)", "valeur2"));
      const usure = champSelect("Usure plaquette", [
        { value: "", libelle: "—" }, { value: "ok", libelle: "OK" },
        { value: "limite", libelle: "limite" }, { value: "changer", libelle: "à changer" }
      ], p.usure || "");
      usure.querySelector("select").addEventListener("change", ev => { p.usure = ev.target.value; e.modifieLe = new Date().toISOString(); saveData(); });
      g.appendChild(usure);
      g.appendChild(h("button", {
        class: "bouton petit danger", onclick: () => {
          e.prelevements.splice(i, 1); e.modifieLe = new Date().toISOString();
          saveData(); fermerPanneau(); ouvrirPanneauEssai(ligne, ref, op, sc, e);
        }
      }, "×"));
      prelsBloc.appendChild(g);
    });
    prelsBloc.appendChild(h("div", { class: "liste-actions" },
      h("button", { class: "bouton petit primaire", onclick: () => {
        e.prelevements.push({ id: uid("p"), piece: "", batt: "", battD: "", battG: "", logementId: (e.params.logements[0] || {}).logementId || "", pointMesure: "Piste", usure: "", valeur2: "", valeurs: {} });
        e.modifieLe = new Date().toISOString();
        saveData(); fermerPanneau(); ouvrirPanneauEssai(ligne, ref, op, sc, e);
      } }, "+ Prélèvement")));
  }
  rendrePrels();

  /* Les photos : ajoutées sur le poste, jamais envoyées. */
  const photosBloc = h("div", { class: "groupe-champs" });
  function rendrePhotos() {
    photosBloc.innerHTML = "";
    photosBloc.appendChild(h("span", { class: "titre-groupe" }, "Les photos"));
    if (!(e.photos || []).length) photosBloc.appendChild(h("div", { class: "note" }, "Aucune photo. Elles restent sur ce poste, comme tout le reste."));
    let poids = 0;
    (e.photos || []).forEach((ph, i) => {
      const t = (ph.data || ph.src || ph.url || "");
      poids += t.length;
      const lignePh = h("div", { class: "rangee", style: { alignItems: "center", borderBottom: "1px solid var(--filet)", paddingBottom: "6px" } });
      const legende = champ("Légende", "text", ph.legende || "");
      legende.querySelector("input").addEventListener("change", ev => { ph.legende = ev.target.value; saveData(); });
      legende.style.flex = "1 1 220px";
      lignePh.appendChild(legende);
      if (t) lignePh.appendChild(h("a", { href: t, target: "_blank", style: { color: "var(--blue)", fontSize: "13px" } }, "voir"));
      lignePh.appendChild(h("button", {
        class: "bouton petit danger", onclick: () => {
          e.photos.splice(i, 1); saveData(); fermerPanneau(); ouvrirPanneauEssai(ligne, ref, op, sc, e);
        }
      }, "×"));
      photosBloc.appendChild(lignePh);
    });
    if (poids > 3 * 1024 * 1024) {
      photosBloc.appendChild(h("div", { class: "note" }, "Les photos de cet essai pèsent environ " + Math.round(poids / 1048576) + " Mo : pensez à exporter régulièrement, le stockage local n'est pas infini."));
    }
    const input = h("input", { type: "file", accept: "image/*", style: { marginTop: "8px" }, onchange: ev => {
      const fichier = ev.target.files && ev.target.files[0];
      if (!fichier) return;
      const rd = new FileReader();
      rd.onload = () => {
        e.photos.push({ id: uid("ph"), filename: fichier.name, addedAt: new Date().toISOString(), legende: "", data: rd.result });
        e.modifieLe = new Date().toISOString();
        saveData(); fermerPanneau(); ouvrirPanneauEssai(ligne, ref, op, sc, e);
      };
      rd.readAsDataURL(fichier);
    } });
    photosBloc.appendChild(h("label", { class: "champ" }, h("span", { class: "etiquette" }, "Ajouter une photo"), input));
  }
  rendrePhotos();

  /* Les champs de contexte, repliés. */
  const contexte = h("details", {},
    h("summary", { style: { cursor: "pointer", color: "var(--blue)", minHeight: "44px", lineHeight: "44px" } }, "Le contexte (équipe, programmes, fin d'essai…)"));
  const mkCtx = (libelle, cle, type) => {
    const el = champ(libelle, type || "text", e[cle]);
    el.querySelector("input").addEventListener("change", ev => { e[cle] = ev.target.value; e.modifieLe = new Date().toISOString(); saveData(); });
    contexte.appendChild(el);
  };
  mkCtx("Équipe", "equipe"); mkCtx("Opérateur", "operateur"); mkCtx("Rédigé par", "redigePar");
  mkCtx("Fin d'essai (date)", "dateFin", "date"); mkCtx("Heure début", "heureDebut", "time"); mkCtx("Heure fin", "heureFin", "time");
  mkCtx("Programme CNC", "programme");
  if (sc.emag1) { mkCtx("Programme côté gauche", "programmeGauche"); mkCtx("Programme côté droit", "programmeDroit"); }
  mkCtx("Maturité des bruts", "maturiteBruts");
  const obs = h("label", { class: "champ" },
    h("span", { class: "etiquette" }, "Observations"),
    h("textarea", { onchange: ev => { e.observations = ev.target.value; e.modifieLe = new Date().toISOString(); saveData(); } }, e.observations || ""));
  contexte.appendChild(obs);

  const titre = champ("Titre de l'essai", "text", e.titre, { placeholder: "SL500 sur T513 D1" });
  titre.querySelector("input").addEventListener("change", ev => { e.titre = ev.target.value; e.modifieLe = new Date().toISOString(); saveData(); });
  const date = champ("Date", "date", e.date);
  date.querySelector("input").addEventListener("change", ev => { e.date = ev.target.value; e.modifieLe = new Date().toISOString(); saveData(); });

  ouvrirPanneau(creation ? "Consigner un essai" : "L'essai",
    ligne.nom + " · " + opCodeDe(op) + " · " + sc.name, [
    titre, date, logementsBloc, prelsBloc, photosBloc, contexte,
    creation ? h("button", {
      class: "bouton primaire", onclick: () => {
        (sc.essais = sc.essais || []).push(e);
        saveData(); fermerPanneau(); render();
      }
    }, "Consigner l'essai") : h("button", {
      class: "bouton", onclick: () => {
        if (!(e.cloture || {}).motif) {
          confirmer("Arrêter cet essai ? Un essai arrêté est une décision — il sera affiché « arrêté » avec sa raison.",
            "Arrêter l'essai", () => {
              e.cloture = { motif: "arrêté manuellement le " + dateCourte(), date: new Date().toISOString() };
              e.modifieLe = new Date().toISOString();
              saveData(); fermerPanneau(); render();
            });
        } else {
          e.cloture = null; saveData(); toast("Essai réouvert."); fermerPanneau();
        }
      }
    }, (e.cloture || {}).motif ? "Réouvrir l'essai" : "Arrêter l'essai (avec la raison)")
  ], { large: true });
}

"use strict";

/* ---- le projet ---- */
function ouvrirPanneauProjet(pj) {
  const creation = !pj;
  const p = pj || {
    id: uid("pj"), nom: "", description: "", statut: "encours", dateCible: "",
    responsableId: "", couleur: couleurProjetLibre(ETAT),
    creePar: "", creeLe: new Date().toISOString(), modifieLe: new Date().toISOString(), tags: []
  };

  const nom = champ("Nom du projet", "text", p.nom);
  nom.querySelector("input").addEventListener("change", e => { p.nom = e.target.value; saveData(); });
  const desc = h("label", { class: "champ" },
    h("span", { class: "etiquette" }, "Description (l'objectif, les moyens)"),
    h("textarea", { onchange: e => { p.description = e.target.value; p.modifieLe = new Date().toISOString(); saveData(); } }, p.description || ""));
  const statut = champSelect("Statut",
    Object.keys(PROJET_STATUTS).map(k => ({ value: k, libelle: PROJET_STATUTS[k] })), p.statut);
  statut.querySelector("select").addEventListener("change", e => { p.statut = e.target.value; p.modifieLe = new Date().toISOString(); saveData(); });
  const cible = champ("Date cible", "date", p.dateCible);
  cible.querySelector("input").addEventListener("change", e => { p.dateCible = e.target.value; saveData(); });

  /* Le responsable : la liste gérée, plus l'ajout direct (CDC Projets v2 §2.1). */
  const respSel = champSelect("Responsable",
    [{ value: "", libelle: "— aucun responsable" }].concat((ETAT.responsables || []).map(u => ({ value: u.id, libelle: u.nom }))),
    p.responsableId);
  respSel.querySelector("select").addEventListener("change", e => {
    p.responsableId = e.target.value; p.modifieLe = new Date().toISOString(); saveData();
  });
  const nouveauResp = h("details", {},
    h("summary", { style: { cursor: "pointer", color: "var(--blue)", minHeight: "44px", lineHeight: "44px" } }, "+ Ajouter un nouveau responsable"));
  const nomResp = champ("Nom", "text", "");
  const couleurResp = champ("Couleur (elle porte la bordure de ses cartes)", "color", "#3b82f6");
  nouveauResp.appendChild(nomResp); nouveauResp.appendChild(couleurResp);
  nouveauResp.appendChild(h("button", {
    class: "bouton petit", onclick: () => {
      const nomPropre = nomResp.querySelector("input").value.trim();
      if (!nomPropre) { toast("Donnez un nom."); return; }
      const u = { id: uid("u"), nom: nomPropre, couleur: couleurResp.querySelector("input").value };
      (ETAT.responsables = ETAT.responsables || []).push(u);
      p.responsableId = u.id;
      saveData(); fermerPanneau(); ouvrirPanneauProjet(p);
    }
  }, "Créer le responsable"));

  /* La couleur du projet : assignée à la création, stable dans le temps. */
  const couleur = h("div", { class: "note" },
    h("span", { class: "note-titre" }, "Couleur du projet : "),
    h("span", { class: "badge pastille", style: { background: p.couleur || "#545e68", color: "#fff" } }, "la pastille du projet"),
    " — assignée automatiquement à la création et stable : seule la couleur du responsable se choisit, c'est elle qui porte une signification durable.");

  /* Les scénarios rattachés. */
  const rattachement = h("div", { class: "groupe-champs" });
  function rendreTags() {
    rattachement.innerHTML = "";
    rattachement.appendChild(h("span", { class: "titre-groupe" }, "Les scénarios rattachés"));
    const lie = scenariosDeProjet(ETAT, p);
    if (lie.lies.length) {
      lie.lies.forEach((x, i) => {
        rattachement.appendChild(h("div", { class: "rangee", style: { alignItems: "center", borderBottom: "1px solid var(--filet)", paddingBottom: "6px" } },
          h("span", { style: { flex: "1" } },
            h("span", { class: "mono" }, (x.ligne ? codeLigneDe(x.ligne.nom) || x.ligne.nom : "?") + " · " + opCodeDe(x.op)),
            " · " + (x.ref ? x.ref.nom : "—") + " · " + x.sc.name),
          h("button", { class: "bouton petit danger", onclick: () => {
            p.tags.splice(i, 1); p.modifieLe = new Date().toISOString();
            saveData(); fermerPanneau(); ouvrirPanneauProjet(p);
          } }, "Détacher")));
      });
    } else {
      rattachement.appendChild(h("div", { class: "note" }, "Aucun scénario rattaché. On rattache depuis un poste : ouvrez un poste, puis « Étiqueter » sur le scénario."));
    }
    if (lie.orphelins.length) {
      rattachement.appendChild(h("div", { class: "note" }, lie.orphelins.length + " étiquette(s) pointe(nt) un scénario supprimé — elles restent comptées, elles ne polluent rien."));
    }
  }
  rendreTags();

  ouvrirPanneau(creation ? "Créer un projet" : "Le projet", "", [
    nom, desc, statut, cible, respSel, nouveauResp, couleur, rattachement,
    creation ? h("button", {
      class: "bouton primaire", onclick: () => {
        if (!p.nom) { toast("Donnez un nom au projet."); return; }
        (ETAT.projets = ETAT.projets || []).push(p);
        saveData(); fermerPanneau(); aller("projets");
      }
    }, "Créer le projet") : h("button", {
      class: "bouton danger", onclick: () => {
        confirmer("Supprimer le projet « " + p.nom + " » ? Les scénarios rattachés ne sont PAS supprimés — seules les étiquettes partent.",
          "Supprimer le projet", () => {
            ETAT.projets = ETAT.projets.filter(x => x.id !== p.id);
            if (VUE.filtreProjetId === p.id) VUE.filtreProjetId = "";
            saveData(); fermerPanneau(); aller("projets");
          }, { danger: true });
      }
    }, "Supprimer ce projet")
  ], { large: true });
}

/* Étiqueter un scénario dans des projets, depuis le poste. */
function ouvrirEtiquetage(ligne, ref, op, sc) {
  const projets = ETAT.projets || [];
  const contenu = h("div", {});
  if (!projets.length) {
    contenu.appendChild(h("div", { class: "aucun" }, "Aucun projet — créez-en un d'abord."));
  }
  projets.forEach(pj => {
    const deja = projetsDeScenario(ETAT, ligne.id, ref.id, op.id, sc.id).some(x => x.id === pj.id);
    const cb = h("input", { type: "checkbox", checked: deja, onchange: ev => {
      if (ev.target.checked) {
        pj.tags.push({ ligneId: ligne.id, referenceId: ref.id, opId: op.id, scenarioId: sc.id });
        toast("Rattaché à « " + pj.nom + " »");
      } else {
        pj.tags = pj.tags.filter(t => !(t.ligneId === ligne.id && t.referenceId === ref.id && t.opId === op.id && t.scenarioId === sc.id));
      }
      pj.modifieLe = new Date().toISOString();
      saveData();
    } });
    const resp = responsableDe(ETAT, pj);
    contenu.appendChild(h("label", { class: "champ", style: { display: "flex", gap: "10px", alignItems: "center" } }, cb,
      h("span", { class: "badge pastille", style: { background: pj.couleur || "#545e68", color: "#fff" } }, pj.nom),
      h("span", { style: { color: "var(--label)", fontSize: "12px" } }, resp ? resp.nom : "")));
  });
  contenu.appendChild(h("button", { class: "bouton", onclick: () => ouvrirPanneauProjet(null) }, "+ Créer un nouveau projet"));

  ouvrirPanneau("Étiqueter « " + sc.name + " »",
    "Un scénario peut appartenir à plusieurs projets à la fois — les étiquettes ne déplacent rien.", [contenu]);
}

/* ---- les données ---- */
function ouvrirPanneauDonnees() {
  const contenu = h("div", {});

  contenu.appendChild(h("div", { class: "groupe-champs" },
    h("span", { class: "titre-groupe" }, "Exporter"),
    h("p", { style: { fontSize: "13.5px", color: "var(--body)", marginTop: "0" } },
      "Un fichier JSON complet : tout ce qui est ici, photos comprises. Il ne part nulle part — il se passe de main en main."),
    h("button", { class: "bouton primaire", onclick: exporterEtat }, "Exporter le suivi")));

  const importBloc = h("div", { class: "groupe-champs" },
    h("span", { class: "titre-groupe" }, "Importer"));
  const input = h("input", { type: "file", accept: ".json,application/json", style: { marginTop: "8px" } });
  input.addEventListener("change", ev => {
    const fichier = ev.target.files && ev.target.files[0];
    if (!fichier) return;
    const rd = new FileReader();
    rd.onload = () => {
      let source;
      try { source = JSON.parse(rd.result); }
      catch (e) { toast("Ce fichier n'est pas un JSON lisible."); return; }
      proposerImport(source, fichier.name);
    };
    rd.readAsText(fichier);
  });
  importBloc.appendChild(h("p", { style: { fontSize: "13.5px", color: "var(--body)", marginTop: "0" } },
    "Lit un export de cet outil (format 9) ou de l'app de production (formats 5 à 8 — tout ce qu'elle a jamais produit). "
    + "La migration est sans perte : photos, plans, relevés Marposs et journal de rebut passent aussi. Le fichier est lu sur ce poste, rien n'est envoyé."));
  importBloc.appendChild(input);
  contenu.appendChild(importBloc);

  ouvrirPanneau("Données", "Tout reste sur ce poste", [contenu]);
}

function exporterEtat() {
  ETAT.exporteLe = new Date().toISOString();
  ETAT.exportePar = "";
  const blob = new Blob([JSON.stringify(ETAT, null, 1)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "SuiviOptimisation_v3_" + new Date().toISOString().slice(0, 10).replace(/-/g, "") + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast("Export téléchargé — passez-le à qui doit fusionner.");
}

/* Le choix d'import, avec le rapport qui compte et nomme. */
function proposerImport(source, nomFichier) {
  pousserSecours();
  const mig = normaliserEtat(source);
  if (!mig.ok) {
    ouvrirPanneau("Import impossible", nomFichier, [
      h("div", { class: "note" }, mig.erreur),
      h("p", { style: { fontSize: "13.5px", color: "var(--body)" } },
        "Ce fichier n'a pas la forme d'un export du suivi. Aucune donnée n'a été touchée ; un instantané de secours a été pris avant la tentative.")
    ]);
    return;
  }
  const r = mig.rapport;
  const rapport = h("div", { class: "note" },
    h("span", { class: "note-titre" }, "Ce qui entre :"),
    h("ul", { style: { margin: "6px 0 0 18px", padding: 0 } },
      h("li", {}, r.lignes + " ligne(s), " + r.references + " référence(s), " + r.ops + " opération(s)"),
      h("li", {}, r.scenarios + " scénario(s), " + r.outils + " porte-outil(s), " + r.logements + " logement(s)"),
      h("li", {}, r.essais + " essai(s), " + r.prelevements + " prélèvement(s)"),
      h("li", {}, r.photos + " photo(s), " + r.plans + " plan(s) de porte-outil, " + r.marposs + " relevé(s) Marposs, " + r.scrapLog + " entrée(s) de rebut"),
      h("li", {}, r.projets + " projet(s) (" + r.etiquettes + " étiquettes), " + r.responsables + " responsable(s)"),
      h("li", {}, r.livraisons + " livraison(s) figée(s), " + r.backlog + " entrée(s) de journal"),
      r.formatSource !== null ? h("li", {}, "format d'origine : " + r.formatSource + (r.toolVersion ? " (app " + r.toolVersion + ")" : "")) : null));
  const avert = (r.avertissements || []).map(a => h("div", { class: "note", style: { borderLeft: "3px solid var(--ambre)" } }, a));

  const contenu = [
    h("p", { style: { fontSize: "14px" } }, h("span", { class: "surbrillance" }, nomFichier)),
    rapport,
    avert,
    h("div", { class: "liste-actions" },
      h("button", {
        class: "bouton primaire", onclick: () => {
          const f = fusionnerEtat(ETAT, mig.etat);
          ETAT = f.etat;
          SOURCE_IMPORT = "fusion avec " + nomFichier + " (" + dateCourte() + ")";
          saveData(); fermerPanneau(); render();
          toast("Fusion : " + f.rapport.essaisAjoutes + " essai(s) ajouté(s), "
            + f.rapport.essaisGagnesArrivee + " mis à jour, " + f.rapport.essaisGardesLocaux + " gardé(s) du local.");
        }
      }, "Fusionner (recommandé)"),
      h("button", {
        class: "bouton danger", onclick: () => {
          confirmer("Remplacer TOUT l'état courant par ce fichier ? Les données locales actuelles ne restent que dans l'instantané de secours.",
            "Tout remplacer", () => {
              ETAT = mig.etat;
              SOURCE_IMPORT = "import complet de " + nomFichier + " (" + dateCourte() + ")";
              saveData(); fermerPanneau(); aller("accueil");
            }, { danger: true });
        }
      }, "Remplacer tout"))
  ];
  ouvrirPanneau("Importer", "Un instantané de secours a été pris avant ce choix", contenu, { large: true });
}

/* ---- la zone rouge : les instantanés ---- */
function ouvrirSecours() {
  const pile = lireSecours();
  const contenu = h("div", {});
  if (!pile.length) {
    contenu.appendChild(h("div", { class: "aucun" }, "Aucun instantané. Les secours se prennent avant chaque import, fusion ou réinitialisation."));
  }
  pile.forEach(s => {
    const mig = normaliserEtat(s.etat);
    const r = mig.ok ? mig.rapport : null;
    contenu.appendChild(h("div", { class: "carte", style: { boxShadow: "none", border: "1px solid var(--filet)" } },
      h("div", { class: "c-entete" },
        h("span", { class: "c-titre" }, "Instantané du " + dateHeure(s.date)),
        h("span", { class: "droite liste-actions", style: { margin: 0 } },
          h("button", {
            class: "bouton petit", onclick: () => {
              confirmer("Restaurer cet instantané ? L'état courant sera d'abord poussé au fond du tiroir des secours.",
                "Restaurer", () => {
                  pousserSecours();
                  ETAT = s.etat;
                  SOURCE_IMPORT = "instantané restauré du " + dateCourte();
                  saveData(); fermerPanneau(); aller("accueil");
                });
            }
          }, "Restaurer"))),
      r ? h("div", { style: { color: "var(--label)", fontSize: "12.5px" } },
        r.lignes + " ligne(s) · " + r.scenarios + " scénario(s) · " + r.essais + " essai(s) · " + r.projets + " projet(s)") : null));
  });
  ouvrirPanneau("Restaurer un instantané", "Zone rouge — chaque restauration est réfléchie", [contenu]);
}

/* ============================================================================
   LE RENDU ET LE DÉMARRAGE
   ========================================================================== */

function render() {
  const racine = document.getElementById("app");
  if (!racine) return;
  racine.innerHTML = "";

  let page;
  if (VUE.ecran === "accueil") page = renderAccueil();
  else if (VUE.ecran === "ligne") page = renderLigne();
  else if (VUE.ecran === "poste") page = renderPoste();
  else if (VUE.ecran === "emporter") page = renderEmporter();
  else if (VUE.ecran === "projets") page = renderProjets();
  else page = renderAccueil();

  racine.appendChild(topbarDOM());
  racine.appendChild(page);
  racine.appendChild(piedDOM());
}

/* Le démarrage : le thème d'abord (pas de flash), l'état ensuite, l'écran enfin.
   Toute globale est déclarée avant usage — le piège TDZ de l'ancienne app
   (repli silencieux sur l'exemple, zéro message) ne doit pas se reproduire. */
function demarrer() {
  try {
    const t = localStorage.getItem(THEME_KEY);
    document.documentElement.setAttribute("data-theme", t === "nuit" ? "nuit" : "jour");
  } catch (e) { document.documentElement.setAttribute("data-theme", "jour"); }
  chargerEtatInitial();
  render();
}

if (typeof document !== "undefined") {
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", demarrer);
  else demarrer();
}

</script>

<body>
<div id="app"></div>
<script>
/* Le service worker : cache versionné, mis à jour dès qu'on en a fini.
   Si l'enregistrement échoue (file://, ancien navigateur), l'outil tourne
   pareil — il est déjà hors ligne par nature. */
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () { /* silencieux : l'outil est déjà offline */ });
  });
}
</script>

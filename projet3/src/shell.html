<title>Suivi optimisation SPK — Sept Fons</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<!-- @CSS@ -->
<!-- @SCRIPTS@ -->
</head>
<body>
<div id="app"></div>
<script>
/* Le service worker : cache versionné, mis à jour dès qu'on en a fini.
   Si l'enregistrement échoue (file://, ancien navigateur), l'outil tourne
   pareil — il est déjà hors ligne par nature. */
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () { /* silencieux : l'outil est déjà offline */ });
  });
}
</script>
</body>
</html>
